<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wiki-Agentic Knowledge Graph</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1117; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }

  #canvas { width: 100vw; height: 100vh; }

  /* Links */
  .link { stroke-opacity: 0.5; }
  .link.curated { stroke-opacity: 0.8; }
  .link.same_domain { stroke-opacity: 0.2; stroke-dasharray: 3,4; }
  .link.highlighted { stroke-opacity: 1 !important; stroke-width: 2.5px !important; }
  .link.faded { stroke-opacity: 0.04 !important; }

  /* Nodes */
  .node circle { stroke: #1a1f2e; stroke-width: 1.5px; cursor: pointer; transition: r 0.15s; }
  .node circle:hover { stroke: #fff; stroke-width: 2px; }
  .node.highlighted circle { stroke: #fff; stroke-width: 2.5px; }
  .node.faded circle { opacity: 0.12; }
  .node.faded text { opacity: 0.08; }

  .node text {
    font-size: 10px; fill: #ccc; pointer-events: none;
    text-shadow: 0 0 3px #0f1117, 0 0 3px #0f1117;
  }
  .node.highlighted text { fill: #fff; font-weight: 600; }

  /* Tooltip */
  #tooltip {
    position: fixed; pointer-events: none; display: none;
    background: rgba(18,22,36,0.97); border: 1px solid #2a3050;
    border-radius: 8px; padding: 12px 15px; max-width: 340px;
    font-size: 12px; line-height: 1.5; z-index: 999;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }
  #tooltip .t-title { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 6px; }
  #tooltip .t-meta { color: #7a8ba8; margin-bottom: 6px; font-size: 11px; }
  #tooltip .t-thesis { color: #b8c4d8; font-style: italic; }
  #tooltip .t-badge {
    display: inline-block; padding: 1px 7px; border-radius: 4px;
    font-size: 10px; font-weight: 600; margin-right: 4px;
  }

  /* Edge tooltip */
  #edge-tooltip {
    position: fixed; pointer-events: none; display: none;
    background: rgba(18,22,36,0.95); border: 1px solid #2a3050;
    border-radius: 5px; padding: 5px 9px; font-size: 11px; color: #9ab;
    z-index: 998;
  }

  /* Legend + controls */
  #panel {
    position: fixed; top: 16px; left: 16px; z-index: 100;
    display: flex; flex-direction: column; gap: 10px;
  }
  #legend {
    background: rgba(18,22,36,0.9); border: 1px solid #2a3050;
    border-radius: 8px; padding: 12px 14px; min-width: 180px;
  }
  #legend h3 { font-size: 11px; color: #7a8ba8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 12px; cursor: pointer; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .legend-item.inactive { opacity: 0.35; }

  #controls {
    background: rgba(18,22,36,0.9); border: 1px solid #2a3050;
    border-radius: 8px; padding: 10px 14px;
  }
  #controls h3 { font-size: 11px; color: #7a8ba8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  #search { width: 100%; background: #1a1f2e; border: 1px solid #2a3050; color: #e0e0e0; padding: 5px 8px; border-radius: 5px; font-size: 12px; outline: none; }
  #search:focus { border-color: #4a6fa5; }
  #search::placeholder { color: #4a5568; }

  #stats {
    background: rgba(18,22,36,0.9); border: 1px solid #2a3050;
    border-radius: 8px; padding: 8px 14px; font-size: 11px; color: #6a7a90;
  }

  /* Edge filter */
  #edge-filter { margin-top: 8px; }
  #edge-filter label { font-size: 11px; color: #7a8ba8; display: flex; align-items: center; gap: 5px; cursor: pointer; }
  #edge-filter input { accent-color: #4a6fa5; }

  /* Help */
  #help { position: fixed; bottom: 16px; right: 16px; font-size: 10px; color: #3a4a5a; text-align: right; }
</style>
</head>
<body>
<svg id="canvas"></svg>

<div id="panel">
  <div id="legend">
    <h3>Domain</h3>
    <div id="legend-items"></div>
  </div>
  <div id="controls">
    <h3>Search</h3>
    <input id="search" type="text" placeholder="Filter nodes…" autocomplete="off">
    <div id="edge-filter">
      <label><input type="checkbox" id="hide-auto" checked> Hide same_domain edges</label>
    </div>
  </div>
  <div id="stats" id="stats-box"></div>
</div>

<div id="tooltip"></div>
<div id="edge-tooltip"></div>

<div id="help">
  Scroll: zoom · Drag: pan · Click node: highlight · Esc: clear
</div>

": 3, "tags": ["duration", "bond_portfolio", "immunization", "fixed_income", "rebalancing"], "thesis": "Institutional bond portfolios implicitly or explicitly maintain a stable duration target via periodic rebalancing, creating a predictable convergence toward initial yield at the 'effective maturity' horizon (≈ 2× duration target), regardless of the yield path taken.", "stability": "evolving", "date_updated": "2026-05-22"}, {"id": "ecb_new_operational_framework_frm_001", "title": "ECB New Operational Framework 2024", "type": "framework", "domain": "monetary_policy", "confidence": 3, "tags": ["ecb", "operational_framework", "floor_system", "dfr", "mro"], "thesis": "The ECB's 2024 framework is a hybrid \"range floor\" system that steers the overnight market rate (€STR) near the Deposit Facility Rate (DFR) using structural reserves and a narrowed 15bps spread to the Main Refinancing Operations (MRO) rate.\n", "stability": "evolving", "date_updated": "2026-05-20"}, {"id": "fed_ample_reserves_range_floor_frm_001", "title": "Fed Ample Reserves Range Floor Framework", "type": "framework", "domain": "monetary_policy", "confidence": 3, "tags": ["fed", "operational_framework", "floor_system", "iorb", "on_rrp", "ffr"], "thesis": "The Fed maintains a \"range floor\" for the Federal Funds Rate (FFR) using two administered rates — IORB for banks and ON RRP for non-banks — to manage market segmentation and ensure rate control within an ample reserves regime.\n", "stability": "stable", "date_updated": "2026-05-20"}, {"id": "fed_fiscal_agent_treasury_relationship_frm_001", "title": "Fed Fiscal Agent Treasury Relationship", "type": "framework", "domain": "monetary_policy", "confidence": 4, "tags": ["fed", "treasury", "fiscal-agent", "governance", "operational-framework"], "thesis": "The Federal Reserve Banks act as the fiscal agent for the U.S. Treasury, managing the Treasury General Account (TGA),  processing daily financial transactions, and facilitating the auction and redemption const domainColors = {
  monetary_policy:  "#4a9eca",
  financial_markets:"#e88a3a",
  fiscal_policy:    "#6abf69",
  basel_risk:       "#b57ae8",
  unknown:          "#7a8ba8",
};
const domainLabels = {
  monetary_policy:  "Monetary Policy",
  financial_markets:"Financial Markets",
  fiscal_policy:    "Fiscal Policy",
  basel_risk:       "Basel / Risk",
  unknown:          "Other",
};

const nodeColor = d => domainColors[d.domain] || domainColors.unknown;
const nodeRadius = d => 4 + (d.confidence || 1) * 2.2;

// ── SVG setup ────────────────────────────────────────────────────────────────
const svg = d3.select("#canvas");
const width  = window.innerWidth;
const height = window.innerHeight;
svg.attr("viewBox", [0, 0, width, height]);

const g = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.15, 4]).on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

// ── Defs: arrowhead markers ──────────────────────────────────────────────────
const defs = svg.append("defs");
Object.entries(domainColors).forEach(([domain, color]) => {
  defs.append("marker")
    .attr("id", `arrow-${domain}`)
    .attr("viewBox", "0 -4 8 8")
    .attr("refX", 14).attr("refY", 0)
    .attr("markerWidth", 5).attr("markerHeight", 5)
    .attr("orient", "auto")
    .append("path").attr("d", "M0,-4L8,0L0,4").attr("fill", color).attr("opacity", 0.6);
});

// ── Build graph ──────────────────────────────────────────────────────────────
const nodeMap = new Map(GRAPH_DATA.nodes.map(n => [n.id, n]));
let showAutoEdges = false; // start hidden (checkbox checked = hide)

let links = GRAPH_DATA.edges.map(e => ({...e, isCurated: e.relation !== "same_domain"}));
let nodes = GRAPH_DATA.nodes.map(d => ({...d}));

// ── Force simulation ─────────────────────────────────────────────────────────
const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(d => d.relation === "same_domain" ? 120 : 70).strength(d => d.relation === "same_domain" ? 0.05 : 0.4))
  .force("charge", d3.forceManyBody().strength(-280).distanceMax(400))
  .force("center", d3.forceCenter(width/2, height/2))
  .force("collide", d3.forceCollide(d => nodeRadius(d) + 6))
  .alphaDecay(0.025);

// ── Render links ─────────────────────────────────────────────────────────────
const linkLayer = g.append("g").attr("class", "links");
let linkSel = renderLinks();

function renderLinks() {
  const visible = showAutoEdges ? links : links.filter(l => l.isCurated);
  const sel = linkLayer.selectAll("line")
    .data(visible, d => `${d.source.id||d.source}→${d.target.id||d.target}`)
    .join("line")
    .attr("class", d => `link ${d.relation === "same_domain" ? "same_domain" : "curated"}`)
    .attr("stroke", d => {
      const src = nodeMap.get(d.source.id || d.source);
      return src ? (domainColors[src.domain] || "#4a6fa5") : "#4a6fa5";
    })
    .attr("stroke-width", d => d.relation === "same_domain" ? 0.8 : 1.4)
    .attr("marker-end", d => {
      if (d.relation === "same_domain") return null;
      const src = nodeMap.get(d.source.id || d.source);
      const domain = src ? (src.domain || "unknown") : "unknown";
      return `url(#arrow-${domain})`;
    })
    .on("mouseover", (event, d) => {
      if (d.relation === "same_domain") return;
      const et = document.getElementById("edge-tooltip");
      et.style.display = "block";
      et.textContent = d.relation || "";
    })
    .on("mousemove", event => {
      const et = document.getElementById("edge-tooltip");
      et.style.left = (event.clientX + 12) + "px";
      et.style.top  = (event.clientY - 10) + "px";
    })
    .on("mouseout", () => { document.getElementById("edge-tooltip").style.display = "none"; });
  return sel;
}

// ── Render nodes ─────────────────────────────────────────────────────────────
const nodeLayer = g.append("g").attr("class", "nodes");
const nodeSel = nodeLayer.selectAll(".node")
  .data(nodes, d => d.id)
  .join("g")
    .attr("class", "node")
    .call(d3.drag()
      .on("start", (event, d) => { if (!event.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on("drag",  (event, d) => { d.fx=event.x; d.fy=event.y; })
      .on("end",   (event, d) => { if (!event.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }))
    .on("click", nodeClick)
    .on("mouseover", nodeHover)
    .on("mouseout",  nodeOut);

nodeSel.append("circle")
  .attr("r", nodeRadius)
  .attr("fill", nodeColor);

nodeSel.append("text")
  .attr("x", d => nodeRadius(d) + 3)
  .attr("y", "0.35em")
  .text(d => d.title.length > 32 ? d.title.slice(0, 30) + "…" : d.title);

// ── Tick ─────────────────────────────────────────────────────────────────────
sim.on("tick", () => {
  linkSel
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
});

// ── Legend ───────────────────────────────────────────────────────────────────
const domains = [...new Set(nodes.map(n => n.domain))];
const legendEl = document.getElementById("legend-items");
const activeDomains = new Set(domains);

domains.forEach(domain => {
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `<div class="legend-dot" style="background:${domainColors[domain]||'#7a8ba8'}"></div><span>${domainLabels[domain]||domain}</span>`;
  item.addEventListener("click", () => {
    if (activeDomains.has(domain)) activeDomains.delete(domain);
    else activeDomains.add(domain);
    item.classList.toggle("inactive");
    applyDomainFilter();
  });
  legendEl.appendChild(item);
});

function applyDomainFilter() {
  nodeSel.classed("faded", d => !activeDomains.has(d.domain));
  const activeIds = new Set(nodes.filter(n => activeDomains.has(n.domain)).map(n => n.id));
  linkSel.classed("faded", d => !activeIds.has(d.source.id) || !activeIds.has(d.target.id));
}

// ── Stats box ────────────────────────────────────────────────────────────────
const statsBox = document.getElementById("stats");
function updateStats(nodeData) {
  if (!nodeData) {
    statsBox.innerHTML = `${nodes.length} nodes · ${links.length} edges`;
  } else {
    const neighbours = links.filter(l =>
      (l.source.id||l.source) === nodeData.id || (l.target.id||l.target) === nodeData.id
    ).length;
    statsBox.innerHTML = `<b>${nodeData.title}</b><br>Conf ${nodeData.confidence} · ${neighbours} connections`;
  }
}
updateStats(null);

// ── Tooltip ──────────────────────────────────────────────────────────────────
const tt = document.getElementById("tooltip");
function nodeHover(event, d) {
  const color = domainColors[d.domain] || "#7a8ba8";
  const tags = (d.tags||[]).slice(0,5).map(t => `<span class="t-badge" style="background:${color}22;color:${color}">${t}</span>`).join("");
  tt.style.display = "block";
  tt.innerHTML = `
    <div class="t-title">${d.title}</div>
    <div class="t-meta">
      <span class="t-badge" style="background:${color}33;color:${color}">${domainLabels[d.domain]||d.domain}</span>
      <span class="t-badge" style="background:#2a3050;color:#9ab">${d.type}</span>
      Conf: ${d.confidence} · ${d.stability}
    </div>
    ${tags ? `<div style="margin-bottom:6px">${tags}</div>` : ""}
    <div class="t-thesis">${d.thesis || "—"}</div>
  `;
  updateStats(d);
}
function nodeOut() {
  tt.style.display = "none";
  updateStats(null);
}
svg.on("mousemove", event => {
  tt.style.left = Math.min(event.clientX + 16, window.innerWidth - 360) + "px";
  tt.style.top  = Math.min(event.clientY + 10, window.innerHeight - 200) + "px";
});

// ── Highlight on click ───────────────────────────────────────────────────────
let selectedNode = null;

function nodeClick(event, d) {
  event.stopPropagation();
  if (selectedNode === d.id) { clearHighlight(); return; }
  selectedNode = d.id;

  const neighbourIds = new Set([d.id]);
  const visLinks = showAutoEdges ? links : links.filter(l => l.isCurated);
  visLinks.forEach(l => {
    if ((l.source.id||l.source) === d.id) neighbourIds.add(l.target.id||l.target);
    if ((l.target.id||l.target) === d.id) neighbourIds.add(l.source.id||l.source);
  });

  nodeSel.classed("highlighted", n => n.id === d.id)
         .classed("faded", n => !neighbourIds.has(n.id) && activeDomains.has(n.domain));
  linkSel.classed("highlighted", l => (l.source.id||l.source) === d.id || (l.target.id||l.target) === d.id)
         .classed("faded", l => !neighbourIds.has(l.source.id||l.source) && !neighbourIds.has(l.target.id||l.target));
}

svg.on("click", clearHighlight);
document.addEventListener("keydown", e => { if (e.key === "Escape") clearHighlight(); });

function clearHighlight() {
  selectedNode = null;
  nodeSel.classed("highlighted", false).classed("faded", false);
  linkSel.classed("highlighted", false).classed("faded", false);
  applyDomainFilter();
}

// ── Search ───────────────────────────────────────────────────────────────────
document.getElementById("search").addEventListener("input", function() {
  const q = this.value.trim().toLowerCase();
  if (!q) { clearHighlight(); return; }
  nodeSel.classed("highlighted", d => d.title.toLowerCase().includes(q) || (d.tags||[]).some(t => t.includes(q)))
         .classed("faded", d => !d.title.toLowerCase().includes(q) && !(d.tags||[]).some(t => t.includes(q)));
  linkSel.classed("faded", true).classed("highlighted", false);
});

// ── Edge filter toggle ───────────────────────────────────────────────────────
document.getElementById("hide-auto").addEventListener("change", function() {
  showAutoEdges = !this.checked;
  linkSel = renderLinks();
  sim.force("link").links(showAutoEdges ? links : links.filter(l => l.isCurated));
  sim.alpha(0.3).restart();
});

// ── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener("resize", () => {
  svg.attr("viewBox", [0, 0, window.innerWidth, window.innerHeight]);
  sim.force("center", d3.forceCenter(window.innerWidth/2, window.innerHeight/2)).alpha(0.1).restart();
});
</script>
</body>
</html>
