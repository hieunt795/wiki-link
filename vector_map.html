ng a greater commitment and higher political cost, and full YCC reserved only when inflation is persistently subdued."}, {"x": 8.939830780029297, "y": 24.637296676635742, "z": 2.223483085632324, "id": "pboc_monetary_policy_framework_and_interest_rate_transmission_001", "title": "PBOC Monetary Policy Framework And Interest Rate Transmission", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The PBOC operates a hybrid quantity-price framework where M2+TSF serve as intermediate targets, DR007 is the operational target, and the 7-day OMO reverse repo is the primary policy rate since July 2024 \u2014 supported by an asymmetric SLF/excess-reserve corridor, multiple structural facilities, and discretionary window guidance."}, {"x": 8.564891815185547, "y": 24.300411224365234, "z": -2.6089534759521484, "id": "ecb_new_operational_framework_frm_001", "title": "ECB New Operational Framework 2024", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The ECB's 2024 framework is a hybrid \"range floor\" system that steers the overnight market rate (\u20acSTR) near the Deposit Facility Rate (DFR) using structural reserves and a narrowed 15bps spread to the Main Refinancing Operations (MRO) rate.\n"}, {"x": 1.9151721000671387, "y": 20.418195724487305, "z": 4.389998435974121, "id": "cb_balance_sheet_trilemma_frm_001", "title": "Central Bank Balance Sheet Trilemma", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "A central bank cannot simultaneously achieve three objectives: (1) a small balance sheet, (2) low short-term rate volatility, and (3) limited intervention in money markets. Only two can be achieved at once in a given regulatory and operational environment.\n"}, {"x": 26.825931549072266, "y": -0.11495282500982285, "z": 2.9416799545288086, "id": "imf_sna_real_sector_accounting_gdp_identities_and_sectoral_accounts_001", "title": "IMF SNA Real Sector Accounting GDP Identities And Sectoral Accounts", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The 1993 SNA framework measures GDP via three equivalent approaches (production/income/expenditure), organizes each sector's transactions through a sequence of accounts from production to capital formation, and generates the fundamental identity that the current account equals the private saving-investment gap plus the fiscal balance \u2014 the backbone of IMF Article IV analysis."}, {"x": 12.631205558776855, "y": 20.10906982421875, "z": 2.5248656272888184, "id": "japan_sovereign_carry_trade_frm_001", "title": "Japan Sovereign Carry Trade Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Japanese public sector (government + BoJ + pension funds) operates as a giant, leveraged sovereign wealth fund that borrows at floating short-term rates (bank reserves) to fund long-duration risky assets (equities and foreign securities), creating a massive sensitivity to rising interest rates.\n"}, {"x": 8.870908737182617, "y": 20.792659759521484, "z": -4.873841762542725, "id": "fed_ample_reserves_range_floor_frm_001", "title": "Fed Ample Reserves Range Floor Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed maintains a \"range floor\" for the Federal Funds Rate (FFR) using two administered rates \u2014 IORB for banks and ON RRP for non-banks \u2014 to manage market segmentation and ensure rate control within an ample reserves regime.\n"}, {"x": 14.42966365814209, "y": 3.199216604232788, "z": -2.7752737998962402, "id": "cb_reserve_requirements_taxonomy_surplus_001", "title": "CB Reserve Requirements Taxonomy And Surplus Shortage Liquidity Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Reserve requirements serve five distinct policy purposes (monetary policy, liquidity management, structural liquidity, revenue, and sectoral behaviour); separately, whether a CB operates with a liquidity surplus (asset-driven balance sheet, e.g. FX intervention, debt monetisation) or shortage (liability-driven, e.g. inflation targeting with floating rate) fundamentally shapes the effectiveness of monetary policy transmission, CB income, and CB's ability to control terms of market operations."}, {"x": 2.2563862800598145, "y": 6.335832595825195, "z": -6.797014236450195, "id": "private_credit_stress_monitoring_001", "title": "Private Credit Stress Monitoring Framework", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "[LLM] Since private credit fund NAVs are model-based and not continuously observable, stress monitoring must rely on four observable proxy layers: (1) BDC discount to NAV as the public-market window into opaque portfolios, (2) credit secondary market clearing prices vs. reported NAV, (3) repurchase cap breaches in semi-liquid funds, and (4) bank credit line utilization to PC vehicles. These four signals form a real-time transmission chain that can detect the inversion of the [[Private_Credit_Reflexive_Loop]] without depending on manager marks.\n"}, {"x": -0.7213569283485413, "y": 10.479257583618164, "z": -1.9160923957824707, "id": "basel_iii_endgame_001", "title": "Basel III Endgame \u2014 Capital, Liquidity, and Credit Migration", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Basel III and its Endgame extensions create a structured causal chain: RWA requirements + output floor + leverage ratio + LCR/NSFR raise the cost of holding specialized and long-duration corporate credit \u2192 banks are driven from originate-to-hold to originate-to-distribute \u2192 private credit funds fill the financing gap, reaching $2.1T globally. Critically, risk is not eliminated but redistributed: bank solvency risk converts to network liquidity risk in the bank-NBFI interconnected system.\n"}, {"x": 26.993804931640625, "y": -1.2753593921661377, "z": 2.260394334793091, "id": "imf_gfs_fiscal_accounting_framework_deficit_measurement_and_sustainability_001", "title": "IMF GFS Fiscal Accounting Framework Deficit Measurement And Sustainability", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "The IMF Government Finance Statistics framework measures the fiscal deficit through revenue-expenditure-net lending accounts, decomposes it into conventional/primary/operational measures, traces financing into bank/non-bank/external categories, and assesses sustainability via the debt dynamics equation \u2014 the standard IMF financial programming fiscal module."}, {"x": 2.0908470153808594, "y": 15.133831024169922, "z": -7.074887752532959, "id": "fed_volatility_suppressor_secured_standard_001", "title": "Fed Volatility Suppressor and Secured Standard Evolution", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Post-GFC, regulators engineered a transition from an unsecured to a secured lending standard (LIBOR \u2192 SOFR, Fed Funds \u2192 repo/IORB), forcing banks to become utilities constrained by Basel III while shadow banks absorbed risk. However, this created a paradox: Treasuries \u2014 the collateral powering the secured standard \u2014 are only truly \"risk-free\" when the Fed commits to buying them without limit. The Fed's \"volatility suppressor\" (unlimited QE commitment) emerged as the necessary backstop of the secured standard, meaning every Basel III tightening increases reliance on Fed intervention. The RRP \u2192 SRF escalation ladder operates as a \"Not-QE\" buffer that allows the Fed to stimulate without a formal pivot.\n"}, {"x": 1.2309527397155762, "y": 16.83146858215332, "z": 21.224441528320312, "id": "pbc_dual_track_monetary_policy_framework_001", "title": "PBC Dual-Track Monetary Policy Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The PBC operates a dual-track monetary policy framework combining price-based instruments (interest rates) and quantity-based instruments (RRR, credit quotas, structural facilities), constrained by a managed-float exchange rate and partial capital account controls that limit the degree of monetary autonomy \u2014 unlike advanced-economy central banks that rely almost exclusively on interest rate policy. [LLM]"}, {"x": -18.532011032104492, "y": -5.187455177307129, "z": -0.05653698742389679, "id": "duration_targeting_bond_portfolio_framework_001", "title": "Duration Targeting Bond Portfolio Framework", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Institutional bond portfolios implicitly or explicitly maintain a stable duration target via periodic rebalancing, creating a predictable convergence toward initial yield at the 'effective maturity' horizon (\u2248 2\u00d7 duration target), regardless of the yield path taken."}, {"x": 20.938447952270508, "y": 9.661699295043945, "z": 2.5753870010375977, "id": "imf_monetary_analysis_quantity_theory_velocity_and_exchange_rate_regimes_001", "title": "IMF Monetary Analysis Quantity Theory Velocity And Exchange Rate Regimes", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "IMF monetary analysis builds from the quantity equation (MV=PY) through demand for money (income elastic, opportunity-cost elastic) to the money multiplier mm=(c+1)/(c+r), showing that under fixed exchange rates money supply is endogenous and monetary autonomy requires a floating regime, with sterilization as a costly short-term offset."}, {"x": 14.07508373260498, "y": 8.876398086547852, "z": 12.572784423828125, "id": "inflation_targeting_001", "title": "Inflation Targeting Framework (ITF) and Post-GFC Policy Mix", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Inflation Targeting Framework (ITF), pioneered by New Zealand (1988), achieved price stability through four pillars: a published inflation target, interest-rate consistency (Taylor rule), CB independence, and transparency. While successful pre-GFC, the framework proved insufficient alone \u2014 the post-GFC paradigm adds macroprudential policy, FX market intervention, and capital flow management to achieve the dual mandate of price stability AND financial system stability.\n"}, {"x": 8.25915241241455, "y": 14.77248764038086, "z": -3.027409791946411, "id": "global_dollar_system_eurodollar_architecture_001", "title": "Global Dollar System Eurodollar Architecture", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "The global dollar system is a network of 26+ interconnected offshore dollar funding markets \u2014 including FX swaps, Eurodollars, cross-currency basis swaps, and international repos \u2014 in which countries are not merely users but essential structural components. The system cannot function if key participants (e.g. French banks in European repo, Australian banks in FX swaps) withdraw, making it self-reinforcing despite its structural fragilities."}, {"x": 6.671988010406494, "y": 20.040355682373047, "z": 8.95782470703125, "id": "fed_fiscal_agent_treasury_relationship_frm_001", "title": "Fed Fiscal Agent Treasury Relationship", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Federal Reserve Banks act as the fiscal agent for the U.S. Treasury, managing the Treasury General Account (TGA),  processing daily financial transactions, and facilitating the auction and redemption of government securities.  This operational role is distinct from monetary policy, with the Fed following mandates and regulations  issued by the Treasury Department.\n"}, {"x": 23.79351806640625, "y": -3.5017786026000977, "z": 1.5290251970291138, "id": "imf_balance_of_payments_framework_and_external_account_analysis_001", "title": "IMF Balance of Payments Framework and External Account Analysis", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The BoP records all resident/non-resident transactions using double-entry accounting; key analytical tools are the current/capital/financial account identity, debt sustainability indicators (PV/exports threshold 220%), and reserve adequacy rules (3-month import cover; Greenspan-Guidotti monetary base rule)."}, {"x": 10.841384887695312, "y": 5.616360187530518, "z": 3.1026623249053955, "id": "monetary_policy_instruments_operational_framework_001", "title": "Monetary Policy Instruments Operational Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Central bank monetary policy implementation rests on three instruments: open market operations (CB-initiated), standing facilities (bank-initiated, creating the interest rate corridor), and reserve requirements. The separation principle holds that implementation (achieving the target rate) is institutionally distinct from monetary macroeconomics (identifying the target rate), with the dichotomy breaking down only in financial crises."}, {"x": 1.2710317373275757, "y": 11.378345489501953, "z": -0.4216703474521637, "id": "basel_regional_implementation_dynamics_001", "title": "Basel Regional Implementation Dynamics", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "[LLM] The same Basel III framework produces dramatically different private credit market outcomes across regions because initial banking structures differ: the US (market-centric, gold-plating) created the world's deepest PC market post-2008; the EU (bank-centric) faces a larger Output Floor shock (MRC +21.3%) now generating the largest structural white space; APAC/Vietnam applies Basel more flexibly but faces a delayed catalyst as capital requirements tighten toward 2027\u20132030.\n"}, {"x": 24.783830642700195, "y": 11.974735260009766, "z": 0.990257203578949, "id": "supply_shock_scenario_taxonomy_frm_001", "title": "Supply Shock Policy Response Scenario Taxonomy", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "A decision-making framework that partitions potential outcomes of a supply shock into discrete scenarios based on shock persistence and the emergence of second-round effects, allowing central banks to communicate state-contingent policy paths rather than a single forecast. [LLM]\n"}, {"x": 6.318431854248047, "y": 23.398700714111328, "z": -2.8661434650421143, "id": "fed_reserve_demand_reduction_tools_001", "title": "Fed Reserve Demand Reduction Four Policy Tools", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "If the Fed aims to reduce the size of its balance sheet, four enabling policy tools can reduce the minimum required quantity of reserve balances without disrupting monetary policy implementation: (1) Temporary Open Market Operations (TOMOs) to sterilize unintended reserve shocks (TGA changes, FBO quarter-end window dressing); (2) revising liquidity regulations to reduce GSIB aversion to using Fed facilities; (3) adding a Liquidity Savings Mechanism (LSM) to Fedwire; and (4) tiering the IORB rate so banks with excess reserves prefer to lend them rather than hoard. The UK (BoE demand-driven approach) and Norway/New Zealand (IORB tiering) provide empirical precedents."}, {"x": 3.5251548290252686, "y": 21.55172348022461, "z": 2.0528335571289062, "id": "fed_treasury_accord_2026_frm_001", "title": "New Fed-Treasury Accord (2026 Proposal)", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The 2026 Accord proposal redefines the boundary between fiscal and monetary policy by returning control of debt maturity structure to the Treasury and narrowing the Fed's mandate to price stability, thereby reducing the Fed's market footprint and its role in deficit monetization.\n"}, {"x": 14.403284072875977, "y": -1.458701252937317, "z": 4.207402229309082, "id": "central_bank_balance_sheet_structure_liabilities_assets_001", "title": "Central Bank Balance Sheet Structure Liabilities Assets", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The central bank balance sheet has banknotes and bank reserves as primary liabilities (together forming the monetary base) and domestic securities, credit operations, and foreign assets on the asset side. Reserves are created mechanically when the CB buys assets or lends to banks \u2014 they cannot be lent to the real economy directly, only transmitted through the banking system via credit creation."}, {"x": 25.452194213867188, "y": -2.327382802963257, "z": 2.6267762184143066, "id": "imf_flow_of_funds_4_sector_consistency_framework_001", "title": "IMF Flow Of Funds 4-Sector Consistency Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The IMF Flow of Funds framework integrates SNA, GFS, BoPM, and monetary survey into a quadruple-entry matrix where sectoral saving-investment gaps (Sp-Ip) + (Sg-Ig) = CAB, and every sector's real deficit is fully financed by financial transactions \u2014 forming the accounting backbone of IMF financial programming."}, {"x": 1.772892713546753, "y": 19.07390785217285, "z": 17.928089141845703, "id": "fed_balance_sheet_trilemma_small_stable_minimal_001", "title": "Fed Balance Sheet Trilemma Small-Stable-Minimal", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed faces a balance sheet trilemma: it can simultaneously achieve only two of (1) small balance sheet, (2) low short-term rate volatility, and (3) limited money market intervention \u2014 in its current configuration, the balance sheet cannot shrink further without accepting either greater rate volatility or more interventionist market operations; the trilemma is \"local\" (given current rules/institutions) and can be broken by changing global parameters such as TGA management reform or Standing Repo Facility improvements. [LLM]"}, {"x": 15.282841682434082, "y": 10.27810287475586, "z": -4.022693157196045, "id": "mptm_framework_001", "title": "Monetary Policy Transmission Mechanism \u2014 All Channels", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The monetary policy transmission mechanism (MPTM) maps the process by which central bank interest rate decisions propagate through 7 channels \u2014 interest rate, asset price, exchange rate, expectations, bank lending, bank capital, and balance sheet \u2014 to ultimately affect inflation and output. The \"money view\" channels (interest rate, asset price, exchange rate) assume efficient financial markets; the \"credit view\" channels (lending, capital, balance sheet) emphasize financial frictions, asymmetric information, and the financial accelerator. The risk-taking channel adds a post-GFC dimension: low rates reduce risk perception, inducing excessive risk-taking. Total lag from policy to full effect: typically 6-8 quarters.\n"}, {"x": 19.964494705200195, "y": -4.129047870635986, "z": 1.6045368909835815, "id": "imf_monetary_survey_and_reserve_money_identity_framework_001", "title": "IMF Monetary Survey And Reserve Money Identity Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The IMF Monetary Survey consolidates Monetary Authorities and Deposit Money Banks into a single balance sheet where M2 = NFA + NDA (net foreign assets plus net domestic credit), and reserve money growth is driven by changes in NFA, net claims on government, claims on banks, and other net items \u2014 the core identity underlying IMF financial programming."}, {"x": 3.389493227005005, "y": 10.9909029006958, "z": -1.5937364101409912, "id": "china_shadow_banking_wmp_trust_001", "title": "China Shadow Banking WMP Trust Structure and CBIRC Shutdown", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "China's shadow banking system emerged ~2000 as banks invented off-balance-sheet instruments (WMPs, entrusted loans, trust loans) to bypass a 75% loan-to-deposit ratio cap and fund credit-starved private firms ignored by the state-owned Big Four. Shadow assets peaked at ~90% of GDP in 2016, then declined to ~39% by Q2 2023 after regulators systematically penalized shadow instruments. Unlike the complex multi-layer US shadow system (CDOs, SIVs), China's was simpler \u2014 mainly trust companies and securities firms repackaging bank deposits as \"investment receivables\" \u2014 but equally capable of obscuring systemic risk.\n"}, {"x": 1.836374282836914, "y": 18.955360412597656, "z": 19.096282958984375, "id": "fed_balance_sheet_size_and_policy_rate_independence_001", "title": "Fed Balance Sheet Size and Policy Rate Independence", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The claim that Fed balance sheet reduction \"creates room\" for rate cuts is mechanically flawed: in an ample reserves regime, balance sheet size and the fed funds rate are independent instruments \u2014 QT drains reserves but does not mechanically lower the policy rate, and the logical precondition for rate cuts (slowing inflation) is unrelated to the size of the balance sheet, making the Warsh thesis a category error. [LLM]"}, {"x": -10.477082252502441, "y": -2.82804012298584, "z": 4.064822673797607, "id": "concept_fi_rv_001", "title": "Fixed Income Relative Value Framework", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Fixed income relative value (RV) is the systematic identification and monetisation of price discrepancies between economically similar instruments along four dimensions: carry (income earned per unit of risk), roll-down (P&L from yield curve passage of time), richness/cheapness (deviation from fitted curve), and duration-neutral spread trades. RV positions are constructed to isolate a single mispricing while hedging all other exposures.\n"}, {"x": 0.09791679680347443, "y": 10.268980026245117, "z": -2.2873945236206055, "id": "basel_driven_credit_migration_to_private_markets_001", "title": "Basel Driven Credit Migration To Private Markets", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Basel III's capital, leverage, and liquidity rules make holding long-duration unrated corporate credit economically irrational for regulated banks, creating a structural 'financing gap' that private credit funds fill; however, banks re-enter the risk via subscription lines and NAV loans to those same funds, converting bank solvency risk into network liquidity risk."}, {"x": 5.956179141998291, "y": 20.416507720947266, "z": -4.598549842834473, "id": "fedwire_payment_system_reserve_demand_and_lsm_policy_001", "title": "Fedwire Payment System Reserve Demand And LSM Policy", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed's Fedwire RTGS payment system generates structural demand for reserve balances because banks must pre-load reserves for outgoing payments before receiving inflows; post-GFC intraday liquidity regulations caused daylight overdrafts to collapse from $120B/day to under $5B/day, dramatically raising the minimum reserve floor; adding a Liquidity Savings Mechanism (LSM) to Fedwire could substantially reduce reserve demand without sacrificing payment speed."}, {"x": -2.5498764514923096, "y": -9.931973457336426, "z": 0.4979352056980133, "id": "sovereign_basis_trade_repo_leverage_001", "title": "Sovereign Basis Trade Repo Leverage", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "The cash-futures basis trade \u2014 hedge funds buying cash USTs via repo, selling futures \u2014 is the primary glue holding Treasury cash, futures, and repo markets together. Estimated >$1 trillion in exposure, leveraged up to 60x via repos. Conks' analysis: the systemic fear of basis trade blowup is overblown under normal repo rate volatility (basis traders can absorb \u226450bps repo spikes; up to 200bps near delivery). The real systemic risk is not yield moves (which are partially hedged by futures shorts) but a simultaneous detachment of cash/futures prices PLUS a repo shock (margin trigger) at futures roll periods. The Fed is morally committed to a \"basis purchase facility\" backstop as the last resort."}, {"x": 4.683497905731201, "y": 23.82763671875, "z": -1.2076337337493896, "id": "qt_reserve_drain_effectiveness_and_deposit_funding_condition_001", "title": "QT Reserve Drain Effectiveness And Deposit Funding Condition", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Quantitative Tightening (QT) only reduces bank reserves and tightens credit conditions when it is funded by bank deposit outflows; when funded by MMF withdrawals from ON RRP, only the Fed's ON RRP liability shrinks while reserves are unchanged \u2014 making that QT phase financially neutral for banks."}, {"x": -1.9487491846084595, "y": 17.058950424194336, "z": 18.97928237915039, "id": "sovereign_debt_market_discipline_price_discovery_role_001", "title": "Sovereign Debt Market Discipline Price Discovery Role", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "High sovereign yields (as in the UK) serve as a market discipline mechanism that forces governments toward fiscal consolidation; artificially capping yields (as Japan via BoJ bond purchases, or eurozone via ECB TPI) does not eliminate the fiscal risk premium but displaces it into the currency \u2014 the Yen depreciation vs GBP stability pattern illustrates that sovereign risk shows up one way or another, and price discovery through yields is preferable to deferred currency adjustment. [LLM]"}, {"x": -1.9946413040161133, "y": 19.61027717590332, "z": 18.695201873779297, "id": "private_equity_private_credit_integration_nexus_001", "title": "Private Equity Private Credit Integration Nexus", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Private credit is structurally intertwined with private equity: ~70% of private credit deals are PE-sponsored, and managers whose umbrella firms also run PE hold >75% of private credit assets \u2014 creating a reflexive loop where PE deal flow drives private credit origination, and private credit availability enables PE leverage, making credit conditions for the asset class closely correlated with PE fundraising cycles and exit activity. [LLM]"}, {"x": 16.243606567382812, "y": -2.061117172241211, "z": 6.916643142700195, "id": "currency_fed_liability_con_001", "title": "Currency as a Central Bank Liability", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Currency is classified as a central bank liability because it represents a claim on the sovereign that can be used to extinguish tax liabilities; it is the physical manifestation of the central bank's \"banking\" function where issued notes are IOUs providing public settlement services. [LLM]\n"}, {"x": 10.424025535583496, "y": 5.980794429779053, "z": 2.3674237728118896, "id": "central_bank_monetary_policy_operational_framework_typology_001", "title": "Central Bank Monetary Policy Operational Framework Typology", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Central bank monetary policy operations can be classified into three archetypes by how they control the short-term interest rate: (1) one-directional standing facility with daily OMOs, (2) symmetric corridor with CB-determined OMO volume, and (3) full-allotment lending within a standing-facility corridor; the choice determines whether reserves are scarce, ample, or excess, and how the interbank market functions."}, {"x": 14.021108627319336, "y": 1.8353688716888428, "z": -1.8465697765350342, "id": "cb_reserve_system_constraint_multiplier_myth_001", "title": "CB Reserve System Level Constraint And Money Multiplier Myth", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Two foundational misconceptions about commercial bank reserves: (1) individual banks appear to choose between reserves and other assets, but at the system level total reserves are entirely determined by the central bank's balance sheet identities \u2014 no individual bank action can reduce system-wide reserves; (2) banks do not require reserves to lend \u2014 the money multiplier (reserves \u2192 lending) has causality reversed; broad money expands with economic activity and narrow money is subsequently supplied by the CB to meet requirements."}, {"x": 0.577726423740387, "y": 21.511281967163086, "z": 18.906625747680664, "id": "usd_swap_lines_geopolitical_dollar_integration_tool_001", "title": "USD Swap Lines Geopolitical Dollar Integration Tool", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Beyond their liquidity function, Fed swap line extensions to new counterparty central banks serve as signals of deep institutional integration into the dollar system \u2014 providing privileged access to core dollar liquidity infrastructure while making it more costly for competing reserve currency arrangements (e.g., petroyuan) to displace USD in bilateral trade and financial flows. [LLM]"}, {"x": 8.589014053344727, "y": 14.867621421813965, "z": -3.071732521057129, "id": "eurodollar_system_mechanics_and_post_reform_decline_001", "title": "Eurodollar System Mechanics And Post-Reform Decline", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Eurodollar system \u2014 offshore dollar banking settled onshore via Fed reserves \u2014 peaked as the dominant global dollar funding mechanism but was structurally gutted by Basel III LCR (2013) and 2014 SEC MMF reform, with unsecured interbank lending collapsing and SOFR/secured funding replacing LIBOR/unsecured as the global dollar standard."}, {"x": -0.874350368976593, "y": 17.538745880126953, "z": 17.17055892944336, "id": "nbfi_sovereign_market_supervisory_gap_001", "title": "NBFI Sovereign Market Supervisory Gap", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The institutional infrastructure for managing stress in the NBFI sovereign buyer base \u2014 data quality, supervisory frameworks, crisis liquidity facilities, and stress simulation \u2014 remains incomplete relative to the growing systemic role NBFIs play as marginal buyers of European government debt; this gap means market stress events lack the crisis containment tools that existed when banks were the dominant holders. [LLM]"}, {"x": 10.45928955078125, "y": -10.899534225463867, "z": 3.108686923980713, "id": "ust_market_structure_onrun_offrun_001", "title": "UST Market Primary Secondary OnRun OffRun Structure", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "The U.S. Treasury market has two structurally distinct layers \u2014 the primary market (initial auction, globally liquid, dealer-intermediated) and the secondary market (secondary trading, concentrated in on-the-run bonds, with off-the-run bonds mostly held to maturity and prone to illiquidity) \u2014 with structural blindspots and monopoly power in the secondary layer that primary-market tools cannot address."}, {"x": 11.521637916564941, "y": 0.03437494859099388, "z": -13.48045825958252, "id": "triparty_repo_market_structure_and_daily_cycle_001", "title": "Triparty Repo Market Structure And Daily Cycle", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The US triparty repo market is a $4-5 trillion overnight funding market where BNYM acts as sole custodian/settlement agent; its daily operational cycle creates structural rate floors (ON RRP at 1pm) and ceilings (SRF at 1:30-1:45pm), while the opaque non-centrally-cleared bilateral repo (NCCBR) segment provides ~$2 trillion in hedge fund leverage outside regulatory visibility."}, {"x": 15.615418434143066, "y": 1.2870943546295166, "z": -3.3152101039886475, "id": "cb_seigniorage_capital_loss_independence_001", "title": "CB Seigniorage Income Capital Loss And Policy Independence", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Central bank income derives primarily from seigniorage \u2014 the spread between the zero or near-zero cost of issuing liabilities (banknotes, reserves) and the income earned on backing assets; while CB losses are theoretically compatible with continued monetary policy effectiveness (CB always meets domestic currency liabilities), the empirical evidence shows that poorly-capitalised CBs are associated with poor policy outcomes \u2014 the binding constraint is reputational: accumulated losses must not exceed the net present value of future seigniorage income, beyond which credibility collapses."}, {"x": 2.7426297664642334, "y": 10.808958053588867, "z": -1.2766847610473633, "id": "shadow_banking_market_based_finance_001", "title": "Shadow Banking Market Based Finance", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Shadow banking (market-based finance) refers to credit intermediation outside the traditional deposit-taking banking system, primarily through repos, money market funds, ABS, and CLOs. It emerged from regulatory arbitrage under Basel I and grew to supersede traditional banking in credit supply; post-2008 it contracted to structurally essential components while remaining a systemic amplifier during stress."}, {"x": -2.255596160888672, "y": 20.376079559326172, "z": 19.385944366455078, "id": "insurance_pension_private_credit_structural_investor_role_001", "title": "Insurance Pension Private Credit Structural Investor Role", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Insurance companies and pension funds are the anchor investors in private credit because long-duration illiquid private credit naturally matches long-duration illiquid liabilities; life insurers grew private placement lending from $386bn (2014) to $849bn (2024), reaching 14% of general account assets \u2014 driven by post-2008 low rates and private equity firms acquiring life insurers to access \"permanent capital\"; however, as retail/semi-liquid channels grow, the investor base becomes more liquidity-sensitive, introducing reflexive redemption risk. [LLM]"}, {"x": 7.266106128692627, "y": 0.11366908252239227, "z": -10.056572914123535, "id": "collateral_velocity_and_pledged_collateral_market_mechanics_001", "title": "Collateral Velocity And Pledged Collateral Market Mechanics", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Pledged collateral functions as a parallel money supply in financial markets \u2014 it can be reused (rehypothecated) multiple times, creating a 'velocity of collateral' analogous to money velocity; QE reduces this velocity by hoovering up high-quality collateral from the market, with the bilateral pledged-collateral market (not triparty) being the core of global financial plumbing."}, {"x": 7.382080554962158, "y": 20.33173370361328, "z": 8.808509826660156, "id": "tga_reserve_swap_mechanics_and_debt_ceiling_dynamics_001", "title": "TGA Reserve Swap Mechanics And Debt Ceiling Dynamics", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Treasury General Account (TGA) and bank reserves are two liabilities on the Fed's balance sheet that move inversely: every TGA drawdown injects reserves into the banking system (liquidity positive), while every TGA refill (via Treasury issuance) drains reserves (liquidity negative); debt ceiling episodes force extraordinary TGA dynamics that temporarily distort the Fed's reserve scarcity signals."}, {"x": -2.2292778491973877, "y": 19.378713607788086, "z": 20.51616096496582, "id": "us_vs_europe_private_credit_market_structure_divergence_001", "title": "US vs Europe Private Credit Market Structure Divergence", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "The US private credit market is mature (corporate debt ~75-80% non-bank, structured via BDCs) while Europe remains bank-centric (~85% bank-financed) \u2014 Basel III/IV is a more acute catalyst in Europe, creating larger white space for private lenders; European harmonisation vehicles (ELTIF 2.0, AIFMD) are attempting to replicate the BDC access model, but fragmented regulation slows convergence. [LLM]"}, {"x": -1.4363652467727661, "y": 10.926745414733887, "z": -1.978689193725586, "id": "basel_iii_capital_and_liquidity_constraint_mechanics_001", "title": "Basel III Capital And Liquidity Constraint Mechanics", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Basel III imposes four interlocking constraints on bank balance sheets \u2014 RWA-based capital ratio, Output Floor (72.5% of standardized RWA), Leverage Ratio (3-5% unweighted), LCR (30-day HQLA buffer), and NSFR (structural funding ratio) \u2014 that jointly make holding long-duration, unrated, or specialized corporate credit economically punitive, driving credit migration to private markets."}, {"x": 4.535668849945068, "y": 10.59425163269043, "z": -2.893927812576294, "id": "us_shadow_banking_post_gfc_market_based_finance_structure_001", "title": "US Shadow Banking Post-GFC Market Based Finance Structure", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Post-2008 US shadow banking transformed from a complex CDO/synthetic ABS machine into a repo-centric, collateral-based market-based finance system, where securitization (ABS, CLOs) survived but the toxic CDO-cubed structures collapsed; simultaneously, Principal Trading Firms (PTFs) replaced G-SIBs as the primary Treasury market makers due to Basel/SLR regulatory constraints on bank balance sheets."}, {"x": 2.8720033168792725, "y": 21.583385467529297, "z": 3.050544023513794, "id": "warsh_balance_sheet_stimulus_swap_con_001", "title": "Warsh Balance Sheet Stimulus Swap", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The \"Warsh Hypothesis\" posits that the Fed's balance sheet and policy rate are substitutable forms of stimulus; significantly shrinking the balance sheet \"redeploys\" capacity, theoretically allowing for lower nominal interest rates without increasing aggregate monetary ease.\n"}, {"x": -0.06764200329780579, "y": 19.788991928100586, "z": 19.41349220275879, "id": "policy_trilemma_efficiency_frontier_equivalence_001", "title": "Policy Trilemma Efficiency Frontier Equivalence", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "A policy trilemma (any two of three objectives are achievable, never all three simultaneously) is mathematically equivalent to the claim that the status quo is already on the Pareto efficiency frontier of those three objectives \u2014 implying that any policy action must sacrifice at least one dimension; this framing reframes trilemmas from constraints into diagnostics of optimality. [LLM]"}, {"x": 9.552863121032715, "y": 24.284912109375, "z": 1.0137057304382324, "id": "pboc_rmb_fix_counter_cyclical_factor_and_fx_management_001", "title": "PBOC RMB Fix Counter Cyclical Factor And FX Management", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The PBOC manages CNY via a daily central parity fix with \u00b12% band, augmented by a discretionary Counter-Cyclical Factor (CCF) embedded in the fix formula; since late 2023, conservative CCF settings have made the fix behave like a crawling peg, creating a positive CFETS-USDCNY correlation that signals PBOC is suppressing automatic stabilizer effects."}, {"x": 0.05223795026540756, "y": 17.559520721435547, "z": 19.090179443359375, "id": "central_bank_credibility_supply_shock_policy_space_001", "title": "Central Bank Credibility Supply Shock Policy Space", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "A central bank's accumulated credibility determines its \"look-through\" policy space during supply shocks: well-anchored inflation expectations allow the CB to tolerate temporary inflation above target without responding (preserving growth), while low credibility forces tightening even if the shock is transitory \u2014 making credibility a prerequisite for optimal flexible average inflation targeting and supply-shock management. [LLM]"}, {"x": 8.655481338500977, "y": 20.906902313232422, "z": -4.64642333984375, "id": "fed_ample_reserves_rate_control_framework_001", "title": "Fed Ample Reserves Rate Control Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Post-GFC, the Fed shifted from scarce-reserve corridor to ample-reserve floor system: IORB sets the ceiling, ON RRP sets the floor, and SRF acts as a backstop ceiling, making fed funds rate control near-automatic without daily open market operations."}, {"x": 7.779024600982666, "y": 20.120210647583008, "z": -7.329380989074707, "id": "indicator_effr_001", "title": "EFFR \u2014 Effective Federal Funds Rate", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The EFFR is the volume-weighted median rate of overnight federal funds transactions \u2014 uncollateralised lending of reserve balances between depository institutions. It is the Fed's operational target: the FOMC sets a target range (currently 25bps wide) and uses IORB and ON RRP to keep EFFR within that range. EFFR diverging from IORB toward the upper bound of the range is an early signal of emerging reserve scarcity.\n"}, {"x": 9.659828186035156, "y": 20.48866844177246, "z": -5.134598731994629, "id": "indicator_iorb_001", "title": "IORB \u2014 Interest on Reserve Balances", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "IORB is the interest rate the Federal Reserve pays on all reserve balances held by depository institutions, serving as the effective floor of the federal funds rate under the ample reserves operating framework. It replaced the distinction between required reserve interest (IOR) and excess reserve interest (IOER) in July 2021, when reserve requirements were set to zero. IORB is the primary lever the Fed uses to transmit the FOMC's target range into overnight money markets.\n"}, {"x": 8.670735359191895, "y": 22.639726638793945, "z": -4.940494537353516, "id": "lclor_qt_calibration_001", "title": "LCLoR Lowest Comfortable Level of Reserves and QT Calibration", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed calibrates QT (quantitative tightening) to drain reserves until they hit the LCLoR (Lowest Comfortable Level of Reserves) \u2014 estimated ~$3T for the US banking system \u2014 below which repo rates spike above the EFFR target range. The key early-warning signals are: rising EFFR above IORB, increasing daylight overdraft volumes, SRF usage picking up, and SOFR/TGCR printing above IORB. The RRP balance falling to zero is NOT the LCLoR signal \u2014 it merely means excess liquidity has been redeployed from the Fed's shock absorber to private markets.\n"}, {"x": 7.298293590545654, "y": 20.807519912719727, "z": -7.920580863952637, "id": "sofr_ff_basis_rde_liquidity_gauges_001", "title": "SOFR-FF Basis RDE and Money Market Liquidity Gauges", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Two complementary gauges measure reserve conditions in real time: (1) the SOFR-FF futures basis \u2014 positive = SOFR below EFFR = reserves abundant; negative = repo tighter than fed funds = reserves scarce; and (2) the Fed's internal Reserve Demand Elasticity (RDE) \u2014 near zero = ample, sharply negative = approaching scarcity \u2192 triggers QT pause/end. Both gauges are distorted by a \"liquidity mirage\" during debt ceiling episodes: TGA drawdowns inject reserves into the system, but much of the apparent liquidity flows into RRP rather than the banking system \u2014 creating an illusion of ample reserves that reverses sharply when the ceiling is resolved and TGA is refilled.\n"}, {"x": 6.515706539154053, "y": 20.83540153503418, "z": -7.957771301269531, "id": "indicator_sofr_effr_basis_001", "title": "SOFR\u2013EFFR Basis Spread", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "The SOFR\u2013EFFR basis measures the spread between the overnight secured repo rate and the overnight unsecured interbank rate. In the ample reserves floor system, this basis should be small and slightly negative. Persistent or spiking positive basis indicates dealer balance sheet stress, collateral shortage, or funding market dislocations \u2014 the key plumbing friction indicator in Conks' money market framework.\n"}, {"x": 6.087942123413086, "y": 20.647092819213867, "z": -8.222981452941895, "id": "indicator_sofr_001", "title": "SOFR \u2014 Secured Overnight Financing Rate", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "SOFR is the ARRC-endorsed replacement for USD LIBOR, capturing the broad US Treasury repo market across tri-party, bilateral, and GCF segments (~$1 trillion daily volume). Unlike EFFR (unsecured), SOFR is secured by Treasuries, making it sensitive to collateral availability and repo market stress. SOFR is the underlying rate for the vast majority of new USD floating-rate contracts and OIS derivatives post-2023.\n"}, {"x": -0.35862645506858826, "y": 1.3257865905761719, "z": 16.87507438659668, "id": "raw__Bindseil_Monetary_Policy_Operations__0000", "title": "Bindseil_Monetary_Policy_Operations", "source": "raw", "domain": "monetary_policy", "type": "concept", "thesis": ""}, {"x": 4.653409481048584, "y": 5.081522464752197, "z": 14.399786949157715, "id": "raw__Bindseil_Monetary_Policy_Operations__0001", "title": "Bindseil_Monetary_Policy_Operations", "source": "raw", "domain": "monetary_policy", "type": "concept", "thesis": ""}, {"x": -9.995878219604492, "y": 15.488825798034668, "z": 8.68345832824707, "id": "raw__Bindseil_Monetary_Policy_Operations__0002", "title": "Bindseil_Monetary_Policy_Operations", "source": "raw", "domain": "monetary_policy", "type": "concept", "thesis": ""}, {"x": -9.244674682617188, "y": 15.192492485046387, "z": 6.295095920562744, "id": "raw__Bindseil_Monetary_Policy_Operations__0003" const rawCloud = new THREE.Points(rawGeo, new THREE.PointsMaterial({
    size:2, map:sprite, color:0x1565c0,
    alphaTest:0.02, transparent:true, opacity:0.4,
    blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:false,
}));
scene.add(rawCloud);

// Brain sphere container
(function addBrainSphere() {
    const R = 220;
    // outer shell — very faint
    const shell = new THREE.Mesh(
        new THREE.SphereGeometry(R, 48, 48),
        new THREE.MeshBasicMaterial({ color:0x00e5cc, wireframe:true, transparent:true, opacity:0.025 })
    );
    scene.add(shell);
    // inner equator ring
    const ring = new THREE.Mesh(
        new THREE.TorusGeometry(R, 0.4, 4, 96),
        new THREE.MeshBasicMaterial({ color:0x00e5cc, transparent:true, opacity:0.08 })
    );
    scene.add(ring);
    // meridian rings
    const m1 = ring.clone(); m1.rotation.x = Math.PI/2; scene.add(m1);
    const m2 = ring.clone(); m2.rotation.y = Math.PI/2; scene.add(m2);
})();

// Edges
if (edges.length) {
    const epos = new Float32Array(edges.length * 6);
    edges.forEach((e, i) => {
        const s=points[e.s], t=points[e.t];
        epos[i*6]=s.x; epos[i*6+1]=s.y; epos[i*6+2]=s.z||0;
        epos[i*6+3]=t.x; epos[i*6+4]=t.y; epos[i*6+5]=t.z||0;
    });
    const egeo = new THREE.BufferGeometry();
    egeo.setAttribute('position', new THREE.BufferAttribute(epos, 3));
    scene.add(new THREE.LineSegments(egeo, new THREE.LineBasicMaterial({
        color:0x00e5cc, opacity:0.07, transparent:true,
        blending:THREE.AdditiveBlending, depthWrite:false,
    })));
}

// Hover tooltip
const tooltip   = document.getElementById('tooltip');
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 5;
const mouse = new THREE.Vector2(-9999,-9999);

window.addEventListener('mousemove', e => {
    mouse.x =  (e.clientX/innerWidth)*2  - 1;
    mouse.y = -(e.clientY/innerHeight)*2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const wHits = raycaster.intersectObject(wikiCloud);
    const rHits = raycaster.intersectObject(rawCloud);
    let found = null, tc = null;
    if (wHits.length)      { found = wikiPts[wHits[0].index]; tc = TYPE_COLORS[found.type] || DEFAULT_COLOR; }
    else if (rHits.length) { found = rawPts[rHits[0].index];  tc = '#1565c0'; }

    if (found) {
        tooltip.style.display = 'block';
        const tx = e.clientX + 20, ty = e.clientY + 20;
        tooltip.style.left = (tx + 300 > innerWidth  ? e.clientX - 310 : tx) + 'px';
        tooltip.style.top  = (ty + 150 > innerHeight ? e.clientY - 160 : ty) + 'px';
        tooltip.innerHTML =
            '<div class="tip-title">' + found.title + '</div>' +
            '<span class="tip-badge" style="background:' + tc + '1a;color:' + tc + ';border:1px solid ' + tc + '55">' +
                (found.source === 'wiki' ? (found.type || 'concept') : 'raw') +
            '</span>' +
            (found.domain ? '<div class="tip-domain">' + found.domain + '</div>' : '') +
            (found.thesis ? '<div class="tip-thesis">' + found.thesis + '</div>' : '');
    } else {
        tooltip.style.display = 'none';
    }
});

window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

(function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
})();
</script>
</body>
</html>
