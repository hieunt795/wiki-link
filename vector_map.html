<script>
const points = [{"x": 7.853060245513916, "y": 20.26836395263672, "z": 8.971983909606934, "id": "entity_us_treasury_001", "title": "US Treasury Department", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "The US Treasury manages federal fiscal operations \u2014 issuing debt, maintaining the Treasury General Account (TGA) at the Fed, and setting debt maturity composition via the Quarterly Refunding. Treasury's cash management decisions (TGA drawdowns, T-bill vs coupon mix, extraordinary measures) have direct first-order effects on bank reserve levels and money market conditions independent of Fed policy.\n"}, {"x": 9.29924201965332, "y": 1.9560803174972534, "z": 9.611028671264648, "id": "entity_ecb_001", "title": "European Central Bank (ECB)", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The ECB sets monetary policy for the 20-member eurozone via the Governing Council, operating through the Eurosystem of national central banks (NCBs). Its 2024 operational framework shift \u2014 from excess liquidity via TLTRO to structural repo operations \u2014 marks the transition from an asset-purchase-driven floor system back toward a demand-driven corridor.\n"}, {"x": 11.517587661743164, "y": 19.972763061523438, "z": 2.512385368347168, "id": "entity_boj_001", "title": "Bank of Japan (BoJ)", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Bank of Japan is notable for operating the world's most extensive unconventional monetary policy regime: Quantitative and Qualitative Easing (QQE) from 2013, Yield Curve Control (YCC) from 2016, culminating in a 2024 exit from negative rates and YCC cap removal. Its decade-long zero-rate policy enabled Japan's consolidated public sector to operate a sovereign carry trade at 91% of GDP in bank reserves, compressing household duration and engineering implicit financial repression.\n"}, {"x": 1.2161228656768799, "y": 11.798379898071289, "z": -0.11581854522228241, "id": "entity_bis_001", "title": "Bank for International Settlements (BIS)", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "The BIS is the primary international forum for central bank cooperation and the host institution of the Basel Committee on Banking Supervision (BCBS), which sets global minimum capital and liquidity standards. BIS research (Working Papers, Quarterly Review) is a primary source for empirical evidence on transmission mechanisms, cross-border liquidity, and financial stability.\n"}, {"x": 9.828851699829102, "y": 17.278371810913086, "z": -3.6390960216522217, "id": "entity_federal_reserve_001", "title": "Federal Reserve (Fed)", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Federal Reserve is the central bank of the United States, operating as a decentralized system of 12 Reserve Banks under a Board of Governors, with monetary policy set by the FOMC. It controls the federal funds rate target, manages the Fed's balance sheet (assets: Treasuries + MBS; liabilities: reserves + currency + TGA), and serves as fiscal agent for the US Treasury.\n"}, {"x": 6.469806671142578, "y": -0.3333476781845093, "z": -9.988930702209473, "id": "collateral_velocity_reuse_rate_plumbing_001", "title": "Collateral Velocity Reuse Rate And Financial Plumbing", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Collateral velocity (reuse rate) = total pledged collateral received by large dealer banks / primary collateral sources (hedge funds + custodians); the ratio measures the length of collateral chains and acts as an analog to the velocity of money \u2014 higher velocity means greater financial lubrication; velocity fell from ~3.0x (end-2007, $10T total) to ~1.8x (end-2015, $5.6T), driven by counterparty risk and QE draining good collateral from the market; 10-15 global dealer banks are the sole intermediaries capable of moving collateral across borders in bulk, and deleveraging has two components: balance-sheet shrinking AND shortening of collateral chains (reduced interconnectedness), the latter being underappreciated."}, {"x": -1.9487495422363281, "y": 17.058948516845703, "z": 18.979284286499023, "id": "eurobond_blue_red_bond_adverse_selection_moral_hazard_001", "title": "Eurobond Blue-Red Bond Adverse Selection Moral Hazard", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "The Blanchard-Ubide Eurobond proposal (blue bonds senior + VAT ring-fenced, red bonds subordinated) faces three structural failures: (1) adverse selection \u2014 without mandatory participation, only weak-fiscal countries join; (2) moral hazard \u2014 once pooled, countries bear only a fraction of the cost of their own fiscal decisions; (3) enforcement \u2014 seniority mechanisms fail during actual sovereign distress when political economy overrides legal priority. [LLM]"}, {"x": 12.411966323852539, "y": 18.60493278503418, "z": 4.594775676727295, "id": "financial_repression_via_reserve_creation_001", "title": "Financial Repression via Reserve Creation", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Modern financial repression operates through reserve creation and yield curve control rather than explicit capital controls: by maintaining bank reserves at below-market rates, the sovereign captures an implicit spread \u2014 estimated at 197bps in Japan, equivalent to nearly 2% of GDP per year \u2014 as a tax on deposit holders, channelling private savings into public sector funding without formal restrictions."}, {"x": 0.22864848375320435, "y": 21.573116302490234, "z": 18.68131446838379, "id": "fed_usd_swap_line_architecture_and_crisis_function_001", "title": "Fed USD Swap Line Architecture and Crisis Function", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Fed dollar swap lines allow foreign central banks to exchange domestic currency for USD at a fixed rate (with reversal commitment), enabling them to lend dollars into their domestic financial systems; these facilities act as systemic stabilizers of the global dollar funding architecture during stress events when private FX swap and repo markets become impaired \u2014 as demonstrated in March 2009 and March 2020. [LLM]"}, {"x": -0.11502780765295029, "y": 17.590328216552734, "z": 17.17667579650879, "id": "scissors_effect_ecb_qt_and_sovereign_supply_001", "title": "Scissors Effect ECB QT and Sovereign Supply", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The scissors effect describes the simultaneous compression of ECB sovereign bond demand (via QT) and expansion of net sovereign issuance: from 2023, ECB withdrawals from German paper exceeded Germany's own net borrowing, meaning the private sector must absorb both incremental new supply and ongoing ECB portfolio runoff \u2014 a compounding demand shock with no historical precedent in the post-2012 eurozone. [LLM]"}, {"x": 13.285399436950684, "y": 21.309982299804688, "z": 3.532177448272705, "id": "qe_duration_extraction_from_private_sector_001", "title": "QE Duration Extraction from Private Sector", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Quantitative easing systematically strips duration from the private financial system: by purchasing long-duration government bonds and issuing near-zero-duration bank reserves, central banks transfer duration risk onto the sovereign balance sheet while leaving private investors \u2014 especially deposit-heavy households \u2014 with portfolios that cannot hedge rising-rate risk. In Japan, a decade of BOJ QE left 67% of households with near-zero-duration savings despite having decades of consumption needs to fund."}, {"x": 11.416067123413086, "y": -10.97115421295166, "z": -0.9734338521957397, "id": "ust_shadow_cash_market_liquidity_001", "title": "UST Shadow Cash Market Liquidity Structure", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "The U.S. Treasury cash market has developed a \"shadow cash\" counterpart where dealers and non-bank market makers (PTFs/HFTs) provide bond-like exposure via ETF creation-redemption and total return swaps, supplementing traditional repo-financed bond trading. This shadow market understates measured UST liquidity while creating a non-regulatory blind spot: internal VaR limits \u2014 not Basel III or SLR \u2014 are the primary cause of dealer withdrawal during stress events. During COVID, ETFs proved more liquid than their underlying bonds, contrary to prior fears.\n"}, {"x": 1.8775399923324585, "y": 20.427167892456055, "z": 19.519716262817383, "id": "fed_ample_reserves_buffer_sizing_formula_001", "title": "Fed Ample Reserves Buffer Sizing Formula", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The ample reserves buffer the Fed Desk maintains to avoid rate-control failures can be estimated as B = sqrt(\u0394) \u00d7 \u03c3 \u00d7 z*(\u03b5\u0394/2), where \u0394 is the interval between Desk operations, \u03c3 is the standard deviation of TGA changes over that period, and \u03b5 governs acceptable fault probability; for a 2-week interval with \u03c3\u2248$100bn and 1% annualized fault probability, the formula implies a buffer of ~$150-250bn \u2014 below which TGA volatility can trigger a September 2019-style reserve shortage. [LLM]"}, {"x": -0.352961927652359, "y": 19.793100357055664, "z": 20.83449935913086, "id": "boj_qe_duration_extraction_household_wealth_transfer_001", "title": "BoJ QE Duration Extraction Household Wealth Transfer", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "BoJ QE systematically extracted duration from the private sector by swapping long-duration JGBs for near-zero-duration reserves, leaving Japanese households holding predominantly bank deposits (near-zero duration) while the government held long-duration assets; when interest rates fell, equity-holding government and wealthy households captured the capital gains, while deposit-holding middle-class households received nothing \u2014 creating a structural wealth transfer from households to the consolidated public sector and from young/unsophisticated to old/wealthy. [LLM]"}, {"x": -0.6076858639717102, "y": 10.446464538574219, "z": -4.472923278808594, "id": "lcr_nsfr_long_term_lending_penalty_001", "title": "LCR NSFR Long-Term Lending Penalty", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "LCR forces banks to hold HQLA equal to 30-day stressed net outflows (including assumed drawdowns on corporate credit lines), while NSFR requires stable funding \u226585% of notional for loans with residual maturity \u22651 year. [LLM] Together these two rules create a structural funding cost penalty that makes long-duration corporate and specialized lending uneconomical relative to short-term or HQLA assets \u2014 amplifying the capital-cost pressure from RWA and Output Floor to produce the bank retreat from corporate credit.\n"}, {"x": -1.4848003387451172, "y": 20.544158935546875, "z": 18.695045471191406, "id": "bank_credit_line_private_credit_funds_systemic_channel_001", "title": "Bank Credit Line Private Credit Funds Systemic Channel", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "US GSIB credit lines to private debt funds and BDCs rose ~145% over five years to ~$95bn by Q4 2024, with ~60% concentrated among five GSIBs; if private credit vehicles draw lines defensively during stress while banks simultaneously tighten, liquidity becomes a correlated problem \u2014 OFR estimates total bank and nonbank exposure to private credit at $410-540bn via debt financing plus $300bn in LP commitments, establishing a plausible systemic transmission route from private credit stress to the banking system. [LLM]"}, {"x": 6.583981037139893, "y": 15.033000946044922, "z": -9.018880844116211, "id": "mp_collateral_channel_001", "title": "Monetary Policy Transmission via Collateral and Repo Markets", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Repo rates \u2014 which reflect collateral availability and quality \u2014 guide the policy rate more directly than unsecured interbank rates. QE, by removing high-quality collateral from circulation and replacing it with reserves, suppresses collateral velocity and may impair monetary transmission: large CB footprint in collateral markets weakens the market signals that normally guide policy.\n"}, {"x": 10.013224601745605, "y": 6.0648088455200195, "z": 1.7762598991394043, "id": "interest_rate_corridor_floor_system_standing_facilities_001", "title": "Interest Rate Corridor Floor System Standing Facilities", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The interest rate corridor brackets overnight interbank rates between a CB lending facility (ceiling) and deposit facility (floor). In normal times, OMOs keep rates near the midpoint; in excess-reserve environments (post-QE), the system degenerates into a floor system where the overnight rate equals the deposit facility rate and is controlled via that rate, not reserve quantity."}, {"x": -1.1608715057373047, "y": 19.58951187133789, "z": 19.043832778930664, "id": "private_credit_pik_and_hidden_leverage_mechanisms_001", "title": "Private Credit PIK and Hidden Leverage Mechanisms", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Private credit funds employ two hidden leverage mechanisms: (1) Payment-in-Kind (PIK), which allows borrowers to defer cash interest by accruing more principal \u2014 keeping defaults optically low while leverage rises; and (2) subscription facilities (secured against unfunded LP commitments) and NAV lending (borrowing against fund portfolio value) \u2014 both instruments create a structure where a \"hold-to-maturity, illiquid loan book\" is paired with financing whose availability is contingent on lender confidence and collateral valuation. [LLM]"}, {"x": -1.1952085494995117, "y": 10.669477462768555, "z": -4.544168472290039, "id": "slr_relief_valve_limited_efficacy_001", "title": "SLR Relief Valve Limited Efficacy For UST Demand", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "A partial SLR (Supplementary Leverage Ratio) reduction is a \"faulty relief valve\" for UST market liquidity because most large banks are bound by risk-based capital requirements, not SLR \u2014 so freeing SLR headroom does not incentivize additional UST purchases when banks fund those purchases with reserves (also 0% RWA), and only the most leverage-constrained banks see any benefit."}, {"x": 9.111955642700195, "y": 16.136375427246094, "z": -3.349594831466675, "id": "fed_global_jaws_frp_fima_001", "title": "Fed Global Jaws FRP FIMA Public Dollar Architecture", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed has assembled a four-layer \"global jaws\" architecture to control dollar rates for all market participants: (1) private floor = ON RRP (banks/MMFs/GSEs), (2) public floor = Foreign Repo Pool/FRP (foreign official institutions since 1970s), (3) private ceiling = Fed swap lines (allied central banks at OIS+25bps), (4) public ceiling = FIMA repo facility (all foreign official institutions, March 2020). The FRP allows FOIs to earn yield on excess dollars; FIMA allows FOIs to borrow dollars against their Treasury holdings. Together they prevent foreign governments from being forced to firesell U.S. assets in crises, structurally reinforcing dollar hegemony.\n"}, {"x": 6.790897369384766, "y": -12.169893264770508, "z": -12.649726867675781, "id": "irs_ois_fixed_floating_001", "title": "Interest Rate Swaps \u2014 OIS, Fixed-for-Floating, Clearing, and Basis", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Interest rate swaps exchange fixed for floating interest payments on a notional amount. OIS (overnight index swaps, e.g., SOFR swaps) are near-riskless; fixed-for-floating swaps (e.g., Euribor) carry a basis vs. the risk-free rate. Market notionals ($210T) vastly overstate risk \u2014 ENNs (entity-netted notionals) of $16T are comparable to other fixed income markets. Swaps DV01 is entirely on the fixed leg; clearing via CCPs concentrates but does not eliminate counterparty risk; the default waterfall (IM \u2192 default fund \u2192 CCP skin \u2192 member assessments \u2192 VM haircutting) is the last line of defense.\n"}, {"x": 2.6013057231903076, "y": 24.00266456604004, "z": -2.350362539291382, "id": "treasury_qe_duration_rrp_drain_001", "title": "Treasury QE Duration Swap And RRP Drain Mechanisms", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "Treasury buybacks can function as \"Treasury QE\" via two distinct mechanisms \u2014 (1) duration-reducing swap (buy long-dated bonds, re-issue short-dated), which removes duration risk from private hands and stimulates risk assets if announced explicitly; and (2) RRP-drain QE (MMF withdraws from RRP to buy new Treasury bills which fund the buyback), which involuntarily boosts net liquidity without Fed balance sheet expansion."}, {"x": 12.236466407775879, "y": 1.2998199462890625, "z": -13.499146461486816, "id": "ubr_hedge_fund_leverage_systemic_001", "title": "Uncleared Bilateral Repo UBR Hedge Fund Leverage Systemic Risk", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Uncleared bilateral repo (UBR) is the most opaque segment of the U.S. repo market \u2014 where hedge funds borrow at 50:1+ leverage from dealer counterparties without central clearing or custody \u2014 executing basis trades and relative-value strategies; its $2T+ in outstanding transactions remained invisible to regulators until 2023, echoing the LTCM precedent (1998) where uncleared repo counterparty exposures nearly triggered a systemic meltdown."}, {"x": 2.0965240001678467, "y": 7.0048441886901855, "z": -6.213225364685059, "id": "private_credit_reflexive_loop_001", "title": "Private Credit Reflexive Loop", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "[LLM] Low policy rates induce institutional search for yield \u2192 capital floods into private credit \u2192 manager pressure to deploy creates covenant deterioration and leverage creep \u2192 PIK masks emerging stress \u2192 delayed loss recognition. When the regime flips (sustained high rates or redemption surge), the loop reverses: semi-liquid fund redemption caps are hit \u2192 bank revolving lines drawn defensively \u2192 NAV margin calls \u2192 valuation reset forces loss recognition simultaneously, producing a cliff rather than a gradual correction.\n"}, {"x": 1.164311408996582, "y": 19.32201385498047, "z": 19.910249710083008, "id": "tga_reserve_inverse_relationship_fed_balance_sheet_growth_001", "title": "TGA Reserve Inverse Relationship Fed Balance Sheet Growth", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Every Treasury transaction with the private sector mechanically produces dTGA = -dReserves (a zero-sum liability swap on the Fed balance sheet); however, when TGA changes are large and persistent, the Fed must expand assets to maintain ample reserves \u2014 so over time dTGA = dAssets, and both an increase in the LEVEL and VOLATILITY of the TGA directly force a larger Fed balance sheet. [LLM]"}, {"x": 5.915099143981934, "y": 20.56609344482422, "z": -4.602533340454102, "id": "reserve_floor_payment_001", "title": "Reserve Floor \u2014 Payment System Demand and the Minimum Ample Level", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The minimum level of reserve balances (\"reserve floor\") that the Fed must supply is driven primarily by the demand of the payment system, not by monetary policy alone. RTGS (real-time gross settlement) requires banks to pre-fund large opening-of-day reserve balances; post-GFC liquidity regulations stigmatize intraday overdrafts; and IORB remuneration removes incentives to lend excess reserves. These three structural changes raised the minimum from ~$10B pre-GFC to ~$3T, creating a ratchet effect. When reserves fall below the ample floor, payment delays beget repo rate spikes (September 2019 being the canonical example). Policy options to lower the floor include liquidity savings mechanisms (LSMs), tiered IORB, revised LCR/daylight overdraft rules, and TOMOs.\n"}, {"x": -16.563430786132812, "y": -6.19525671005249, "z": 0.28269290924072266, "id": "bond_accrual_price_effect_interaction_001", "title": "Bond Accrual Price Effect Interaction", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Over a multi-period horizon, a bond portfolio's coupon accruals (reinvestment income) accumulate roughly as the square of the horizon while price effects are linear \u2014 meaning accruals dominate price effects at long horizons, and this asymmetry is the engine behind DT convergence."}, {"x": -2.79447078704834, "y": -5.2672529220581055, "z": -17.228784561157227, "id": "swap_spreads_001", "title": "Swap Spreads \u2014 Drivers, Balance Sheet Frictions, and Plumbing Indicators", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Swap spreads \u2014 the difference between bond yield and the swap rate of equivalent maturity \u2014 decompose into: SOFR-ASW = repo-SOFR basis swap + adjusted CDS (credit risk). Negative swap spreads (Treasury yield > SOFR swap rate) signal dealer balance sheet constraints: when banks face binding SLR/LCR constraints, their ability to intermediate arbitrage between bonds and swaps is impaired, causing the spread to persist at values inconsistent with no-arbitrage. Shadow costs of regulatory constraints \u2014 not visible in funding rates \u2014 are a primary structural driver of Treasury swap spreads in the post-Basel III era. Swap spreads are therefore a measure of plumbing friction and dealer balance sheet stress.\n"}, {"x": 7.616004467010498, "y": 25.0634765625, "z": 2.4504594802856445, "id": "china_lpr_mlf_decoupling_2024_001", "title": "China LPR MLF Decoupling 2024 Reform Rationale", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The PBC decoupled LPR from the MLF rate in July 2024 because the MLF was centrally set at a fixed rate via quantity bidding (not market-formed), making LPR an administered price rather than a genuine market rate; the reform linked LPR to the 7-day OMO reverse repo rate so that a single short-term policy rate could transmit simultaneously to the credit market (via LPR) and the bond market (via yield curve), converging toward mainstream central bank frameworks."}, {"x": 4.668627738952637, "y": 10.553661346435547, "z": -3.020129680633545, "id": "ptf_treasury_market_making_001", "title": "PTF Principal Trading Firms Treasury Market Making", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Post-Basel III, Principal Trading Firms (PTFs) using HFT strategies on electronic platforms displaced large G-SIB banks as the dominant Treasury market makers \u2014 because PTFs are not subject to G-SIB capital constraints and can intermediate large volumes without the regulatory penalty that caused banks like JPMorgan to exit tri-party repo, creating a faster but more opaque and fragile market-making ecosystem."}, {"x": 12.430717468261719, "y": 18.641382217407227, "z": 4.523951053619385, "id": "japan_filp_to_qe_structural_succession_001", "title": "Japan FILP to QE Structural Succession", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Japan QE reserve creation (2010-) structurally succeeded the Fiscal Investment and Loan Programme (FILP) as the sovereign mechanism for below-market funding: both channel domestic private savings into public sector use at sub-market rates, differing only in instrument. The 2001 postal reform that dismantled FILP funding base made QE the market-friendly successor."}, {"x": -1.4615538120269775, "y": 20.411849975585938, "z": 19.626705169677734, "id": "private_credit_dual_driver_low_rates_and_bank_regulation_001", "title": "Private Credit Dual Driver Low Rates and Bank Regulation", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "Private credit growth is driven by two simultaneous forces: (1) ultra-low policy rates compressed public fixed-income yields, forcing allocators to accept illiquidity for yield (search-for-yield channel); and (2) Basel III raised the shadow price of bank balance sheet for leveraged/sub-investment-grade lending, making private credit economically competitive \u2014 BIS analysis shows convergence of BDCs and banks weighted average cost of capital as the structural enabler of scale. [LLM]"}, {"x": 0.09983930736780167, "y": 10.023293495178223, "z": -2.350512742996216, "id": "private_credit_srt_001", "title": "Private Credit \u2014 SRT, NAV Loans, and Bank-PC Interconnection", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Banks respond to Basel III capital and liquidity constraints through three structural mechanisms: (1) SRT \u2014 transferring first-loss credit risk from the balance sheet to PC fund investors for regulatory capital relief; (2) originate-to-distribute \u2014 converting from spread income to fee income while retaining origination relationships; (3) providing leverage to PC funds via subscription lines and NAV loans. These mechanisms do not eliminate bank credit exposure \u2014 they reconfigure it from direct lending to indirect exposure to PC fund leverage. The systemic implication is correlated drawdown risk: in stress, PC funds simultaneously tap bank credit lines, creating a network liquidity event invisible to standard bank stress tests.\n"}, {"x": -0.5750969052314758, "y": 17.822519302368164, "z": 17.571985244750977, "id": "ecb_qt_sovereign_yield_volatility_amplification_001", "title": "ECB QT Sovereign Yield Volatility Amplification", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The ECB quantitative tightening cycle has structurally increased realized volatility of European sovereign yields by removing the most price-insensitive buyer from the market; events like the March 2025 single-day 30bp Bund move (largest since 1990) demonstrate that without the ECB backstop, idiosyncratic fiscal news can trigger dislocations that would previously have been absorbed by central bank intervention. [LLM]"}, {"x": 5.079102993011475, "y": -13.533557891845703, "z": -8.375954627990723, "id": "fed_dollar_swap_lines_crisis_hierarchy_001", "title": "Fed Dollar Swap Lines Crisis Hierarchy and Swapper of Last Resort", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "During dollar funding stress, private FX swap market makers withdraw in a predictable sequence (small participants \u2192 NY foreign bank branches \u2192 US G-SIB dealers) before the Fed activates dollar swap lines at OIS+25bps as the public dealer of last resort. The FX swap basis spread is the primary real-time indicator of offshore dollar scarcity. The Fed, as \"swapper of last resort,\" has expanded its swap line network after every crisis (GFC 2008, Repocalypse 2019, COVID 2020, SVB 2023), gradually transforming swap lines from backstop to casual dollar supply tool.\n"}, {"x": -0.46629688143730164, "y": 17.10654067993164, "z": 17.49687385559082, "id": "nbfi_sovereign_bond_absorption_post_ecb_qt_001", "title": "NBFI Sovereign Bond Absorption Post-ECB-QT", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "As the ECB systematically withdraws under quantitative tightening, non-bank financial intermediaries (investment funds, insurance companies, pension funds) have absorbed the majority of European sovereign bond supply, but these buyers are structurally less stable than the central bank: they are leverage-sensitive, redemption-prone, and pro-cyclical, making periodic dislocation events structurally more likely. [LLM]"}, {"x": 9.537625312805176, "y": 14.284732818603516, "z": -3.137730598449707, "id": "asian_dollar_market_acu_structure_sibor_001", "title": "Asian Dollar Market ACU Structure And SIBOR Mechanics", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Asian Dollar Market was a regional eurodollar system in which ACU (Asian Currency Unit) banks in Singapore issued SIBOR-linked dollar liabilities (CDs, time deposits, bonds) to offshore dollar holders, on-lent to regional borrowers at SIBOR+spread, and settled all dollar transfers through US correspondent accounts \u2014 a structure that thrived on Singapore's regulatory arbitrage before being structurally gutted by post-GFC reforms targeting unsecured lending."}, {"x": -0.8777769804000854, "y": -13.472082138061523, "z": -20.277294158935547, "id": "swap_carry_and_roll_down_analysis_001", "title": "Swap Carry And Roll Down Analysis", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "For any interest rate swap held over a horizon period, the total P&L from inaction decomposes into (1) carry \u2014 net interest earned while holding the trade \u2014 and (2) roll-down \u2014 the mark-to-market gain from the swap aging on an unchanged curve; together these define the break-even rate move required to lose money on the position."}, {"x": 4.314076900482178, "y": 5.935647487640381, "z": -6.954908847808838, "id": "private_credit_secondary_market_price_discovery_001", "title": "Private Credit Secondary Market Price Discovery", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "Private credit secondary markets are transforming from LP convenience into a price discovery mechanism that challenges reported NAVs: growing from bn (2023) to 8bn+ (2025), secondaries price at observable discounts (avg 90-92% of NAV) that serve as external benchmarks, progressively undermining the pure mark-to-model valuation regime and creating feedback loops between secondary pricing, redemption behavior, and fundraising."}, {"x": 2.1335198879241943, "y": 8.372416496276855, "z": -7.439422607421875, "id": "private_credit_subscription_nav_lending_hidden_leverage_001", "title": "Private Credit Subscription NAV Lending Hidden Leverage", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "Subscription credit facilities (secured by LP commitments) and NAV loans (secured by fund investment values) constitute a hidden leverage layer in private credit not visible in standard portfolio metrics; OFR estimates $410-540bn in bank credit extended to private credit vehicles, concentrated 60% among 5 GSIBs, creating a plausible correlated liquidity transmission route where PC fund stress and bank credit tightening reinforce each other."}, {"x": 6.662491321563721, "y": 1.1338661909103394, "z": -10.47628116607666, "id": "mechanism_collateral_transformation_001", "title": "Collateral Transformation Chain", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Collateral transformation is the process by which lower-quality or less-liquid assets are exchanged for higher-quality or more-liquid collateral (typically Treasuries or agency MBS) through a chain of repo and securities lending transactions. Each step in the chain allows the transformed collateral to satisfy higher-standard requirements (CCP initial margin, LCR HQLA, cleared derivative posting) \u2014 but also extends the chain length and amplifies systemic liquidity risk if one link breaks.\n"}, {"x": 1.3734405040740967, "y": 16.98993492126465, "z": 19.26502799987793, "id": "fed_range_floor_on_rrp_non_bank_access_constraint_001", "title": "Fed Range Floor ON RRP Non-Bank Access Constraint", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed operates a \"range floor\" rather than a pure floor because non-bank institutions (money market funds, GSEs) participate in the FFR market but cannot earn IORB \u2014 instead accessing the ON RRP facility at a rate below IORB, creating a dual-floor structure where IORB anchors the upper bound for bank-mediated rates and ON RRP anchors the lower bound for non-bank entities, producing a 10-15bp FFR range rather than convergence to a single rate. [LLM]"}, {"x": 1.3842977285385132, "y": 17.58222007751465, "z": 21.012773513793945, "id": "pbc_structural_monetary_policy_targeted_relending_001", "title": "PBC Structural Monetary Policy Targeted Relending", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The PBC's structural monetary policy tools \u2014 relending and rediscount facilities \u2014 provide below-market-rate funding to commercial banks that direct credit to PBC-designated priority sectors (agriculture, small enterprises, green energy); this is a form of directed credit allocation that operates alongside market-based monetary policy, blurring the boundary between monetary and industrial policy. [LLM]"}, {"x": 6.045437812805176, "y": 21.235605239868164, "z": -6.533923149108887, "id": "standing_repo_facility_srf_mec_001", "title": "Standing Repo Facility SRF Fed Backstop", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Standing Repo Facility (SRF) acts as a ceiling for the SOFR and a liquidity safety valve for the US Treasury market, designed to cap secured rates and mitigate dealer balance sheet stress by providing a destigmatized backstop.\n"}, {"x": 1.92573881149292, "y": 8.320352554321289, "z": -7.405381202697754, "id": "bank_nbfi_leverage_loop_001", "title": "Bank NBFI Leverage Loop", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Subscription credit facilities (secured by LP capital call rights) and NAV loans (secured by portfolio cash flows via SPV) allow private credit funds to borrow from regulated banks, creating a hidden leverage layer that (1) artificially inflates reported IRR by delaying LP capital calls, and (2) links PC fund solvency to bank willingness to roll short-term financing. [LLM] In stress, simultaneous drawdown of these facilities creates a correlated liquidity demand on banks \u2014 the inverse of the intended \"risk transfer\" rationale of Basel regulation.\n"}, {"x": 24.784738540649414, "y": 11.937769889831543, "z": 1.0202730894088745, "id": "nonlinear_inflation_amplifiers_mec_001", "title": "Non-Linear Inflation Amplifier Mechanics", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Inflation propagation in response to supply shocks occurs through two distinct amplifiers: the structural amplifier (automatic input-output cascades through production networks) and the behavioral amplifier (changes in wage- and price-setting behavior driven by expectations). [LLM]\n"}, {"x": 5.197859764099121, "y": 23.737133026123047, "z": -1.393941879272461, "id": "fed_rmo_reserve_management_operations_001", "title": "Fed RMO Reserve Management Operations Post QT Mechanics", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Reserve Management Operations (RMOs) are the Fed's post-QT balance sheet tool: outright bill purchases that inject reserves to maintain ample liquidity \u2014 NOT QE. Unlike QE (swapping reserves for long-duration Treasuries to absorb risk and stimulate), RMOs simply offset the structural reserve drains that continue even after QT ends: currency in circulation growth, bank asset expansion, and TGA re-accumulation. The Fed ended QT2 on December 1, 2025; RMOs were expected to start Q1 2026 (~$20-30B/month), totaling ~$240B in reserve injections needed by end-2027.\n"}, {"x": 1.8916529417037964, "y": 6.513187885284424, "z": -6.507451057434082, "id": "pik_payment_in_kind_credit_masking_001", "title": "PIK Payment In Kind Credit Stress Masking", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "PIK (Payment-in-Kind) allows borrowers to defer cash interest by accruing additional principal, keeping reported default rates optically low while true leverage rises. [LLM] Rising PIK share in BDCs is a leading indicator of unrealized credit stress; in a stress scenario, deferred losses and compounding principal concentrate into a simultaneous default spike rather than the gradual deterioration that cash-pay covenant structures would produce.\n"}, {"x": 2.4000794887542725, "y": 23.972152709960938, "z": -3.078026294708252, "id": "tga_target_creep_bill_issuance_001", "title": "TGA Target Creep Bill Issuance And Reserve Neutralization", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "As Treasury shifts debt issuance toward shorter-maturity bills, the frequency of maturities and redemptions rises, requiring a larger cash buffer in the TGA \u2014 structurally pushing Treasury to ratchet up its TGA target (e.g. $850B \u2192 $900B+), which permanently neutralizes additional reserves in the government's account and must be offset by Fed RMOs."}, {"x": 1.1963565349578857, "y": 16.841678619384766, "z": 19.105772018432617, "id": "ecb_new_operational_framework_range_floor_2024_001", "title": "ECB New Operational Framework Range Floor 2024", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The ECB's 2024 operational framework establishes a \"range floor\" with a 15bp spread between the Deposit Facility Rate (DFR, the effective floor) and the MRO rate: excess reserves keep \u20acSTR close to the DFR, while the MRO-DFR corridor provides a volatility buffer for episodes of reserve scarcity \u2014 retaining the floor system's advantages (reliable rate control, balance sheet as a separate policy instrument) without requiring a permanently large balance sheet. [LLM]"}, {"x": 8.816766738891602, "y": 1.0730756521224976, "z": 1.0756927728652954, "id": "central_bank_intermediation_balance_sheet_autonomous_factors_001", "title": "Central Bank Intermediation Balance Sheet Autonomous Factors", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Central bank intermediation describes the CB acting as interbank market substitute when direct bank-to-bank lending breaks down. Relative intermediation (no balance sheet expansion) can occur with partial interbank stress; absolute intermediation (balance sheet expansion) occurs in full market breakdown. Autonomous factors \u2014 banknotes, government deposits, foreign assets \u2014 continuously perturb system reserves and must be offset by OMOs."}, {"x": 13.92086410522461, "y": 15.200067520141602, "z": -3.343663454055786, "id": "fx_settlement_risk_cls_ptf_001", "title": "FX Settlement Risk, CLS, and PTF Market Structure Evolution", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "FX settlement risk \u2014 the risk one party delivers currency but the counterparty fails to deliver (Herstatt risk, 1974) \u2014 was structurally mitigated by CLS Group (2002) via payment-vs-payment (PvP) settlement. Simultaneously, the FX dealer oligopoly eroded: from voice brokers \u2192 EBS/Reuters (1992) \u2192 single-bank platforms (2001) \u2192 multi-dealer ECNs \u2192 algo trading (2004) \u2192 principal trading firms (PTFs) like Jump Trading and XTX Markets entering the interdealer market post-GFC, displacing bank proprietary desks constrained by regulation.\n"}, {"x": -18.745498657226562, "y": -5.148434638977051, "z": 0.8433294296264648, "id": "duration_targeting_convergence_and_yield_trap_001", "title": "Duration Targeting Convergence And Yield Trap", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "At the 'effective maturity' horizon (\u2248 2\u00d7 duration target), cumulative accrual gains and cumulative price effects exactly offset each other regardless of yield direction, creating a convergence to initial yield \u2014 and trapping the investor in the yield environment at portfolio inception."}, {"x": 0.5945358872413635, "y": 21.36122703552246, "z": 18.50165557861328, "id": "fx_swap_basis_cip_deviation_dollar_scarcity_001", "title": "FX Swap Basis CIP Deviation Dollar Scarcity", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "The cross-currency basis (deviation from covered interest parity) reflects balance-sheet constraints that prevent arbitrage between currency markets; when global dollar demand surges and dealer intermediation capacity is constrained, the basis widens negative for foreign currencies against USD, signalling systemic dollar scarcity \u2014 the mechanism that activates demand for Fed swap line facilities during crises. [LLM]"}, {"x": 13.380010604858398, "y": 21.34666633605957, "z": 3.607057571411133, "id": "financial_repression_distributional_welfare_effects_001", "title": "Financial Repression Distributional Welfare Effects", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Financial repression via QE and low-rate policy generates systematically regressive distributional effects: deposit-heavy non-participants (67% of Japanese households, skewed toward young and low-income) bear welfare losses of 6-9% of wealth per 100bps rate decline because their asset duration cannot match their consumption duration, while equity-holding participants (older, wealthier) gain 17-25%, producing intergenerational wealth transfers from depositors to the sovereign and asset owners."}, {"x": 6.906917095184326, "y": -0.1620548814535141, "z": -10.000447273254395, "id": "collateral_velocity_001", "title": "Collateral Velocity and Rehypothecation", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Collateral velocity measures how many times a given piece of collateral is reused (pledged and re-pledged) within the financial system. Pre-Lehman, the pledged-collateral market reached ~$10 trillion \u2014 comparable to M2 \u2014 and collapsed to ~$5 trillion in 2008-9 as reuse chains broke. High velocity amplifies credit creation; restricted velocity (via QE or regulation) impairs financial intermediation analogously to a drying-up of interbank markets.\n"}, {"x": 0.9453076124191284, "y": 17.692882537841797, "z": 21.608482360839844, "id": "pbc_reserve_requirement_ratio_liquidity_management_001", "title": "PBC Reserve Requirement Ratio Liquidity Management", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The PBC uses the reserve requirement ratio (RRR) primarily as a liquidity management tool to sterilize foreign exchange reserve flows and adjust monetary base conditions \u2014 not for financial stability purposes as in most advanced economies; RRR changes carry strong signalling power for monetary policy stance and are typically correlated with concurrent changes in price-based instruments. [LLM]"}, {"x": 8.911055564880371, "y": 19.048404693603516, "z": -5.966041088104248, "id": "fhlb_foreign_bank_iorb_arbitrage_001", "title": "FHLB Foreign Bank EFFR IORB Arbitrage Fed Funds Market", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The U.S. Fed Funds market is now sustained almost entirely by a single arbitrage trade \u2014 Federal Home Loan Banks (FHLBs), which cannot earn IORB on reserves, lend reserves to foreign bank branches at EFFR; those foreign banks (exempt from U.S. regulatory costs) deposit the reserves at the Fed and earn the IORB-EFFR spread (~5-10bps), representing the last meaningful unsecured interbank lending activity in the post-Basel III system."}, {"x": -0.25807783007621765, "y": 20.09609603881836, "z": 16.947771072387695, "id": "uk_inflation_persistence_structural_drivers_001", "title": "UK Inflation Persistence Structural Drivers", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "UK inflation is structurally stickier than US inflation due to: (1) energy market structure transmitting price shocks more fully into electricity/gas prices; (2) full pass-through of energy shocks into minimum wage indexation and welfare benefits; and (3) Bank of England credibility gap that leaves inflation expectations less well-anchored \u2014 collectively explaining why UK breakeven inflation moves more sharply than US counterparts in response to global price shocks. [LLM]"}, {"x": -1.6563633680343628, "y": 19.51931381225586, "z": -6.0830254554748535, "id": "treasury_buybacks_sovereign_debt_001", "title": "Treasury Buybacks Sovereign Debt Liquidity Intervention", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "When Treasury market illiquidity escalates, the U.S. Treasury's first-line intervention (before full YCC) is secondary-market buybacks \u2014 repurchasing off-the-run bonds via primary dealers to compress the illiquidity premium, reduce interest expense, and break the illiquidity spiral (volatility \u2192 illiquidity \u2192 more volatility doom loop) without requiring Fed balance sheet expansion."}, {"x": 1.772892713546753, "y": 19.07390785217285, "z": 17.928089141845703, "id": "tga_reform_as_fed_balance_sheet_reduction_tool_001", "title": "TGA Reform as Fed Balance Sheet Reduction Tool", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Reducing the level and volatility of the Treasury General Account (TGA) is identified as the most accessible path to shrinking the Fed balance sheet without increasing rate volatility \u2014 because TGA moves drive opposite moves in reserves, so lower TGA volatility reduces the required ample reserves buffer; proposals include moving Treasury cash management to private money markets or capping TGA balances, with side benefits of reducing the Fed's footprint in money markets. [LLM]"}, {"x": 8.39199161529541, "y": 25.53985595703125, "z": 2.364983558654785, "id": "china_lpr_quoting_mechanism_credit_channel_001", "title": "China LPR Quoting Mechanism And Credit Channel Dominance", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The LPR is formed monthly by 20 quoting banks submitting spreads over the OMO (primarily MLF) rate to the National Interbank Funding Center, with the arithmetic mean after excluding outliers published for 1Y and 5Y+ maturities; China's monetary transmission is primarily driven by the credit channel (affecting credit availability) rather than the interest rate channel, and cross-market transmission between the money market (DR007), credit market (LPR), and bond market (Treasury yield) is structurally blocked."}, {"x": -1.919485330581665, "y": 18.788198471069336, "z": 20.19024658203125, "id": "bank_private_credit_partnership_model_post_basel_001", "title": "Bank Private Credit Partnership Model Post-Basel", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "Rather than simple displacement, banks are increasingly partnering with private credit funds: banks provide back-leverage (repo/credit lines to funds), co-originate loans while selling the risk, or refer deals in exchange for fee income \u2014 retaining customer relationships without the capital charge; this convergence model blurs the boundary between regulated and shadow banking and creates new forms of interconnectedness. [LLM]"}, {"x": -1.919485330581665, "y": 18.788198471069336, "z": 20.19024658203125, "id": "basel_iii_capital_requirements_private_credit_migration_001", "title": "Basel III Capital Requirements Private Credit Migration", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "Basel III increased CET1 and liquidity requirements force banks to retreat from capital-intensive corporate and leveraged lending; private credit funds \u2014 not subject to equivalent capital requirements \u2014 fill the financing void, a process characterised as regulatory arbitrage that has structurally migrated lending from the regulated banking sector into the shadow banking / NBFI sector. [LLM]"}, {"x": -1.9946413040161133, "y": 19.61027717590332, "z": 18.695201873779297, "id": "private_credit_systemic_stress_transmission_mechanism_001", "title": "Private Credit Systemic Stress Transmission Mechanism", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Private credit systemic stress transmits through four simultaneous channels: (1) leverage providers face correlated drawdowns on revolving credit lines; (2) LPs face capital calls and commitment strain; (3) NAV loans and subscription facilities become harder to roll or more expensive; (4) confidence in valuations weakens as secondary clearing prices and public proxy prices (BDC NAV discounts) diverge from reported marks \u2014 making \"liquidity event\" and \"valuation event\" synonymous in a market not built for continuous clearing. [LLM]"}, {"x": -0.841555655002594, "y": 10.928388595581055, "z": -1.3938806056976318, "id": "basel_output_floor_specialized_lending_001", "title": "Basel Output Floor Specialized Lending Impact", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "The Output Floor (72.5% of SA-RWA, fully phased-in Jan 2027) prevents banks from using internal IRB models to reduce RWA below 72.5% of the Standardised Approach calculation, eliminating the capital optimization advantage that made specialized lending (project finance, CRE, unrated mid-market loans) viable on bank balance sheets \u2014 regardless of actual historical default rates. [LLM] This is the single largest driver of bank retreat from specialized corporate credit, creating the structural gap that private credit fills.\n"}, {"x": 7.939638614654541, "y": 22.74893569946289, "z": -3.5057835578918457, "id": "fed_cmo_rmo_distinction_001", "title": "Fed CMO RMO Distinction And Rate Band Management", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed uses two distinct reserve injection tools to maintain the federal funds rate within its target band \u2014 CMOs (Ceiling Management Operations) are emergency interventions that push market rates away from the SRF ceiling, while RMOs (Reserve Management Operations) are routine outright bill purchases that maintain ample reserves over time \u2014 with CMOs typically preceding RMOs when rates breach the upper limit of the target band."}, {"x": 7.027974605560303, "y": 19.457700729370117, "z": -2.564389228820801, "id": "fed_bs_floor_payment_system_001", "title": "Fed Balance Sheet Floor Payment System Reserve Demand", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The U.S. payment system (Fedwire ~$7.3T/day) creates a structural floor on the size of the Fed's balance sheet: large banks (GSIBs) are unwilling to use Fed liquidity facilities (daylight overdrafts, Discount Window, Standing Repo) due to regulatory stigma and post-GFC liquidity regulation self-sufficiency requirements, so they pre-load opening reserve balances instead; when QT reduces reserves below this floor, banks throttle outgoing payments, creating a self-fulfilling liquidity crunch with repo rates spiking far above IORB \u2014 as on September 17, 2019, when SOFR spiked 315bps above IORB."}, {"x": 6.8927741050720215, "y": 22.051361083984375, "z": -3.165440082550049, "id": "global_compression_rv_gse_xccy_001", "title": "Global Compression RV Fund GSE MBS And XCCY Basis Frontier", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Three forces extend the Fed's RMO requirement beyond initial estimates \u2014 Big Six banks front-running rate cuts by swapping reserves for USTs (structural reserve drain), GSE mandated MBS purchases (~$200B) funded via agency debt creating upward overnight rate pressure, and RV fund basis trade persistence driving structural repo demand \u2014 with XCCY basis emerging as the next battleground when onshore USD funding normalizes."}, {"x": -1.5017342567443848, "y": 11.398113250732422, "z": -2.8398871421813965, "id": "slr_lcr_balance_sheet_constraints_treasury_market_dealer_001", "title": "SLR LCR Balance Sheet Constraints Treasury Market Dealer", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Post-GFC Basel III regulations \u2014 especially the Supplementary Leverage Ratio (SLR) and Liquidity Coverage Ratio (LCR) \u2014 constrain primary dealer balance sheets, reducing their capacity to absorb Treasury supply during periods of elevated issuance or volatility. The resulting illiquidity spiral (volatility -> wider spreads -> forced selling -> more volatility) creates systemic risk in the world's largest bond market."}, {"x": 5.809652805328369, "y": 0.7110279202461243, "z": -2.0699124336242676, "id": "collateral_framework_haircuts_central_bank_credit_001", "title": "Collateral Framework Haircuts Central Bank Credit", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Central bank collateral frameworks define eligible assets, haircuts, and concentration limits for CB credit operations. Haircuts serve as the primary risk buffer and function as a secondary monetary policy instrument: tighter haircuts raise effective funding costs across the economy. Collateral scarcity \u2014 when eligible assets are insufficient to meet reserve needs \u2014 can cause overnight rates to spike above target independently of CB intent."}, {"x": 10.426125526428223, "y": 0.5072468519210815, "z": -12.91846752166748, "id": "repo_clearing_segments_ficc_001", "title": "Repo Market Clearing Segments FICC Triparty GCF DVP NCCBR", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "The U.S. repo market is segmented into four clearing structures \u2014 triparty (uncleared GC via BNY Mellon, MMFs as cash lenders), GCF Repo (cleared interdealer GC via FICC), DVP Repo (cleared specific-collateral interdealer via FICC), and NCCBR (uncleared specific-collateral bilateral, dealers + hedge funds) \u2014 each producing a distinct overnight rate (TPR=TGCR, GCF index, DVP, NCCBR) used by the Fed to calibrate its rate corridor."}, {"x": 0.44425973296165466, "y": 17.19835090637207, "z": 21.108413696289062, "id": "pbc_interest_rate_transmission_dr007_to_lpr_001", "title": "PBC Interest Rate Transmission DR007 to LPR", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "China's interest rate transmission chain flows from PBC OMO operations \u2192 7-day interbank repo rate (DR007, the short-term benchmark) \u2192 MLF rate (medium-term policy rate) \u2192 Loan Prime Rate (LPR, quoted as a spread to the MLF) \u2192 retail lending rates; money market conditions and short-end government yields respond to PBC liquidity operations, while medium- and long-term yields are primarily driven by macroeconomic expectations. [LLM]"}, {"x": 8.931397438049316, "y": 20.174867630004883, "z": 1.9469048976898193, "id": "yen_intervention_liquidity_drain_mec_001", "title": "Yen Intervention Liquidity Drain Mechanism", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Yen intervention by the Ministry of Finance (MoF) acts as a global liquidity drain; by selling US Treasuries to buy Yen, Japan effectively reduces the supply of global dollar collateral while increasing selling pressure on US rates.\n"}, {"x": 9.72793197631836, "y": -0.1441519856452942, "z": -12.388106346130371, "id": "repo_market_structure_gc_sc_cleared_001", "title": "Repo Market Structure GC SC Cleared Segments and SEC Mandate", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "The U.S. repo market is organized along two dimensions: (1) purpose \u2014 General Collateral (GC/triparty: cash-focused) vs Specific Collateral (SC/DVP/bilateral: securities-focused), and (2) clearing \u2014 centrally cleared via FICC vs non-centrally cleared. The four resulting segments (triparty uncleared, GCF cleared, DVP cleared, NCCBR uncleared) produce a rate hierarchy (o/n TPR < o/n GCF < o/n DVP < o/n NCCBR) and underlie the Fed's three secured benchmarks (TGCR, BGCR, SOFR). The SEC's mandatory central clearing mandate (July 2027) will force most NCCBR volumes into FICC-cleared segments, permanently reshaping the rate complex.\n"}, {"x": 3.684749126434326, "y": 23.783309936523438, "z": -1.4810822010040283, "id": "quantitative_tightening_qt_balance_sheet_runoff_001", "title": "Quantitative Tightening QT Balance Sheet Runoff", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Quantitative Tightening (QT) reduces the Fed balance sheet by allowing maturing securities to roll off without reinvestment, up to a monthly redemption cap. QT destroys reserves and bank deposits when investors fund bond purchases with bank deposits \u2014 but its tightening effect is limited: Atlanta Fed research estimates .2T of QT equivalent to only 0.29-0.74% in rate hikes over three years."}, {"x": 0.44425973296165466, "y": 17.19835090637207, "z": 21.108413696289062, "id": "pbc_medium_term_lending_facility_rate_transmission_001", "title": "PBC Medium-Term Lending Facility Rate Transmission", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The PBC's Medium-Term Lending Facility (MLF) provides 12-month collateralized funding to commercial and policy banks at the PBC's medium-term policy rate; since 2017, the MLF rate has served as the anchor for the Loan Prime Rate (LPR) \u2014 the benchmark for commercial lending \u2014 creating a transmission chain from PBC policy to retail credit conditions. [LLM]"}, {"x": 3.396498680114746, "y": 23.762554168701172, "z": -1.282673716545105, "id": "tqt_coupon_duration_tightening_001", "title": "TQT Tighter Quantitative Tightening Coupon Issuance Duration Channel", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "TQT (Tighter Quantitative Tightening) \u2014 when the U.S. Treasury shifts issuance from short-term bills toward longer-duration coupon bonds (notes and bonds) \u2014 is more effective at tightening financial conditions than standard QT, because duration risk forces investors to reassess risk tolerance and sell riskier assets to offset the new duration exposure; the Treasury (not the Fed) controls this dimension of financial tightening."}, {"x": 0.11100511997938156, "y": 21.012130737304688, "z": 20.67397689819336, "id": "discount_window_stigma_self_reinforcing_equilibrium_001", "title": "Discount Window Stigma Self-Reinforcing Equilibrium", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Discount window stigma is a self-reinforcing Nash equilibrium: banks that access the window are perceived as distressed, causing other banks with surplus reserves to demand above-market rates from recent window borrowers, which makes the window option more costly than paying a premium in interbank markets \u2014 perpetuating the stigma and undermining the Fed's lender of last resort function. [LLM]"}, {"x": 4.198882579803467, "y": 8.214503288269043, "z": -6.8287129402160645, "id": "private_credit_insurer_structural_channel_001", "title": "Private Credit Insurer Structural Channel", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "Life insurers have become structural anchor investors in private credit, growing US private placement holdings from $386bn (2014) to $849bn (2024, 14% of general account assets), driven by asset-liability matching logic and post-crisis yield compression; private equity entry into insurance as a source of permanent capital created a vertically integrated origination-to-funding loop that industrialized this channel at scale."}, {"x": 2.104564666748047, "y": 15.392207145690918, "z": -7.443460464477539, "id": "sofr_systemic_blindspot_libor_001", "title": "SOFR Systemic Risk Blindspot LIBOR Secured Lending Standard", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "SOFR's replacement of LIBOR resolved benchmark manipulation risk but introduced a new systemic blindspot \u2014 because SOFR is secured (repo-backed), it does not spike during bank funding stress the way LIBOR did, making it a poor early-warning signal of unsecured credit stress; meanwhile the global secured lending standard (RFRs replacing IBORs in derivatives, bonds, and loans) has tightened the linkage between private finance and sovereign balance sheets."}, {"x": 10.179798126220703, "y": -1.3142969608306885, "z": -12.42662525177002, "id": "repo_market_mechanics_triparty_bilateral_001", "title": "Repo Market Mechanics Triparty Bilateral", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "The repo market is the secured funding backbone of the US financial system, executing 3-4 trillion dollars daily across three segments: triparty (custodian-intermediated), GCF (centrally cleared interdealer), and NCCBR (bilateral, hedge-fund-dominated). Repo makes Treasuries functionally equivalent to cash and prices its rates into SOFR, the global USD benchmark."}, {"x": 7.574629306793213, "y": 19.149385452270508, "z": -5.295639514923096, "id": "fed_policy_rate_shift_effr_to_secured_rate_tgcr_001", "title": "Fed Policy Rate Shift EFFR to Secured Rate TGCR", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed's EFFR target has become a technical artifact of FHLB-GSE regulatory arbitrage rather than genuine interbank borrowing demand \u2014 Fed Funds volume collapsed ~80% post-2008 and surviving activity is dominated by FHLB\u2192FBO IORB arbitrage and FHLB\u2192G-SIB IBDA intraday liquidity trades. The inevitable replacement is a two-step evolution: first TGCR (Triparty General Collateral Rate, $1T+ of MMF\u2192dealer repo funding), then SOFR (broader, captures DVP segment too). TGCR is preferred over BGCR (adds GCF interdealer noise) and over SOFR (adds speculative DVP volumes that will be reshaped by the SEC's July 2027 central clearing mandate). Targeting an administered rate (IORB or ON RRP) was ruled out as it would shift power between Fed factions and erode public trust.\n"}, {"x": 9.1561279296875, "y": 20.47683334350586, "z": -5.7662177085876465, "id": "fhlb_effr_iorb_arbitrage_floor_mechanism_001", "title": "FHLB EFFR IORB Arbitrage Floor Mechanism", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Federal Funds rate (EFFR) is maintained near the IORB floor primarily through FHLB arbitrage: FHLBs, ineligible for IORB, lend reserves to banks at EFFR (slightly below IORB), which deposit at the Fed for a spread; this creates a soft floor on EFFR and means SOFR rising above IORB is the key leading indicator that reserve scarcity is transitioning from ample to binding."}, {"x": 0.7640104293823242, "y": 18.72042465209961, "z": 19.189510345458984, "id": "fed_qe_debt_maturity_transformation_fiscal_impact_001", "title": "Fed QE Debt Maturity Transformation Fiscal Impact", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Fed QE programs systematically undid the Treasury's interest rate hedges by purchasing long-term bonds and issuing overnight reserve liabilities in exchange \u2014 effectively converting fixed-rate government debt to floating-rate, so that when interest rates rose after 2022, the combined Treasury-Fed entity faced higher interest costs than if the Treasury had simply retained its long-term debt issuance; this overlap makes the separation of monetary and fiscal policy responsibility structurally ambiguous. [LLM]"}, {"x": 0.9251013994216919, "y": 16.65187644958496, "z": 19.33767318725586, "id": "floor_system_rate_convergence_mechanism_001", "title": "Floor System Rate Convergence Mechanism", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "In a floor system, the overnight interbank rate converges to the central bank's reserve remuneration rate (DFR/IORB) through two arbitrage conditions: (1) borrowing banks can shop among banks with excess reserves, preventing rates from rising far above the remuneration rate; and (2) banks with excess reserves will never lend below the remuneration rate \u2014 together creating a natural floor with three advantages: reliable rate control, balance sheet size as a separable policy instrument, and expanded supply of safe liquid assets. [LLM]"}, {"x": 4.479769706726074, "y": 22.98417091369629, "z": -7.36625862121582, "id": "btfp_svb_crisis_emergency_lending_001", "title": "BTFP SVB Crisis and Fed Emergency Lending Evolution", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "SVB's March 2023 collapse \u2014 driven by uninsured deposit flight amplified by social media \u2014 revealed that the Discount Window's Primary Credit Facility was too stigmatized for bank use, prompting the Fed to create the BTFP (loans at par value, 1-year term). The BTFP later became a risk-free arbitrage (BTFP rate < IORB \u2192 50bps spread) before expiring March 2024, prompting a broader reform agenda including Discount Window \"prepositioning\" and destigmatization.\n"}, {"x": 8.58438777923584, "y": 21.696250915527344, "z": -4.123109340667725, "id": "fed_overnight_reverse_repo_on_rrp_001", "title": "Fed Overnight Reverse Repo ON RRP", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed Overnight Reverse Repo facility (ON RRP) is the Fed liquidity shock absorber: it accepts cash from money market funds and GSEs overnight in exchange for Treasury collateral, paying the ON RRP rate. When bank deposits and bill supply are abundant, RRP drains to zero; when reserves are scarce and bill supply falls, RRP surges as MMFs have nowhere else to park cash."}, {"x": -18.68294334411621, "y": -0.3928324282169342, "z": -0.039187241345644, "id": "dv01_duration_001", "title": "DV01, Duration, and Convexity \u2014 Fixed Income Risk Measures", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "DV01 (dollar value of a basis point) measures the price change of a fixed income instrument for a 1bp parallel shift in yields. Duration (modified) is the percentage price sensitivity; convexity captures the curvature \u2014 the fact that price-yield relationship is non-linear. Together they form the fundamental risk language for all fixed income positions: hedging, relative value, and P&L attribution.\n"}, {"x": 5.010994911193848, "y": 22.342330932617188, "z": -7.076918125152588, "id": "srf_structural_defects_morning_repo_001", "title": "SRF Structural Defects Morning Repo Fortification And True Ceiling", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The SRF's advertised ceiling rate (SRFR) understates the true effective ceiling because dealers need ~25bps over SRFR to cover SRF balance sheet costs (can't net trades), haircuts on collateral, and negative carry risk \u2014 defects partially addressed by \"morning Fed repos\" (December 2024) that let dealers borrow at dawn rather than waiting until 1:15pm, but stigma persists structurally and cannot be eliminated by price or timing fixes alone."}, {"x": 6.8755669593811035, "y": 19.133621215820312, "z": -5.009298801422119, "id": "fhlb_ibda_intraday_resolution_liquidity_001", "title": "FHLB IBDA Intraday Resolution Liquidity and Fed Funds Market Survival", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Post-2017, the Fed's G-SIB resolution liquidity requirements (from \"living wills\") created demand for around-the-clock HQLA buffers that overnight Fed Funds cannot satisfy. FHLBs \u2014 barred from earning IORB \u2014 filled this gap by supplying intraday reserves to G-SIBs via IBDAs (Interest-Bearing Deposit Accounts) at 5-10bps above the FOMC target range. This is why the Fed Funds market survived post-2008 despite being nearly extinct \u2014 it evolved into an IBDA/intraday liquidity mechanism dominated by FHLB lending. FHLBs now constitute ~97% of all Fed Funds lending.\n"}, {"x": -0.25807783007621765, "y": 20.096097946166992, "z": 16.947771072387695, "id": "gilt_treasury_spread_monetary_policy_expectations_driver_001", "title": "Gilt-Treasury Spread Monetary Policy Expectations Driver", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The 10-year gilt-Treasury spread is primarily driven by relative monetary policy expectations (captured in the 2-year spread), not by UK fiscal credibility; the 2022 Truss/Kwarteng mini-budget showed a genuine fiscal credibility crisis manifests in simultaneous gilt spread widening AND sterling depreciation \u2014 while 2023-2026 gilt spread widening accompanied sterling appreciation, pointing to UK inflation being stickier than US inflation as the true driver. [LLM]"}, {"x": -0.22582605481147766, "y": 19.757232666015625, "z": 20.875843048095703, "id": "japan_consolidated_public_sector_sovereign_wealth_fund_mechanism_001", "title": "Japan Consolidated Public Sector Sovereign Wealth Fund Mechanism", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Japan's consolidated public sector (government + BoJ + public pension + GPIF) operates as a leveraged sovereign wealth fund: it borrows short at near-zero rates (JGBs 107% GDP + BoJ reserves 91% GDP = 275% GDP liabilities) and invests long in risky assets (domestic equities + unhedged foreign securities = 95% GDP), earning excess returns of ~6% GDP annually above funding costs \u2014 a structure that creates massive interest rate and FX risk at the consolidated balance sheet level. [LLM]"}, {"x": 0.6633858680725098, "y": -5.702792167663574, "z": -15.385372161865234, "id": "asset_swap_mechanics_and_spread_001", "title": "Asset Swap Mechanics And Spread", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "An asset swap packages a fixed-rate bond purchase with a pay-fixed receive-floating interest rate swap, transforming the bond into a synthetic floater; the resulting asset swap spread (LIBOR + spread) isolates the bond's credit spread from interest rate risk, making it a credit-pure relative value metric."}, {"x": 6.731544494628906, "y": 20.515914916992188, "z": 8.499130249023438, "id": "treasury_general_account_tga_reserve_swap_mec_001", "title": "Treasury General Account TGA Reserve Swap", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Treasury General Account (TGA) is the US government's checking account held at the Federal Reserve.  Changes in the TGA result in an opposite 1:1 change in bank reserves (dTGA = -dReserves) unless the Fed  adjusts its assets to maintain ample reserves. The TGA acts as an \"autonomous factor\" that directly  competes with reserves for space on the Fed's liability side.\n"}, {"x": 1.369210958480835, "y": 23.19842529296875, "z": -3.1834607124328613, "id": "debt_ceiling_extraordinary_measures_treasury_001", "title": "Debt Ceiling Extraordinary Measures Treasury", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "When the US debt ceiling binds, the Treasury deploys extraordinary measures to delay default while drawing down the TGA. The resulting TGA drawdown floods banking system reserves, creating a temporary liquidity surge that overstates system health before reversing sharply when the ceiling is lifted and Treasury refills the TGA."}, {"x": 1.3570226430892944, "y": 8.66613483428955, "z": -7.815981864929199, "id": "central_bank_pledgening_runnable_liabilities_001", "title": "Central Bank Pledgening Runnable Liabilities and Discount Window Reform", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Post-SVB, monetary leaders are reforming LoLR (lender of last resort) access via \"prepositioning\" \u2014 requiring banks to pre-pledge enough assets at the Discount Window to cover a specified share (~40%) of \"runnable\" liabilities (uninsured deposits >$250k), destigmatizing emergency borrowing while creating structural demand for Treasury and other high-quality collateral. This reinforces the \"secured standard\" where sovereign liabilities are structurally embedded in the banking system.\n"}, {"x": 15.32653522491455, "y": 10.1720552444458, "z": -4.137548446655273, "id": "mon_pol_trans_short_long_frictions_mec_001", "title": "Monetary Policy Transmission Short Long Rate Frictions", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Transmission from short-term policy rates to medium- and long-term yields is non-linear and subject to structural frictions, including asymmetric effectiveness across business cycles and shifts in market expectations that can decouple policy actions from long-term rate movements.\n"}, {"x": 2.5225069522857666, "y": 24.84864044189453, "z": -4.005210876464844, "id": "ample_reserves_buffer_sizing_tga_volatility_001", "title": "Ample Reserves Buffer Sizing TGA Volatility", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The minimum ample reserves buffer required for rate control can be estimated as B = sigma*sqrt(Delta)*z*(epsilon*Delta/2), where sigma is the standard deviation of TGA changes over the intervention interval Delta; calibrated to 2021-2025 parameters (sigma~00bn/2-week), this yields a buffer of 00-400bn \u2014 halving to 00-150bn if TGA volatility returned to pre-pandemic levels, implying that TGA management reform is the most tractable lever for Fed balance sheet reduction."}, {"x": -1.8244649171829224, "y": 21.75169563293457, "z": -4.692481994628906, "id": "mechanism_treasury_dealer_capacity_001", "title": "Treasury Market Dealer Intermediation Capacity", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Primary dealers intermediate between Treasury issuance and end investors by warehousing Treasury inventory on their balance sheets. Their capacity to do so is directly constrained by regulatory capital ratios \u2014 SLR, LCR, and G-SIB surcharge \u2014 which treat Treasury holdings as consuming balance sheet. As Treasury supply has grown from ~$14tn (2019) toward ~$30tn (2025), dealer intermediation capacity has grown proportionally less, creating a structural capacity gap that widens during stress events (March 2020, September 2019, SVB March 2023).\n"}, {"x": -5.0020365715026855, "y": 0.7733681201934814, "z": -1.4755579233169556, "id": "non_maturity_deposit_fair_margin_and_replicating_portfolio_001", "title": "Non Maturity Deposit Fair Margin And Replicating Portfolio", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Non-maturing deposits (NMDs) \u2014 accounts where clients can withdraw or deposit at any time and the bank can change the rate \u2014 are modeled via a 'fair margin' concept: the margin is the NPV-zero increase in the client coupon, and a dynamic investment strategy hedges this margin against interest rate movements, replacing the static replicating portfolio approach."}, {"x": 3.8811895847320557, "y": 23.16154670715332, "z": -2.2141988277435303, "id": "policy_fed_qt_2022_001", "title": "Fed Quantitative Tightening 2022 \u2014 Balance Sheet Runoff Policy", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed's 2022 QT reduced the balance sheet passively via maturity non-replacement, draining reserves first from the ON RRP buffer (money funds withdrew from RRP as T-bill rates rose above ON RRP rate) and then from bank reserves. The existence of the $2.4tn ON RRP buffer created a significant cushion before reserves became scarce, fundamentally changing QT dynamics vs the 2017\u20132019 episode.\n"}, {"x": 11.862210273742676, "y": 20.080995559692383, "z": 2.5596156120300293, "id": "policy_boj_qqe_ycc_001", "title": "BoJ Quantitative and Qualitative Easing + Yield Curve Control (2013\u20132024)", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The BoJ's QQE + YCC regime was the most extensive unconventional monetary program by any G7 central bank: unlimited JGB purchases at fixed yields (YCC) converted the BoJ into buyer of last resort for Japanese sovereign debt, enabled a consolidated public sector sovereign carry trade at 91% of GDP, and enforced financial repression by stripping duration from private portfolios and suppressing household savings returns.\n"}, {"x": 6.298906326293945, "y": 18.746423721313477, "z": 0.9257098436355591, "id": "policy_fed_hike_cycle_2022_001", "title": "Fed Rate Hike Cycle 2022\u20132023", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed's 2022\u20132023 tightening cycle \u2014 525bps in 11 meetings \u2014 was the fastest since Volcker, triggered by post-COVID supply shock inflation amplified by fiscal stimulus. The simultaneous QT added a balance sheet tightening channel. The cycle strained banking sector duration positions (SVB March 2023) and tested the ample reserves framework's resilience to rapid reserve drainage.\n"}, {"x": -3.0890390872955322, "y": 9.134675979614258, "z": 2.111473560333252, "id": "irrbb_eve_nii_dual_metric_framework_001", "title": "IRRBB EVE NII Dual Metric Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Basel IRRBB regulation (BCBS 368, 2016) mandates two complementary metrics \u2014 Economic Value of Equity (EVE) and Net Interest Income (NII) sensitivity \u2014 to measure structural interest rate risk in the banking book, capturing both long-run economic impact and short-run earnings impact from rate shocks."}, {"x": 0.5432219505310059, "y": 23.456439971923828, "z": -3.640336275100708, "id": "sovereign_debt_intervention_ladder_001", "title": "Sovereign Debt Intervention Escalation Ladder", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Central bank and fiscal authorities follow a graduated intervention ladder when sovereign bond markets destabilize \u2014 from Treasury buybacks (no monetary expansion) through SLR relief, Fed \"soft ceiling\" (temporary YCC), and full YCC \u2014 with each step representi
