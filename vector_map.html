<script>
const points = [{"x": 22.79306983947754, "y": 9.53223705291748, "z": 20.98307991027832, "id": "entity_us_treasury_001", "title": "US Treasury Department", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "The US Treasury manages federal fiscal operations \u2014 issuing debt, maintaining the Treasury General Account (TGA) at the Fed, and setting debt maturity composition via the Quarterly Refunding. Treasury's cash management decisions (TGA drawdowns, T-bill vs coupon mix, extraordinary measures) have direct first-order effects on bank reserve levels and money market conditions independent of Fed policy.\n"}, {"x": 15.126981735229492, "y": 4.985001087188721, "z": 3.5164635181427, "id": "entity_ecb_001", "title": "European Central Bank (ECB)", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The ECB sets monetary policy for the 20-member eurozone via the Governing Council, operating through the Eurosystem of national central banks (NCBs). Its 2024 operational framework shift \u2014 from excess liquidity via TLTRO to structural repo operations \u2014 marks the transition from an asset-purchase-driven floor system back toward a demand-driven corridor.\n"}, {"x": 22.375680923461914, "y": 3.062002420425415, "z": 15.190789222717285, "id": "entity_boj_001", "title": "Bank of Japan (BoJ)", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Bank of Japan is notable for operating the world's most extensive unconventional monetary policy regime: Quantitative and Qualitative Easing (QQE) from 2013, Yield Curve Control (YCC) from 2016, culminating in a 2024 exit from negative rates and YCC cap removal. Its decade-long zero-rate policy enabled Japan's consolidated public sector to operate a sovereign carry trade at 91% of GDP in bank reserves, compressing household duration and engineering implicit financial repression.\n"}, {"x": 8.844688415527344, "y": 7.095462322235107, "z": 4.882110118865967, "id": "entity_bis_001", "title": "Bank for International Settlements (BIS)", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "The BIS is the primary international forum for central bank cooperation and the host institution of the Basel Committee on Banking Supervision (BCBS), which sets global minimum capital and liquidity standards. BIS research (Working Papers, Quarterly Review) is a primary source for empirical evidence on transmission mechanisms, cross-border liquidity, and financial stability.\n"}, {"x": 18.80638885498047, "y": 7.874377727508545, "z": 8.25961685180664, "id": "entity_federal_reserve_001", "title": "Federal Reserve (Fed)", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Federal Reserve is the central bank of the United States, operating as a decentralized system of 12 Reserve Banks under a Board of Governors, with monetary policy set by the FOMC. It controls the federal funds rate target, manages the Fed's balance sheet (assets: Treasuries + MBS; liabilities: reserves + currency + TGA), and serves as fiscal agent for the US Treasury.\n"}, {"x": 16.69950294494629, "y": -6.979018211364746, "z": -7.094759941101074, "id": "cb_fx_rate_target_balance_sheet_constraint_sterilization_001", "title": "CB FX Rate Target Balance Sheet Constraint And Sterilization", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "When a central bank targets an exchange rate (fixed peg, crawling peg, or managed band), NFA becomes an endogenous variable determined by BOP flows and intervention \u2014 not a free policy instrument. The CB retains control only over NDA. Sterilization (offsetting NFA changes via NDA) can preserve the monetary base target in the short run, but faces two binding limits: (1) reserve depletion when defending against depreciation, and (2) quasi-fiscal carrying costs when sterilizing appreciation-driven inflows. Sustained sterilization against a persistent shock is unsustainable and, if delayed, results in a larger eventual adjustment.\n"}, {"x": 16.281553268432617, "y": -5.73458194732666, "z": -7.200807094573975, "id": "sterilization_offset_coefficient_eme_001", "title": "Sterilization Effectiveness \u2014 Offset and Sterilization Coefficients in EMEs", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Under open capital accounts with an FX target, the effectiveness of CB sterilization is constrained by two competing forces measured as coefficients: the offset coefficient (how much of CB tightening is neutralized by induced capital inflows) and the sterilization coefficient (how much of FX intervention liquidity is reabsorbed). When the offset coefficient exceeds the sterilization coefficient, the CB's net control over money supply is negative \u2014 tightening attracts more inflows than can be sterilized, undermining monetary autonomy. [LLM]\n"}, {"x": 4.722353458404541, "y": -14.362969398498535, "z": 2.181495428085327, "id": "collateral_velocity_reuse_rate_plumbing_001", "title": "Collateral Velocity Reuse Rate And Financial Plumbing", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Collateral velocity (reuse rate) = total pledged collateral received by large dealer banks / primary collateral sources (hedge funds + custodians); the ratio measures the length of collateral chains and acts as an analog to the velocity of money \u2014 higher velocity means greater financial lubrication; velocity fell from ~3.0x (end-2007, $10T total) to ~1.8x (end-2015, $5.6T), driven by counterparty risk and QE draining good collateral from the market; 10-15 global dealer banks are the sole intermediaries capable of moving collateral across borders in bulk, and deleveraging has two components: balance-sheet shrinking AND shortening of collateral chains (reduced interconnectedness), the latter being underappreciated."}, {"x": 19.952823638916016, "y": -15.72212028503418, "z": -6.838526725769043, "id": "enhanced_taylor_rule_eme_fx_augmented_001", "title": "Enhanced Taylor Rule for EME \u2014 FX Deviation Augmentation", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Standard Taylor rules (inflation deviation + output gap \u2192 interest rate) are incomplete for EMEs with significant exchange rate pass-through to inflation. An FX-augmented (\"enhanced\") Taylor rule adds real exchange rate deviation from equilibrium as a third driver of the policy rate. Empirical estimates show this coefficient ranges from 0 (pure IT countries like Chile) to 0.8 (Mexico) with Indonesia at 0.3, reflecting how directly the exchange rate feeds into the CB's reaction function. The enhanced rule produces better R-squared fit and more optimal countercyclical response than the standard rule in high-pass-through EMEs. [LLM]\n"}, {"x": 15.274295806884766, "y": 21.332080841064453, "z": -1.3684097528457642, "id": "eurobond_blue_red_bond_adverse_selection_moral_hazard_001", "title": "Eurobond Blue-Red Bond Adverse Selection Moral Hazard", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "The Blanchard-Ubide Eurobond proposal (blue bonds senior + VAT ring-fenced, red bonds subordinated) faces three structural failures: (1) adverse selection \u2014 without mandatory participation, only weak-fiscal countries join; (2) moral hazard \u2014 once pooled, countries bear only a fraction of the cost of their own fiscal decisions; (3) enforcement \u2014 seniority mechanisms fail during actual sovereign distress when political economy overrides legal priority. [LLM]"}, {"x": 20.555377960205078, "y": 1.1337846517562866, "z": 13.74868106842041, "id": "financial_repression_via_reserve_creation_001", "title": "Financial Repression via Reserve Creation", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Modern financial repression operates through reserve creation and yield curve control rather than explicit capital controls: by maintaining bank reserves at below-market rates, the sovereign captures an implicit spread \u2014 estimated at 197bps in Japan, equivalent to nearly 2% of GDP per year \u2014 as a tax on deposit holders, channelling private savings into public sector funding without formal restrictions."}, {"x": 16.103179931640625, "y": 2.3045766353607178, "z": 12.289604187011719, "id": "fed_usd_swap_line_architecture_and_crisis_function_001", "title": "Fed USD Swap Line Architecture and Crisis Function", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Fed dollar swap lines allow foreign central banks to exchange domestic currency for USD at a fixed rate (with reversal commitment), enabling them to lend dollars into their domestic financial systems; these facilities act as systemic stabilizers of the global dollar funding architecture during stress events when private FX swap and repo markets become impaired \u2014 as demonstrated in March 2009 and March 2020. [LLM]"}, {"x": 9.282511711120605, "y": -0.06623747199773788, "z": 14.521111488342285, "id": "scissors_effect_ecb_qt_sovereign_supply_001", "title": "Scissors Effect ECB QT And Sovereign Supply", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The 'scissors effect' occurs when a central bank simultaneously withdraws from the sovereign bond market through quantitative tightening (QT) while government issuance (net borrowing) is rising. This creates a dual pressure on the market, as the residual buyer must absorb both the new issuance and the maturing bonds being rolled off the central bank's balance sheet."}, {"x": 26.65924835205078, "y": 2.335200071334839, "z": -0.2376764714717865, "id": "incomes_policy_wage_controls_stabilization_001", "title": "Incomes Policy \u2014 Wage Controls In Stabilization Programs", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "Incomes policies \u2014 government interventions to restrain wage and price growth \u2014 are used in stabilization programs primarily to break inertial inflation (perpetuated through contracts and indexation) rather than to address excess demand. Three institutional forms exist: guideline approach, social contract, and tax-incentive policy (TIP). In transition economies, the four-step design challenge covers: (1) norm selection (wage bill vs. average wage), (2) indexation (backward vs. forward-looking), (3) coverage (public vs. also private enterprises), and (4) enforcement (excess wage tax or social pact). Historical evidence shows wage controls play a valuable but temporary role \u2014 effectiveness diminishes rapidly, and they must be exited before structural distortions accumulate.\n"}, {"x": 20.368175506591797, "y": 3.8861794471740723, "z": 16.57929229736328, "id": "qe_duration_extraction_from_private_sector_001", "title": "QE Duration Extraction from Private Sector", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Quantitative easing (QE) functions as a structural duration-for-liquidity swap. By purchasing long-duration government bonds and issuing near-zero-duration bank reserves, central banks systematically extract interest rate risk from the private sector. This forces private investors into a 'portfolio rebalancing' process\u2014seeking higher-yielding, longer-duration risky assets to replace the duration lost to the central bank, thereby easing financial conditions across the broader economy."}, {"x": -0.1352972686290741, "y": -14.908206939697266, "z": -9.458881378173828, "id": "ust_shadow_cash_market_liquidity_001", "title": "UST Shadow Cash Market Liquidity Structure", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "The U.S. Treasury cash market has developed a \"shadow cash\" counterpart where dealers and non-bank market makers (PTFs/HFTs) provide bond-like exposure via ETF creation-redemption and total return swaps, supplementing traditional repo-financed bond trading. This shadow market understates measured UST liquidity while creating a non-regulatory blind spot: internal VaR limits \u2014 not Basel III or SLR \u2014 are the primary cause of dealer withdrawal during stress events. During COVID, ETFs proved more liquid than their underlying bonds, contrary to prior fears.\n"}, {"x": 18.97489356994629, "y": 10.12499713897705, "z": 23.16670036315918, "id": "fed_ample_reserves_buffer_sizing_formula_001", "title": "Fed Ample Reserves Buffer Sizing Formula", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The ample reserves buffer the Fed Desk maintains to avoid rate-control failures can be estimated as B = sqrt(\u0394) \u00d7 \u03c3 \u00d7 z*(\u03b5\u0394/2), where \u0394 is the interval between Desk operations, \u03c3 is the standard deviation of TGA changes over that period, and \u03b5 governs acceptable fault probability; for a 2-week interval with \u03c3\u2248$100bn and 1% annualized fault probability, the formula implies a buffer of ~$150-250bn \u2014 below which TGA volatility can trigger a September 2019-style reserve shortage. [LLM]"}, {"x": 15.386168479919434, "y": 24.006044387817383, "z": -1.1245366334915161, "id": "boj_qe_duration_extraction_household_wealth_transfer_001", "title": "BoJ QE Duration Extraction Household Wealth Transfer", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "BoJ QE systematically extracted duration from the private sector by swapping long-duration JGBs for near-zero-duration reserves, leaving Japanese households holding predominantly bank deposits (near-zero duration) while the government held long-duration assets; when interest rates fell, equity-holding government and wealthy households captured the capital gains, while deposit-holding middle-class households received nothing \u2014 creating a structural wealth transfer from households to the consolidated public sector and from young/unsophisticated to old/wealthy. [LLM]"}, {"x": 4.521718502044678, "y": 6.390966415405273, "z": 6.597454071044922, "id": "lcr_nsfr_long_term_lending_penalty_001", "title": "LCR NSFR Long-Term Lending Penalty", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "LCR forces banks to hold HQLA equal to 30-day stressed net outflows (including assumed drawdowns on corporate credit lines), while NSFR requires stable funding \u226585% of notional for loans with residual maturity \u22651 year. [LLM] Together these two rules create a structural funding cost penalty that makes long-duration corporate and specialized lending uneconomical relative to short-term or HQLA assets \u2014 amplifying the capital-cost pressure from RWA and Output Floor to produce the bank retreat from corporate credit.\n"}, {"x": -2.5116190910339355, "y": 6.440069675445557, "z": 0.3466836214065552, "id": "imf_real_interest_rate_fisher_equation_portfolio_choice_001", "title": "IMF Real Interest Rate \u2014 Fisher Equation And Portfolio Choice", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fisher equation decomposes the nominal interest rate into a real rate plus expected inflation: Rr \u2248 Rn \u2212 P\u1d49 (approximate) or Rr = (Rn \u2212 P\u1d49)/(1 + P\u1d49) (exact). Portfolio choice theory classifies assets into four types (money, bonds/credit instruments, equities, real assets), with demand driven by expected return, riskiness, and liquidity. In high-inflation environments where real returns on financial assets are negative, rational agents substitute away from money and domestic bonds toward real assets or foreign currency \u2014 the mechanism behind dollarization and financial repression.\n"}, {"x": 4.421817302703857, "y": 2.488886833190918, "z": 8.36890983581543, "id": "bank_credit_line_private_credit_funds_systemic_channel_001", "title": "Bank Credit Line Private Credit Funds Systemic Channel", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "US GSIB credit lines to private debt funds and BDCs rose ~145% over five years to ~$95bn by Q4 2024, with ~60% concentrated among five GSIBs; if private credit vehicles draw lines defensively during stress while banks simultaneously tighten, liquidity becomes a correlated problem \u2014 OFR estimates total bank and nonbank exposure to private credit at $410-540bn via debt financing plus $300bn in LP commitments, establishing a plausible systemic transmission route from private credit stress to the banking system. [LLM]"}, {"x": 7.080096244812012, "y": -14.56933307647705, "z": 3.0572032928466797, "id": "mp_collateral_channel_001", "title": "Monetary Policy Transmission via Collateral and Repo Markets", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Repo rates \u2014 which reflect collateral availability and quality \u2014 guide the policy rate more directly than unsecured interbank rates. QE, by removing high-quality collateral from circulation and replacing it with reserves, suppresses collateral velocity and may impair monetary transmission: large CB footprint in collateral markets weakens the market signals that normally guide policy.\n"}, {"x": 13.396798133850098, "y": -1.5591398477554321, "z": -3.470745325088501, "id": "interest_rate_corridor_floor_system_standing_facilities_001", "title": "Interest Rate Corridor Floor System Standing Facilities", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The interest rate corridor brackets overnight interbank rates between a CB lending facility (ceiling) and deposit facility (floor). In normal times, OMOs keep rates near the midpoint; in excess-reserve environments (post-QE), the system degenerates into a floor system where the overnight rate equals the deposit facility rate and is controlled via that rate, not reserve quantity."}, {"x": 4.343358516693115, "y": 1.399027705192566, "z": 8.894294738769531, "id": "private_credit_pik_and_hidden_leverage_mechanisms_001", "title": "Private Credit PIK and Hidden Leverage Mechanisms", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Private credit funds employ two hidden leverage mechanisms: (1) Payment-in-Kind (PIK), which allows borrowers to defer cash interest by accruing more principal \u2014 keeping defaults optically low while leverage rises; and (2) subscription facilities (secured against unfunded LP commitments) and NAV lending (borrowing against fund portfolio value) \u2014 both instruments create a structure where a \"hold-to-maturity, illiquid loan book\" is paired with financing whose availability is contingent on lender confidence and collateral valuation. [LLM]"}, {"x": 4.963622570037842, "y": 7.236218452453613, "z": 7.802510738372803, "id": "slr_relief_valve_limited_efficacy_001", "title": "SLR Relief Valve Limited Efficacy For UST Demand", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "A partial SLR (Supplementary Leverage Ratio) reduction is a \"faulty relief valve\" for UST market liquidity because most large banks are bound by risk-based capital requirements, not SLR \u2014 so freeing SLR headroom does not incentivize additional UST purchases when banks fund those purchases with reserves (also 0% RWA), and only the most leverage-constrained banks see any benefit."}, {"x": 15.900066375732422, "y": 2.413304328918457, "z": 12.164753913879395, "id": "fed_global_jaws_frp_fima_001", "title": "Fed Global Jaws FRP FIMA Public Dollar Architecture", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed has assembled a four-layer \"global jaws\" architecture to control dollar rates for all market participants, operating as a \"range floor system\" (or \"soft floor\") rather than a single fixed rate. This architecture consists of: (1) private floor = ON RRP (banks/MMFs/GSEs), (2) public floor = Foreign Repo Pool/FRP (foreign official institutions), (3) private ceiling = Fed swap lines (allied central banks), and (4) public ceiling = FIMA repo facility (all foreign official institutions). The system ensures that both private and public dollar rates (unsecured and secured) evolve within a narrow range (typically 10-15 basis points), preventing forced asset firesales by foreign governments while structurally reinforcing dollar hegemony.\n"}, {"x": -5.628459453582764, "y": -19.475563049316406, "z": -8.362602233886719, "id": "irs_ois_fixed_floating_001", "title": "Interest Rate Swaps \u2014 OIS, Fixed-for-Floating, Clearing, and Basis", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Interest rate swaps exchange fixed for floating interest payments on a notional amount. OIS (overnight index swaps, e.g., SOFR swaps) are near-riskless; fixed-for-floating swaps (e.g., Euribor) carry a basis vs. the risk-free rate. Market notionals ($210T) vastly overstate risk \u2014 ENNs (entity-netted notionals) of $16T are comparable to other fixed income markets. Swaps DV01 is entirely on the fixed leg; clearing via CCPs concentrates but does not eliminate counterparty risk; the default waterfall (IM \u2192 default fund \u2192 CCP skin \u2192 member assessments \u2192 VM haircutting) is the last line of defense.\n"}, {"x": 19.24555778503418, "y": 5.213984966278076, "z": 16.862112045288086, "id": "treasury_qe_duration_rrp_drain_001", "title": "Treasury QE Duration Swap And RRP Drain Mechanisms", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "Treasury buybacks can function as \"Treasury QE\" via two distinct mechanisms \u2014 (1) duration-reducing swap (buy long-dated bonds, re-issue short-dated), which removes duration risk from private hands and stimulates risk assets if announced explicitly; and (2) RRP-drain QE (MMF withdraws from RRP to buy new Treasury bills which fund the buyback), which involuntarily boosts net liquidity without Fed balance sheet expansion."}, {"x": 8.764074325561523, "y": -18.77565574645996, "z": -2.753659248352051, "id": "ubr_hedge_fund_leverage_systemic_001", "title": "Uncleared Bilateral Repo UBR Hedge Fund Leverage Systemic Risk", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Uncleared bilateral repo (UBR) is the most opaque segment of the U.S. repo market \u2014 where hedge funds borrow at 50:1+ leverage from dealer counterparties without central clearing or custody \u2014 executing basis trades and relative-value strategies; its $2T+ in outstanding transactions remained invisible to regulators until 2023, echoing the LTCM precedent (1998) where uncleared repo counterparty exposures nearly triggered a systemic meltdown."}, {"x": 6.442846298217773, "y": 0.2505459487438202, "z": 7.426199436187744, "id": "private_credit_reflexive_loop_001", "title": "Private Credit Reflexive Loop", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "[LLM] Low policy rates induce institutional search for yield \u2192 capital floods into private credit \u2192 manager pressure to deploy creates covenant deterioration and leverage creep \u2192 PIK masks emerging stress \u2192 delayed loss recognition. When the regime flips (sustained high rates or redemption surge), the loop reverses: semi-liquid fund redemption caps are hit \u2192 bank revolving lines drawn defensively \u2192 NAV margin calls \u2192 valuation reset forces loss recognition simultaneously, producing a cliff rather than a gradual correction.\n"}, {"x": 19.147584915161133, "y": 10.17883014678955, "z": 22.939014434814453, "id": "tga_reserve_inverse_relationship_fed_balance_sheet_growth_001", "title": "TGA Reserve Inverse Relationship Fed Balance Sheet Growth", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Every Treasury transaction with the private sector mechanically produces dTGA = -dReserves (a zero-sum liability swap on the Fed balance sheet); however, when TGA changes are large and persistent, the Fed must expand assets to maintain ample reserves \u2014 so over time dTGA = dAssets, and both an increase in the LEVEL and VOLATILITY of the TGA directly force a larger Fed balance sheet. [LLM]"}, {"x": 15.807221412658691, "y": 12.387359619140625, "z": 11.649468421936035, "id": "reserve_floor_payment_001", "title": "Reserve Floor \u2014 Payment System Demand and the Minimum Ample Level", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The minimum level of reserve balances (\"reserve floor\") that the Fed must supply is driven primarily by the demand of the payment system, not by monetary policy alone. RTGS (real-time gross settlement) requires banks to pre-fund large opening-of-day reserve balances; post-GFC liquidity regulations stigmatize intraday overdrafts; and IORB remuneration removes incentives to lend excess reserves. These three structural changes raised the minimum from ~$10B pre-GFC to ~$3T, creating a ratchet effect. When reserves fall below the ample floor, payment delays beget repo rate spikes (September 2019 being the canonical example). Policy options to lower the floor include liquidity savings mechanisms (LSMs), tiered IORB, revised LCR/daylight overdraft rules, and TOMOs.\n"}, {"x": -15.704092979431152, "y": 6.864643573760986, "z": 5.033714294433594, "id": "bond_accrual_price_effect_interaction_001", "title": "Bond Accrual Price Effect Interaction", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Over a multi-period horizon, a bond portfolio's coupon accruals (reinvestment income) accumulate roughly as the square of the horizon while price effects are linear \u2014 meaning accruals dominate price effects at long horizons, and this asymmetry is the engine behind DT convergence."}, {"x": -5.554545879364014, "y": -19.605283737182617, "z": 1.8797287940979004, "id": "swap_spreads_001", "title": "Swap Spreads \u2014 Drivers, Balance Sheet Frictions, and Plumbing Indicators", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Swap spreads \u2014 the difference between bond yield and the swap rate of equivalent maturity \u2014 decompose into: SOFR-ASW = repo-SOFR basis swap + adjusted CDS (credit risk). Negative swap spreads (Treasury yield > SOFR swap rate) signal dealer balance sheet constraints: when banks face binding SLR/LCR constraints, their ability to intermediate arbitrage between bonds and swaps is impaired, causing the spread to persist at values inconsistent with no-arbitrage. Shadow costs of regulatory constraints \u2014 not visible in funding rates \u2014 are a primary structural driver of Treasury swap spreads in the post-Basel III era. Swap spreads are therefore a measure of plumbing friction and dealer balance sheet stress.\n"}, {"x": 14.153043746948242, "y": 15.878134727478027, "z": 6.224143028259277, "id": "china_lpr_mlf_decoupling_2024_001", "title": "China LPR MLF Decoupling 2024 Reform Rationale", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The PBC decoupled LPR from the MLF rate in July 2024 because the MLF was centrally set at a fixed rate via quantity bidding (not market-formed), making LPR an administered price rather than a genuine market rate; the reform linked LPR to the 7-day OMO reverse repo rate so that a single short-term policy rate could transmit simultaneously to the credit market (via LPR) and the bond market (via yield curve), converging toward mainstream central bank frameworks."}, {"x": 10.615537643432617, "y": 2.8185737133026123, "z": 6.887650966644287, "id": "ptf_treasury_market_making_001", "title": "PTF Principal Trading Firms Treasury Market Making", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Post-Basel III, Principal Trading Firms (PTFs) using HFT strategies on electronic platforms displaced large G-SIB banks as the dominant Treasury market makers \u2014 because PTFs are not subject to G-SIB capital constraints and can intermediate large volumes without the regulatory penalty that caused banks like JPMorgan to exit tri-party repo, creating a faster but more opaque and fragile market-making ecosystem."}, {"x": 19.129796981811523, "y": 10.490303993225098, "z": 15.080575942993164, "id": "warsh_reserve_floor_and_structural_demand_constraint_mec_001", "title": "Warsh Reserve Floor And Structural Demand Constraint", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Warsh's balance-sheet shrinking program runs into a reserve-floor constraint: the Fed cannot reduce reserves below the system's structural demand without causing money-market dislocations. This makes the question not whether the balance sheet can be smaller, but how far it can shrink before SOFR and related rates lose their stable floor.\n"}, {"x": 20.642196655273438, "y": 1.1718374490737915, "z": 13.82927131652832, "id": "japan_filp_to_qe_structural_succession_001", "title": "Japan FILP to QE Structural Succession", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Japan QE reserve creation (2010-) structurally succeeded the Fiscal Investment and Loan Programme (FILP) as the sovereign mechanism for below-market funding: both channel domestic private savings into public sector use at sub-market rates, differing only in instrument. The 2001 postal reform that dismantled FILP funding base made QE the market-friendly successor."}, {"x": 13.849099159240723, "y": 23.117860794067383, "z": -0.7434529066085815, "id": "private_credit_dual_driver_low_rates_and_bank_regulation_001", "title": "Private Credit Dual Driver Low Rates and Bank Regulation", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "Private credit growth is driven by two simultaneous forces: (1) ultra-low policy rates compressed public fixed-income yields, forcing allocators to accept illiquidity for yield (search-for-yield channel); and (2) Basel III raised the shadow price of bank balance sheet for leveraged/sub-investment-grade lending, making private credit economically competitive \u2014 BIS analysis shows convergence of BDCs and banks weighted average cost of capital as the structural enabler of scale. [LLM]"}, {"x": 5.418722629547119, "y": 4.7009687423706055, "z": 6.322651386260986, "id": "private_credit_srt_001", "title": "Private Credit \u2014 SRT, NAV Loans, and Bank-PC Interconnection", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Banks respond to Basel III capital and liquidity constraints through three structural mechanisms: (1) SRT \u2014 transferring first-loss credit risk from the balance sheet to PC fund investors for regulatory capital relief; (2) originate-to-distribute \u2014 converting from spread income to fee income while retaining origination relationships; (3) providing leverage to PC funds via subscription lines and NAV loans. These mechanisms do not eliminate bank credit exposure \u2014 they reconfigure it from direct lending to indirect exposure to PC fund leverage. The systemic implication is correlated drawdown risk: in stress, PC funds simultaneously tap bank credit lines, creating a network liquidity event invisible to standard bank stress tests.\n"}, {"x": 15.273200988769531, "y": 21.70846176147461, "z": 0.5985769033432007, "id": "ecb_qt_sovereign_yield_volatility_amplification_001", "title": "ECB QT Sovereign Yield Volatility Amplification", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The ECB quantitative tightening cycle has structurally increased realized volatility of European sovereign yields by removing the most price-insensitive buyer from the market; events like the March 2025 single-day 30bp Bund move (largest since 1990) demonstrate that without the ECB backstop, idiosyncratic fiscal news can trigger dislocations that would previously have been absorbed by central bank intervention. [LLM]"}, {"x": 15.329021453857422, "y": 2.17714786529541, "z": 12.849114418029785, "id": "fed_dollar_swap_lines_crisis_hierarchy_and_swapper_of_last_resort_mec_001", "title": "Fed Dollar Swap Lines Crisis Hierarchy and Swapper of Last Resort", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Federal Reserve acts as the global \"Swapper of Last Resort\" by providing unlimited USD liquidity to foreign central banks through swap lines; this mechanism prevents offshore dollar shortages from triggering forced sales of US Treasuries and serves as the ultimate backstop in the global dollar funding hierarchy.\n"}, {"x": 15.273200035095215, "y": 21.708463668823242, "z": 0.5985766053199768, "id": "nbfi_sovereign_bond_absorption_post_ecb_qt_001", "title": "NBFI Sovereign Bond Absorption Post-ECB-QT", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "As the ECB systematically withdraws under quantitative tightening, non-bank financial intermediaries (investment funds, insurance companies, pension funds) have absorbed the majority of European sovereign bond supply, but these buyers are structurally less stable than the central bank: they are leverage-sensitive, redemption-prone, and pro-cyclical, making periodic dislocation events structurally more likely. [LLM]"}, {"x": 27.02263832092285, "y": 3.0209593772888184, "z": 0.9758680462837219, "id": "cost_push_inflation_persistence_mec_001", "title": "Cost Push Inflation Persistence Mechanism", "source": "wiki", "domain": "macro_outlook", "type": "concept", "thesis": "Cost-push inflation becomes persistent when a relative-price shock, wage shock, or productivity-cost mismatch is accommodated by monetary policy or embedded in contracts and expectations.\n"}, {"x": 13.513208389282227, "y": 3.257089376449585, "z": 9.15872573852539, "id": "asian_dollar_market_acu_structure_sibor_001", "title": "Asian Dollar Market ACU Structure And SIBOR Mechanics", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Asian Dollar Market was a regional eurodollar system in which ACU (Asian Currency Unit) banks in Singapore issued SIBOR-linked dollar liabilities (CDs, time deposits, bonds) to offshore dollar holders, on-lent to regional borrowers at SIBOR+spread, and settled all dollar transfers through US correspondent accounts \u2014 a structure that thrived on Singapore's regulatory arbitrage before being structurally gutted by post-GFC reforms targeting unsecured lending."}, {"x": -15.473787307739258, "y": -22.694408416748047, "z": -3.110659599304199, "id": "swap_carry_and_roll_down_analysis_001", "title": "Swap Carry And Roll Down Analysis", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "For any interest rate swap held over a horizon period, the total P&L from inaction decomposes into (1) carry \u2014 net interest earned while holding the trade \u2014 and (2) roll-down \u2014 the mark-to-market gain from the swap aging on an unchanged curve; together these define the break-even rate move required to lose money on the position."}, {"x": 6.863725662231445, "y": -1.9818263053894043, "z": 9.461545944213867, "id": "private_credit_secondary_market_price_discovery_001", "title": "Private Credit Secondary Market Price Discovery", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "Private credit secondary markets are transforming from LP convenience into a price discovery mechanism that challenges reported NAVs: growing from bn (2023) to 8bn+ (2025), secondaries price at observable discounts (avg 90-92% of NAV) that serve as external benchmarks, progressively undermining the pure mark-to-model valuation regime and creating feedback loops between secondary pricing, redemption behavior, and fundraising."}, {"x": 4.604708194732666, "y": 0.9623004794120789, "z": 7.442719459533691, "id": "private_credit_subscription_nav_lending_hidden_leverage_001", "title": "Private Credit Subscription NAV Lending Hidden Leverage", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "Subscription credit facilities (secured by LP commitments) and NAV loans (secured by fund investment values) constitute a hidden leverage layer in private credit not visible in standard portfolio metrics; OFR estimates $410-540bn in bank credit extended to private credit vehicles, concentrated 60% among 5 GSIBs, creating a plausible correlated liquidity transmission route where PC fund stress and bank credit tightening reinforce each other."}, {"x": 4.784924507141113, "y": -13.375470161437988, "z": 2.1258442401885986, "id": "mechanism_collateral_transformation_001", "title": "Collateral Transformation Chain", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Collateral transformation is the process by which lower-quality or less-liquid assets are exchanged for higher-quality or more-liquid collateral (typically Treasuries or agency MBS) through a chain of repo and securities lending transactions. Each step in the chain allows the transformed collateral to satisfy higher-standard requirements (CCP initial margin, LCR HQLA, cleared derivative posting) \u2014 but also extends the chain length and amplifies systemic liquidity risk if one link breaks.\n"}, {"x": 13.401333808898926, "y": 21.332916259765625, "z": 0.6185129284858704, "id": "fed_range_floor_on_rrp_non_bank_access_constraint_001", "title": "Fed Range Floor ON RRP Non-Bank Access Constraint", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed operates a \"range floor\" rather than a pure floor because non-bank institutions (money market funds, GSEs) participate in the FFR market but cannot earn IORB \u2014 instead accessing the ON RRP facility at a rate below IORB, creating a dual-floor structure where IORB anchors the upper bound for bank-mediated rates and ON RRP anchors the lower bound for non-bank entities, producing a 10-15bp FFR range rather than convergence to a single rate. [LLM]"}, {"x": 11.98928165435791, "y": 22.174734115600586, "z": -1.2730491161346436, "id": "pbc_structural_monetary_policy_targeted_relending_001", "title": "PBC Structural Monetary Policy Targeted Relending", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The PBC's structural monetary policy tools \u2014 relending and rediscount facilities \u2014 provide below-market-rate funding to commercial banks that direct credit to PBC-designated priority sectors (agriculture, small enterprises, green energy); this is a form of directed credit allocation that operates alongside market-based monetary policy, blurring the boundary between monetary and industrial policy. [LLM]"}, {"x": 26.631080627441406, "y": 3.3384571075439453, "z": 4.00655460357666, "id": "volcker_disinflation_sacrifice_ratio_channel_mec_001", "title": "Volcker Disinflation Sacrifice Ratio Channel", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Volcker-style disinflation works through a costly slack channel: tighter policy raises unemployment and reduces output to break inflation persistence, with the sacrifice ratio measuring the output loss per unit of disinflation.\n"}, {"x": 14.656588554382324, "y": 11.283196449279785, "z": 10.335406303405762, "id": "standing_repo_facility_srf_mec_001", "title": "Standing Repo Facility (SRF) Fed Backstop", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Standing Repo Facility (SRF) is the Federal Reserve's \"upper jaw\" in its interest rate corridor, designed to cap secured overnight rates (SOFR) and serve as a \"dealer of last resort\" for primary dealers and banks during liquidity stress.\n"}, {"x": 5.126520156860352, "y": 0.9835764765739441, "z": 7.119368076324463, "id": "bank_nbfi_leverage_loop_001", "title": "Bank NBFI Leverage Loop", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Subscription credit facilities (secured by LP capital call rights) and NAV loans (secured by portfolio cash flows via SPV) allow private credit funds to borrow from regulated banks, creating a hidden leverage layer that (1) artificially inflates reported IRR by delaying LP capital calls, and (2) links PC fund solvency to bank willingness to roll short-term financing. [LLM] In stress, simultaneous drawdown of these facilities creates a correlated liquidity demand on banks \u2014 the inverse of the intended \"risk transfer\" rationale of Basel regulation.\n"}, {"x": 27.080942153930664, "y": 5.838517665863037, "z": 0.9363751411437988, "id": "nonlinear_inflation_amplifiers_mec_001", "title": "Non-Linear Inflation Amplifier Mechanics", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Inflation propagation in response to supply shocks occurs through two distinct amplifiers: the structural amplifier (automatic input-output cascades through production networks) and the behavioral amplifier (changes in wage- and price-setting behavior driven by expectations). [LLM]\n"}, {"x": 15.025640487670898, "y": -10.934831619262695, "z": 5.689105987548828, "id": "imf_money_multiplier_decomposition_001", "title": "Money Multiplier \u2014 Ratio Decomposition and Three-Agent Determination", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The money multiplier links reserve money (monetary base) to broad money (M2) through the behavioral choices of three agents: the monetary authority (reserve requirements), commercial banks (excess reserve ratio), and the public (currency and time deposit ratios). The simple multiplier mm=(1+c)/(c+r) extends to a full decomposition across deposit types and reserve categories: mm=(1+c+b)/ (c+rd+rt\u00b7b+re\u00b7(1+b)). Rising c (currency flight) or re (precautionary excess reserves) compresses the multiplier, as do financial innovation (shifts deposits to non-bank instruments) and currency substitution (FX deposits exit the multiplier chain).\n"}, {"x": 6.504921913146973, "y": -13.67369270324707, "z": 2.2209818363189697, "id": "qe_collateral_velocity_monetary_policy_001", "title": "QE Collateral Velocity And Monetary Policy Transmission", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "QE is a 'coiled spring' for collateral markets: by absorbing high-quality collateral (HQC) onto central bank balance sheets, it suppresses collateral velocity and financial lubrication. This 'siloing' effect creates collateral scarcity, driving repo rates down (often below the CB's floor). The subsequent withdrawal (QT) or 'Not-QE' interventions (like RMOs or BTFP) must manage the dual tension of releasing collateral back to the market while maintaining rate control, a process that can trigger a 'Scissors Effect' where rising supply meets falling CB support."}, {"x": 20.43457794189453, "y": 8.33464527130127, "z": 16.68486976623535, "id": "fed_rmo_reserve_management_operations_001", "title": "Fed RMO Reserve Management Operations Post QT Mechanics", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Reserve Management Operations (RMOs), formally implemented as \"Reserve Management Purchases\" (RMPs) in late 2025, are the Fed's tool for maintaining an ample supply of reserves post-QT through outright purchases of short-term Treasury securities (bills). Triggered by money market stress (SOFR-IORB spreads > 30bps), RMOs are operationally distinct from Quantitative Easing (QE); while QE aims to extract duration risk for stimulus, RMOs purely offset structural reserve drains (currency growth, TGA accumulation) to ensure effective control of the policy rate. On December 10, 2025, the Fed initiated RMPs at a rate of ~$40 billion per month following a sharp spike in repo rates.\n"}, {"x": 5.116228103637695, "y": -0.4035889208316803, "z": 8.412162780761719, "id": "pik_payment_in_kind_credit_masking_001", "title": "PIK Payment In Kind Credit Stress Masking", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "PIK (Payment-in-Kind) allows borrowers to defer cash interest by accruing additional principal, keeping reported default rates optically low while true leverage rises. [LLM] Rising PIK share in BDCs is a leading indicator of unrealized credit stress; in a stress scenario, deferred losses and compounding principal concentrate into a simultaneous default spike rather than the gradual deterioration that cash-pay covenant structures would produce.\n"}, {"x": 18.326974868774414, "y": 5.650402069091797, "z": 16.790977478027344, "id": "tga_target_creep_bill_issuance_001", "title": "TGA Target Creep Bill Issuance And Reserve Neutralization", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "As Treasury shifts debt issuance toward shorter-maturity bills, the frequency of maturities and redemptions rises, requiring a larger cash buffer in the TGA \u2014 structurally pushing Treasury to ratchet up its TGA target (e.g. $850B \u2192 $900B+), which permanently neutralizes additional reserves in the government's account and must be offset by Fed RMOs."}, {"x": 13.070188522338867, "y": 20.950218200683594, "z": 0.9947237372398376, "id": "ecb_new_operational_framework_range_floor_2024_001", "title": "ECB New Operational Framework Range Floor 2024", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The ECB's 2024 operational framework establishes a \"range floor\" with a 15bp spread between the Deposit Facility Rate (DFR, the effective floor) and the MRO rate: excess reserves keep \u20acSTR close to the DFR, while the MRO-DFR corridor provides a volatility buffer for episodes of reserve scarcity \u2014 retaining the floor system's advantages (reliable rate control, balance sheet as a separate policy instrument) without requiring a permanently large balance sheet. [LLM]"}, {"x": 11.17603874206543, "y": -3.8197662830352783, "z": 0.7731115221977234, "id": "central_bank_intermediation_balance_sheet_autonomous_factors_001", "title": "Central Bank Intermediation Balance Sheet Autonomous Factors", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Central bank intermediation describes the CB acting as interbank market substitute when direct bank-to-bank lending breaks down. Relative intermediation (no balance sheet expansion) can occur with partial interbank stress; absolute intermediation (balance sheet expansion) occurs in full market breakdown. Autonomous factors \u2014 banknotes, government deposits, foreign assets \u2014 continuously perturb system reserves and must be offset by OMOs."}, {"x": 4.406892776489258, "y": -7.6697516441345215, "z": -22.155576705932617, "id": "fx_settlement_risk_cls_ptf_001", "title": "FX Settlement Risk, CLS, and PTF Market Structure Evolution", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "FX settlement risk \u2014 the risk one party delivers currency but the counterparty fails to deliver (Herstatt risk, 1974) \u2014 was structurally mitigated by CLS Group (2002) via payment-vs-payment (PvP) settlement. Simultaneously, the FX dealer oligopoly eroded: from voice brokers \u2192 EBS/Reuters (1992) \u2192 single-bank platforms (2001) \u2192 multi-dealer ECNs \u2192 algo trading (2004) \u2192 principal trading firms (PTFs) like Jump Trading and XTX Markets entering the interdealer market post-GFC, displacing bank proprietary desks constrained by regulation.\n"}, {"x": -16.32910919189453, "y": 8.60399055480957, "z": 3.73376202583313, "id": "duration_targeting_convergence_and_yield_trap_001", "title": "Duration Targeting Convergence And Yield Trap", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "At the 'effective maturity' horizon (\u2248 2\u00d7 duration target), cumulative accrual gains and cumulative price effects exactly offset each other regardless of yield direction, creating a convergence to initial yield \u2014 and trapping the investor in the yield environment at portfolio inception."}, {"x": 14.23432731628418, "y": 25.014570236206055, "z": 0.3770246207714081, "id": "fx_swap_basis_cip_deviation_dollar_scarcity_001", "title": "FX Swap Basis CIP Deviation Dollar Scarcity", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "The cross-currency basis (deviation from covered interest parity) reflects balance-sheet constraints that prevent arbitrage between currency markets; when global dollar demand surges and dealer intermediation capacity is constrained, the basis widens negative for foreign currencies against USD, signalling systemic dollar scarcity \u2014 the mechanism that activates demand for Fed swap line facilities during crises. [LLM]"}, {"x": 20.63052749633789, "y": 0.7113069295883179, "z": 16.08164405822754, "id": "financial_repression_distributional_welfare_effects_001", "title": "Financial Repression Distributional Welfare Effects", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Financial repression via QE and low-rate policy generates systematically regressive distributional effects: deposit-heavy non-participants (67% of Japanese households, skewed toward young and low-income) bear welfare losses of 6-9% of wealth per 100bps rate decline because their asset duration cannot match their consumption duration, while equity-holding participants (older, wealthier) gain 17-25%, producing intergenerational wealth transfers from depositors to the sovereign and asset owners."}, {"x": 17.948949813842773, "y": -7.7343597412109375, "z": -8.247995376586914, "id": "cb_quasi_fiscal_sterilization_seigniorage_001", "title": "CB Quasi-Fiscal Mechanism \u2014 Sterilization Costs, Seigniorage, and the Fiscal-Monetary Nexus", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The FX rate target creates a quasi-fiscal channel that runs in both directions: (1) the normal seigniorage channel transfers CB profits to government as nontax revenue when CB issues non-interest-bearing liabilities and earns on backing assets; (2) sterilization of inflows inverts this channel \u2014 CB earns low-yield FX assets while paying high-yield domestic assets, converting seigniorage transfers into calls on the government budget; (3) NCG expansion to accommodate fiscal deficits looks neutral in the monetary survey but functions as de facto deficit monetization, masking fiscal imbalances until NFA depletion forces adjustment; (4) fiscal dominance \u2014 where government pressure prevents policy correction \u2014 is the endpoint of sustained NCG accommodation combined with FX target defense. The IMF GFS framework classifies CB sterilization losses, subsidized lending, and FX guarantees as quasi-fiscal operations that must be added to the conventional fiscal deficit to measure the true policy stance.\n"}, {"x": 4.904033660888672, "y": -14.272737503051758, "z": 1.5312410593032837, "id": "collateral_velocity_001", "title": "Collateral Velocity and Rehypothecation", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Collateral velocity measures how many times a given piece of collateral is reused (pledged and re-pledged) within the financial system. Pre-Lehman, the pledged-collateral market reached ~$10 trillion \u2014 comparable to M2 \u2014 and collapsed to ~$5 trillion in 2008-9 as reuse chains broke. High velocity amplifies credit creation; restricted velocity (via QE or regulation) impairs financial intermediation analogously to a drying-up of interbank markets.\n"}, {"x": 12.50935173034668, "y": 21.22515869140625, "z": -1.1103627681732178, "id": "pbc_reserve_requirement_ratio_liquidity_management_001", "title": "PBC Reserve Requirement Ratio Liquidity Management", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The PBC uses the reserve requirement ratio (RRR) primarily as a liquidity management tool to sterilize foreign exchange reserve flows and adjust monetary base conditions \u2014 not for financial stability purposes as in most advanced economies; RRR changes carry strong signalling power for monetary policy stance and are typically correlated with concurrent changes in price-based instruments. [LLM]"}, {"x": 19.725358963012695, "y": 10.069334030151367, "z": 21.003551483154297, "id": "tga_volatility_and_reserve_buffer_demand_mec_001", "title": "TGA Volatility And Reserve Buffer Demand", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Treasury General Account affects Fed rate control not only through its level but through its volatility. When Treasury cash balances swing sharply, the Fed must carry a larger reserve buffer to prevent sudden reserve scarcity or excess from pushing overnight rates out of its desired operating range.\n"}, {"x": 16.586959838867188, "y": 8.038751602172852, "z": 9.684269905090332, "id": "fhlb_foreign_bank_iorb_arbitrage_001", "title": "FHLB Foreign Bank EFFR IORB Arbitrage Fed Funds Market", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The U.S. Fed Funds market is now sustained almost entirely by a single arbitrage trade \u2014 Federal Home Loan Banks (FHLBs), which cannot earn IORB on reserves, lend reserves to foreign bank branches at EFFR; those foreign banks (exempt from U.S. regulatory costs) deposit the reserves at the Fed and earn the IORB-EFFR spread (~5-10bps), representing the last meaningful unsecured interbank lending activity in the post-Basel III system."}, {"x": 12.42488956451416, "y": 23.80921173095703, "z": 0.6673957109451294, "id": "uk_inflation_persistence_structural_drivers_001", "title": "UK Inflation Persistence Structural Drivers", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "UK inflation is structurally stickier than US inflation due to: (1) energy market structure transmitting price shocks more fully into electricity/gas prices; (2) full pass-through of energy shocks into minimum wage indexation and welfare benefits; and (3) Bank of England credibility gap that leaves inflation expectations less well-anchored \u2014 collectively explaining why UK breakeven inflation moves more sharply than US counterparts in response to global price shocks. [LLM]"}, {"x": 10.910200119018555, "y": 1.739728569984436, "z": 16.331218719482422, "id": "treasury_buybacks_sovereign_debt_001", "title": "Treasury Buybacks Sovereign Debt Liquidity Intervention", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "When Treasury market illiquidity escalates, the U.S. Treasury's first-line intervention (before full YCC) is secondary-market buybacks \u2014 repurchasing off-the-run bonds via primary dealers to compress the illiquidity premium, reduce interest expense, and break the illiquidity spiral (volatility \u2192 illiquidity \u2192 more volatility doom loop) without requiring Fed balance sheet expansion."}, {"x": 19.271888732910156, "y": -10.045364379882812, "z": -8.24677562713623, "id": "imf_monetary_survey_valuation_adjustment_001", "title": "IMF Monetary Survey \u2014 Valuation Adjustment and Transaction Flow Decomposition", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Changes in monetary survey stock items (especially NFA) between two periods reflect both actual transaction flows AND valuation effects from exchange rate changes. Box 5.8 of the IMF Macro Accounting framework provides a formal decomposition: the transaction component is converted at the period-average exchange rate, while the valuation adjustment (VAj) captures the revaluation of the opening stock due to exchange rate movement. Failing to separate these components causes \u0394NFA in the monetary survey (local currency) to diverge from \u0394RES in the BOP (foreign currency), invalidating monetary programming targets.\n"}, {"x": 19.8516902923584, "y": 10.438924789428711, "z": 20.62759780883789, "id": "tga_reform_as_fed_balance_sheet_reduction_tool_001", "title": "TGA Reform as Fed Balance Sheet Reduction Tool", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Reducing the level and volatility of the Treasury General Account (TGA) is identified as the most accessible path to shrinking the Fed balance sheet without increasing rate volatility \u2014 because TGA moves drive opposite moves in reserves, so lower TGA volatility reduces the required ample reserves buffer; proposals include moving Treasury cash management to private money markets or capping TGA balances, with side benefits of reducing the Fed's footprint in money markets. [LLM]"}, {"x": 14.79092788696289, "y": 7.119638919830322, "z": 0.09468808770179749, "id": "capital_flow_management_cfm_taxonomy_001", "title": "Capital Flow Management \u2014 Taxonomy, Triggers, and Instruments", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Capital Flow Management (CFM) is a third policy instrument used by EME central banks to manage the impossible trinity when interest rates and FX intervention alone are insufficient. CFM tools range from administrative (taxes, URR, restrictions) to prudential (NOP, LDR, FX loan caps), with IMF 2012 guidance identifying three trigger conditions for deployment. CFM reduces the offset coefficient by directly restricting the volume of inflows that generate sterilization pressure and quasi-fiscal costs. [LLM]\n"}, {"x": 13.236669540405273, "y": 15.139520645141602, "z": 6.025680065155029, "id": "china_lpr_quoting_mechanism_credit_channel_001", "title": "China LPR Quoting Mechanism And Credit Channel Dominance", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The LPR is formed monthly by 20 quoting banks submitting spreads over the OMO (primarily MLF) rate to the National Interbank Funding Center, with the arithmetic mean after excluding outliers published for 1Y and 5Y+ maturities; China's monetary transmission is primarily driven by the credit channel (affecting credit availability) rather than the interest rate channel, and cross-market transmission between the money market (DR007), credit market (LPR), and bond market (Treasury yield) is structurally blocked."}, {"x": 4.837461471557617, "y": 3.3611044883728027, "z": 8.01523208618164, "id": "bank_private_credit_partnership_model_post_basel_001", "title": "Bank Private Credit Partnership Model Post-Basel", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "Rather than simple displacement, banks are increasingly partnering with private credit funds: banks provide back-leverage (repo/credit lines to funds), co-originate loans while selling the risk, or refer deals in exchange for fee income \u2014 retaining customer relationships without the capital charge; this convergence model blurs the boundary between regulated and shadow banking and creates new forms of interconnectedness. [LLM]"}, {"x": 5.223250389099121, "y": 3.6439316272735596, "z": 7.900228023529053, "id": "basel_iii_capital_requirements_private_credit_migration_001", "title": "Basel III Capital Requirements Private Credit Migration", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "Basel III increased CET1 and liquidity requirements force banks to retreat from capital-intensive corporate and leveraged lending; private credit funds \u2014 not subject to equivalent capital requirements \u2014 fill the financing void, a process characterised as regulatory arbitrage that has structurally migrated lending from the regulated banking sector into the shadow banking / NBFI sector. [LLM]"}, {"x": 4.1836676597595215, "y": 1.8061764240264893, "z": 7.800174236297607, "id": "private_credit_systemic_stress_transmission_mechanism_001", "title": "Private Credit Systemic Stress Transmission Mechanism", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Private credit systemic stress transmits through four simultaneous channels: (1) leverage providers face correlated drawdowns on revolving credit lines; (2) LPs face capital calls and commitment strain; (3) NAV loans and subscription facilities become harder to roll or more expensive; (4) confidence in valuations weakens as secondary clearing prices and public proxy prices (BDC NAV discounts) diverge from reported marks \u2014 making \"liquidity event\" and \"valuation event\" synonymous in a market not built for continuous clearing. [LLM]"}, {"x": 6.247596263885498, "y": 6.649942398071289, "z": 5.104410171508789, "id": "basel_output_floor_specialized_lending_001", "title": "Basel Output Floor Specialized Lending Impact", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "The Output Floor (72.5% of SA-RWA, fully phased-in Jan 2027) prevents banks from using internal IRB models to reduce RWA below 72.5% of the Standardised Approach calculation, eliminating the capital optimization advantage that made specialized lending (project finance, CRE, unrated mid-market loans) viable on bank balance sheets \u2014 regardless of actual historical default rates. [LLM] This is the single largest driver of bank retreat from specialized corporate credit, creating the structural gap that private credit fills.\n"}, {"x": 19.47650909423828, "y": 6.90810489654541, "z": 13.882734298706055, "id": "fed_cmo_rmo_distinction_001", "title": "Fed CMO RMO Distinction And Rate Band Management", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed uses two distinct reserve injection tools to maintain the federal funds rate within its target band \u2014 CMOs (Ceiling Management Operations) are emergency interventions that push market rates away from the SRF ceiling, while RMOs (Reserve Management Operations) are routine outright bill purchases that maintain ample reserves over time \u2014 with CMOs typically preceding RMOs when rates breach the upper limit of the target band."}, {"x": 17.583738327026367, "y": 10.506549835205078, "z": 13.049659729003906, "id": "fed_bs_floor_payment_system_001", "title": "Fed Balance Sheet Floor Payment System Reserve Demand", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The U.S. payment system (Fedwire ~$7.3T/day) creates a structural floor on the size of the Fed's balance sheet: large banks (GSIBs) are unwilling to use Fed liquidity facilities (daylight overdrafts, Discount Window, Standing Repo) due to regulatory stigma and post-GFC liquidity regulation self-sufficiency requirements, so they pre-load opening reserve balances instead; when QT reduces reserves below this floor, banks throttle outgoing payments, creating a self-fulfilling liquidity crunch with repo rates spiking far above IORB \u2014 as on September 17, 2019, when SOFR spiked 315bps above IORB."}, {"x": 18.08665657043457, "y": 7.803243637084961, "z": 14.080870628356934, "id": "global_compression_rv_gse_xccy_001", "title": "Global Compression RV Fund GSE MBS And XCCY Basis Frontier", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Three forces extend the Fed's RMO requirement beyond initial estimates \u2014 Big Six banks front-running rate cuts by swapping reserves for USTs (structural reserve drain), GSE mandated MBS purchases (~$200B) funded via agency debt creating upward overnight rate pressure, and RV fund basis trade persistence driving structural repo demand \u2014 with XCCY basis emerging as the next battleground when onshore USD funding normalizes."}, {"x": 5.8142805099487305, "y": 7.8650336265563965, "z": 6.426113605499268, "id": "slr_lcr_balance_sheet_constraints_treasury_market_dealer_001", "title": "SLR LCR Balance Sheet Constraints Treasury Market Dealer", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Post-GFC Basel III regulations \u2014 especially the Supplementary Leverage Ratio (SLR) and Liquidity Coverage Ratio (LCR) \u2014 constrain primary dealer balance sheets, reducing their capacity to absorb Treasury supply during periods of elevated issuance or volatility. The resulting illiquidity spiral (volatility -> wider spreads -> forced selling -> more volatility) creates systemic risk in the world's largest bond market."}, {"x": 5.752315998077393, "y": -5.578396797180176, "z": -0.988709032535553, "id": "collateral_framework_haircuts_central_bank_credit_001", "title": "Collateral Framework Haircuts Central Bank Credit", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Central bank collateral frameworks define eligible assets, haircuts, and concentration limits for CB credit operations. Haircuts serve as the primary risk buffer and function as a secondary monetary policy instrument: tighter haircuts raise effective funding costs across the economy. Collateral scarcity \u2014 when eligible assets are insufficient to meet reserve needs \u2014 can cause overnight rates to spike above target independently of CB intent."}, {"x": 6.550621509552002, "y": -19.25088119506836, "z": -2.041170597076416, "id": "repo_clearing_segments_ficc_001", "title": "Repo Market Clearing Segments FICC Triparty GCF DVP NCCBR", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "The U.S. repo market is segmented into four clearing structures \u2014 triparty (uncleared GC via BNY Mellon, MMFs as cash lenders), GCF Repo (cleared interdealer GC via FICC), DVP Repo (cleared specific-collateral interdealer via FICC), and NCCBR (uncleared specific-collateral bilateral, dealers + hedge funds) \u2014 each producing a distinct overnight rate (TPR=TGCR, GCF index, DVP, NCCBR) used by the Fed to calibrate its rate corridor."}, {"x": 17.557714462280273, "y": -15.763038635253906, "z": -4.987039089202881, "id": "imf_exchange_rate_assessment_crawling_peg_design_001", "title": "IMF Exchange Rate Assessment And Crawling Peg Design", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The IMF assesses exchange rate appropriateness using four complementary indicators (real exchange rate, FX reserve trend, current account balance, parallel market premium), none of which is individually decisive. When a fixed peg becomes untenable because of persistent inflation differential, the crawling peg regime provides a middle path: a preannounced depreciation path preserves nominal discipline (anchor function) while preventing competitiveness erosion. The critical design choice is passive crawl (match inflation differential \u2192 preserve real exchange rate) vs. active crawl (depreciate less than inflation \u2192 accept some competitiveness loss to decelerate inflation). An active crawl sacrifices exports for disinflation; extending the band width accommodates capital inflows without requiring full sterilization.\n"}, {"x": 11.849815368652344, "y": 21.714984893798828, "z": -0.3041074872016907, "id": "pbc_interest_rate_transmission_dr007_to_lpr_001", "title": "PBC Interest Rate Transmission DR007 to LPR", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "China's interest rate transmission chain flows from PBC OMO operations \u2192 7-day interbank repo rate (DR007, the short-term benchmark) \u2192 MLF rate (medium-term policy rate) \u2192 Loan Prime Rate (LPR, quoted as a spread to the MLF) \u2192 retail lending rates; money market conditions and short-end government yields respond to PBC liquidity operations, while medium- and long-term yields are primarily driven by macroeconomic expectations. [LLM]"}, {"x": 22.91887092590332, "y": 4.724965572357178, "z": 13.665513038635254, "id": "yen_intervention_liquidity_drain_mec_001", "title": "Yen Intervention Liquidity Drain Mechanism", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Yen intervention by the Ministry of Finance (MoF) acts as a global liquidity drain; by selling US Treasuries to buy Yen, Japan effectively reduces the supply of global dollar collateral while increasing selling pressure on US rates.\n"}, {"x": 6.524294853210449, "y": -18.971025466918945, "z": -1.6064298152923584, "id": "repo_market_structure_gc_sc_cleared_001", "title": "Repo Market Structure GC SC Cleared Segments and SEC Mandate", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "The U.S. repo market is organized along two dimensions: (1) purpose \u2014 General Collateral (GC/triparty: cash-focused) vs Specific Collateral (SC/DVP/bilateral: securities-focused), and (2) clearing \u2014 centrally cleared via FICC vs non-centrally cleared. The four resulting segments (triparty uncleared, GCF cleared, DVP cleared, NCCBR uncleared) produce a rate hierarchy (o/n TPR < o/n GCF < o/n DVP < o/n NCCBR) and underlie the Fed's three secured benchmarks (TGCR, BGCR, SOFR). The SEC's mandatory central clearing mandate (July 2027) will force most NCCBR volumes into FICC-cleared segments, permanently reshaping the rate complex.\n"}, {"x": 19.997095108032227, "y": 6.624195098876953, "z": 17.656204223632812, "id": "quantitative_tightening_qt_balance_sheet_runoff_001", "title": "Quantitative Tightening QT Balance Sheet Runoff", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Quantitative Tightening (QT) reduces the Fed balance sheet by allowing maturing securities to roll off without reinvestment, up to a monthly redemption cap. QT destroys reserves and bank deposits when investors fund bond purchases with bank deposits \u2014 but its tightening effect is limited: Atlanta Fed research estimates .2T of QT equivalent to only 0.29-0.74% in rate hikes over three years."}, {"x": 12.50935173034668, "y": 21.22515869140625, "z": -1.1103627681732178, "id": "pbc_medium_term_lending_facility_rate_transmission_001", "title": "PBC Medium-Term Lending Facility Rate Transmission", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The PBC's Medium-Term Lending Facility (MLF) provides 12-month collateralized funding to commercial and policy banks at the PBC's medium-term policy rate; since 2017, the MLF rate has served as the anchor for the Loan Prime Rate (LPR) \u2014 the benchmark for commercial lending \u2014 creating a transmission chain from PBC policy to retail credit conditions. [LLM]"}, {"x": 19.997499465942383, "y": 6.297071933746338, "z": 18.007076263427734, "id": "tqt_coupon_duration_tightening_001", "title": "TQT Tighter Quantitative Tightening Coupon Issuance Duration Channel", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "TQT (Tighter Quantitative Tightening) \u2014 when the U.S. Treasury shifts issuance from short-term bills toward longer-duration coupon bonds (notes and bonds) \u2014 is more effective at tightening financial conditions than standard QT, because duration risk forces investors to reassess risk tolerance and sell riskier assets to offset the new duration exposure; the Treasury (not the Fed) controls this dimension of financial tightening."}, {"x": 15.901662826538086, "y": 23.768798828125, "z": 0.22147142887115479, "id": "discount_window_stigma_self_reinforcing_equilibrium_001", "title": "Discount Window Stigma Self-Reinforcing Equilibrium", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Discount window stigma is a self-reinforcing Nash equilibrium: banks that access the window are perceived as distressed, causing other banks with surplus reserves to demand above-market rates from recent window borrowers, which makes the window option more costly than paying a premium in interbank markets \u2014 perpetuating the stigma and undermining the Fed's lender of last resort function. [LLM]"}, {"x": 8.776968002319336, "y": -1.012114405632019, "z": 8.246820449829102, "id": "private_credit_insurer_structural_channel_001", "title": "Private Credit Insurer Structural Channel", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "Life insurers have become structural anchor investors in private credit, growing US private placement holdings from $386bn (2014) to $849bn (2024, 14% of general account assets), driven by asset-liability matching logic and post-crisis yield compression; private equity entry into insurance as a source of permanent capital created a vertically integrated origination-to-funding loop that industrialized this channel at scale."}, {"x": 10.500853538513184, "y": 8.261229515075684, "z": 10.452662467956543, "id": "sofr_systemic_blindspot_libor_001", "title": "SOFR Systemic Risk Blindspot LIBOR Secured Lending Standard", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "SOFR's replacement of LIBOR resolved benchmark manipulation risk but introduced a new systemic blindspot \u2014 because SOFR is secured (repo-backed), it does not spike during bank funding stress the way LIBOR did, making it a poor early-warning signal of unsecured credit stress; meanwhile the global secured lending standard (RFRs replacing IBORs in derivatives, bonds, and loans) has tightened the linkage between private finance and sovereign balance sheets."}, {"x": 5.15752649307251, "y": -19.42852783203125, "z": -1.877219796180725, "id": "repo_market_mechanics_triparty_bilateral_001", "title": "Repo Market Mechanics Triparty Bilateral", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "The repo market is the secured funding backbone of the US financial system, executing 3-4 trillion dollars daily across three segments: triparty (custodian-intermediated), GCF (centrally cleared interdealer), and NCCBR (bilateral, hedge-fund-dominated). Repo makes Treasuries functionally equivalent to cash and prices its rates into SOFR, the global USD benchmark."}, {"x": 14.703163146972656, "y": -8.65513801574707, "z": 5.017549514770508, "id": "endogenous_bank_money_loans_create_deposits_001", "title": "Endogenous Bank Money Creation Loans Create Deposits", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Banks create money endogenously by making loans: when a creditworthy borrower receives a loan, the bank simultaneously creates a new asset (the loan IOU) and a new liability (a deposit) ex nihilo \u2014 no prior deposit or reserve is needed. The central bank then provides whatever reserves are required for interbank settlement at the target policy rate. The money supply is therefore demand-driven (endogenous), not supply-constrained by the monetary base as the neoclassical money multiplier implies. The CB sets the price of money (short-term interest rate), not its quantity."}, {"x": 16.81014060974121, "y": 8.768649101257324, "z": 11.1624116897583, "id": "fed_policy_rate_shift_effr_to_secured_rate_tgcr_001", "title": "Fed Policy Rate Shift EFFR to Secured Rate TGCR", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed's EFFR target has become a technical artifact of FHLB-GSE regulatory arbitrage rather than genuine interbank borrowing demand \u2014 Fed Funds volume collapsed ~80% post-2008 and surviving activity is dominated by FHLB\u2192FBO IORB arbitrage and FHLB\u2192G-SIB IBDA intraday liquidity trades. The inevitable replacement is a two-step evolution: first TGCR (Triparty General Collateral Rate, $1T+ of MMF\u2192dealer repo funding), then SOFR (broader, captures DVP segment too). TGCR is preferred over BGCR (adds GCF interdealer noise) and over SOFR (adds speculative DVP volumes that will be reshaped by the SEC's July 2027 central clearing mandate). Targeting an administered rate (IORB or ON RRP) was ruled out as it would shift power between Fed factions and erode public trust.\n"}, {"x": 16.58993148803711, "y": 9.505271911621094, "z": 9.01477336883545, "id": "fhlb_effr_iorb_arbitrage_floor_mechanism_001", "title": "FHLB EFFR IORB Arbitrage Floor Mechanism", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Federal Funds rate (EFFR) is maintained near the IORB floor primarily through FHLB arbitrage: FHLBs, ineligible for IORB, lend reserves to banks at EFFR (slightly below IORB), which deposit at the Fed for a spread; this creates a soft floor on EFFR and means SOFR rising above IORB is the key leading indicator that reserve scarcity is transitioning from ample to binding."}, {"x": 16.483177185058594, "y": 3.620500087738037, "z": 19.400283813476562, "id": "fed_qe_debt_maturity_transformation_fiscal_impact_001", "title": "Fed QE Debt Maturity Transformation Fiscal Impact", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Fed QE programs perform a 'maturity swap' on the consolidated public sector balance sheet (Fed + Treasury). By purchasing long-term fixed-rate Treasuries and issuing floating-rate reserves (IORB), the Fed effectively converts the sovereign's interest rate hedge into a floating-rate mortgage. This creates a 'Giant Carry Trade' for the public sector, which generates profits when rates are low but causes massive fiscal losses\u2014and a cessation of Fed remittances to the Treasury\u2014when interest rates rise."}, {"x": 13.490738868713379, "y": 20.633750915527344, "z": 0.38635796308517456, "id": "floor_system_rate_convergence_mechanism_001", "title": "Floor System Rate Convergence Mechanism", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "In a floor system, the overnight interbank rate converges to the central bank's reserve remuneration rate (DFR/IORB) through two arbitrage conditions: (1) borrowing banks can shop among banks with excess reserves, preventing rates from rising far above the remuneration rate; and (2) banks with excess reserves will never lend below the remuneration rate \u2014 together creating a natural floor with three advantages: reliable rate control, balance sheet size as a separable policy instrument, and expanded supply of safe liquid assets. [LLM]"}, {"x": 12.440505027770996, "y": 12.415369987487793, "z": 10.782611846923828, "id": "btfp_svb_crisis_emergency_lending_001", "title": "BTFP SVB Crisis and Fed Eme
