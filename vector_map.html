rgency Lending Evolution", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "SVB's March 2023 collapse \u2014 driven by uninsured deposit flight amplified by social media \u2014 revealed that the Discount Window's Primary Credit Facility was too stigmatized for bank use, prompting the Fed to create the BTFP (loans at par value, 1-year term). The BTFP later became a risk-free arbitrage (BTFP rate < IORB \u2192 50bps spread) before expiring March 2024, prompting a broader reform agenda including Discount Window \"prepositioning\" and destigmatization.\n"}, {"x": 15.343985557556152, "y": 10.849568367004395, "z": 10.245173454284668, "id": "fed_overnight_reverse_repo_on_rrp_mec_001", "title": "Fed Overnight Reverse Repo ON RRP", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The ON RRP facility serves as the Federal Reserve's primary rate-floor mechanism and \"liquidity shock absorber.\" It accepts cash from non-bank entities (MMFs, GSEs, Primary Dealers) overnight in exchange for Treasury collateral, effectively \"neutralizing\" excess reserves and preventing money market rates from falling below the FOMC's target range.\n"}, {"x": -15.351180076599121, "y": 7.696918964385986, "z": -0.7334398031234741, "id": "dv01_duration_001", "title": "DV01, Duration, and Convexity \u2014 Fixed Income Risk Measures", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "DV01 (dollar value of a basis point) measures the price change of a fixed income instrument for a 1bp parallel shift in yields. Duration (modified) is the percentage price sensitivity; convexity captures the curvature \u2014 the fact that price-yield relationship is non-linear. Together they form the fundamental risk language for all fixed income positions: hedging, relative value, and P&L attribution.\n"}, {"x": 13.38902473449707, "y": 11.889833450317383, "z": 10.562397956848145, "id": "srf_structural_defects_morning_repo_001", "title": "SRF Structural Defects Morning Repo Fortification And True Ceiling", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The SRF's advertised ceiling rate (SRFR) understates the true effective ceiling because dealers need ~25bps over SRFR to cover SRF balance sheet costs (can't net trades), haircuts on collateral, and negative carry risk \u2014 defects partially addressed by \"morning Fed repos\" (December 2024) that let dealers borrow at dawn rather than waiting until 1:15pm, but stigma persists structurally and cannot be eliminated by price or timing fixes alone."}, {"x": 16.365211486816406, "y": 9.276359558105469, "z": 11.71922779083252, "id": "fhlb_ibda_intraday_resolution_liquidity_001", "title": "FHLB IBDA Intraday Resolution Liquidity and Fed Funds Market Survival", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Post-2017, the Fed's G-SIB resolution liquidity requirements (from \"living wills\") created demand for around-the-clock HQLA buffers that overnight Fed Funds cannot satisfy. FHLBs \u2014 barred from earning IORB \u2014 filled this gap by supplying intraday reserves to G-SIBs via IBDAs (Interest-Bearing Deposit Accounts) at 5-10bps above the FOMC target range. This is why the Fed Funds market survived post-2008 despite being nearly extinct \u2014 it evolved into an IBDA/intraday liquidity mechanism dominated by FHLB lending. FHLBs now constitute ~97% of all Fed Funds lending.\n"}, {"x": 12.42488956451416, "y": 23.80921173095703, "z": 0.6673956513404846, "id": "gilt_treasury_spread_monetary_policy_expectations_driver_001", "title": "Gilt-Treasury Spread Monetary Policy Expectations Driver", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The 10-year gilt-Treasury spread is primarily driven by relative monetary policy expectations (captured in the 2-year spread), not by UK fiscal credibility; the 2022 Truss/Kwarteng mini-budget showed a genuine fiscal credibility crisis manifests in simultaneous gilt spread widening AND sterling depreciation \u2014 while 2023-2026 gilt spread widening accompanied sterling appreciation, pointing to UK inflation being stickier than US inflation as the true driver. [LLM]"}, {"x": 15.568354606628418, "y": 23.36435317993164, "z": -1.121609091758728, "id": "japan_consolidated_public_sector_sovereign_wealth_fund_mechanism_001", "title": "Japan Consolidated Public Sector Sovereign Wealth Fund Mechanism", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Japan's consolidated public sector (government + BoJ + public pension + GPIF) operates as a leveraged sovereign wealth fund: it borrows short at near-zero rates (JGBs 107% GDP + BoJ reserves 91% GDP = 275% GDP liabilities) and invests long in risky assets (domestic equities + unhedged foreign securities = 95% GDP), earning excess returns of ~6% GDP annually above funding costs \u2014 a structure that creates massive interest rate and FX risk at the consolidated balance sheet level. [LLM]"}, {"x": -6.337745666503906, "y": -16.806406021118164, "z": -1.072821021080017, "id": "asset_swap_mechanics_and_spread_001", "title": "Asset Swap Mechanics And Spread", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "An asset swap packages a fixed-rate bond purchase with a pay-fixed receive-floating interest rate swap, transforming the bond into a synthetic floater; the resulting asset swap spread (LIBOR + spread) isolates the bond's credit spread from interest rate risk, making it a credit-pure relative value metric."}, {"x": 20.185707092285156, "y": 9.7692232131958, "z": 20.921293258666992, "id": "treasury_general_account_tga_reserve_swap_mec_001", "title": "Treasury General Account TGA Reserve Swap", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Treasury General Account (TGA) is the US government's checking account held at the Federal Reserve.  Changes in the TGA result in an opposite 1:1 change in bank reserves (dTGA = -dReserves) unless the Fed  adjusts its assets to maintain ample reserves. The TGA acts as an \"autonomous factor\" that directly  competes with reserves for space on the Fed's liability side.\n"}, {"x": 17.216672897338867, "y": 5.3111443519592285, "z": 17.083026885986328, "id": "debt_ceiling_extraordinary_measures_treasury_001", "title": "Debt Ceiling Extraordinary Measures Treasury", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "When the US debt ceiling binds, the Treasury deploys extraordinary measures to delay default while drawing down the TGA. The resulting TGA drawdown floods banking system reserves, creating a temporary liquidity surge that overstates system health before reversing sharply when the ceiling is lifted and Treasury refills the TGA."}, {"x": 4.150331974029541, "y": 0.3409813642501831, "z": 5.947797775268555, "id": "central_bank_pledgening_runnable_liabilities_001", "title": "Central Bank Pledgening Runnable Liabilities and Discount Window Reform", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Post-SVB, monetary leaders are reforming LoLR (lender of last resort) access via \"prepositioning\" \u2014 requiring banks to pre-pledge enough assets at the Discount Window to cover a specified share (~40%) of \"runnable\" liabilities (uninsured deposits >$250k), destigmatizing emergency borrowing while creating structural demand for Treasury and other high-quality collateral. This reinforces the \"secured standard\" where sovereign liabilities are structurally embedded in the banking system.\n"}, {"x": 18.430438995361328, "y": -1.6308974027633667, "z": -3.429865837097168, "id": "mon_pol_trans_short_long_frictions_mec_001", "title": "Monetary Policy Transmission Short Long Rate Frictions", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Transmission from short-term policy rates to medium- and long-term yields is non-linear and subject to structural frictions, including asymmetric effectiveness across business cycles and shifts in market expectations that can decouple policy actions from long-term rate movements.\n"}, {"x": 18.736873626708984, "y": 9.051652908325195, "z": 21.203357696533203, "id": "ample_reserves_buffer_sizing_tga_volatility_001", "title": "Ample Reserves Buffer Sizing TGA Volatility", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The minimum ample reserves buffer required for rate control can be estimated as B = sigma*sqrt(Delta)*z*(epsilon*Delta/2), where sigma is the standard deviation of TGA changes over the intervention interval Delta; calibrated to 2021-2025 parameters (sigma~00bn/2-week), this yields a buffer of 00-400bn \u2014 halving to 00-150bn if TGA volatility returned to pre-pandemic levels, implying that TGA management reform is the most tractable lever for Fed balance sheet reduction."}, {"x": 13.533146858215332, "y": 2.0631096363067627, "z": 17.139659881591797, "id": "mechanism_treasury_dealer_capacity_001", "title": "Treasury Market Dealer Intermediation Capacity", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Primary dealers intermediate between Treasury issuance and end investors by warehousing Treasury inventory on their balance sheets. Their capacity to do so is directly constrained by regulatory capital ratios \u2014 SLR, LCR, and G-SIB surcharge \u2014 which treat Treasury holdings as consuming balance sheet. As Treasury supply has grown from ~$14tn (2019) toward ~$30tn (2025), dealer intermediation capacity has grown proportionally less, creating a structural capacity gap that widens during stress events (March 2020, September 2019, SVB March 2023).\n"}, {"x": -1.74813711643219, "y": -0.23743665218353271, "z": 2.9542670249938965, "id": "non_maturity_deposit_fair_margin_and_replicating_portfolio_001", "title": "Non Maturity Deposit Fair Margin And Replicating Portfolio", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Non-maturing deposits (NMDs) \u2014 accounts where clients can withdraw or deposit at any time and the bank can change the rate \u2014 are modeled via a 'fair margin' concept: the margin is the NPV-zero increase in the client coupon, and a dynamic investment strategy hedges this margin against interest rate movements, replacing the static replicating portfolio approach."}, {"x": 18.1578369140625, "y": 6.291520118713379, "z": 15.890660285949707, "id": "treasury_tbill_supply_rrp_drain_mmf_routing_001", "title": "Treasury T-bill Supply RRP Drain And MMF Cash Routing", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "T-bill supply and Fed ON RRP balances are substitutes for MMF cash: high T-bill issuance routes MMF funds out of the RRP into bills (draining RRP, boosting reserves), while T-bill supply contractions \u2014 particularly during debt ceiling episodes \u2014 drive MMF cash back into the RRP, inflating it and preventing reserve growth even as the TGA is drawn down."}, {"x": 19.015419006347656, "y": 7.213486671447754, "z": 17.513307571411133, "id": "policy_fed_qt_2022_001", "title": "Fed Quantitative Tightening 2022 \u2014 Balance Sheet Runoff Policy", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed's 2022 QT reduced the balance sheet passively via maturity non-replacement, draining reserves first from the ON RRP buffer (money funds withdrew from RRP as T-bill rates rose above ON RRP rate) and then from bank reserves. The existence of the $2.4tn ON RRP buffer created a significant cushion before reserves became scarce, fundamentally changing QT dynamics vs the 2017\u20132019 episode.\n"}, {"x": 22.0194091796875, "y": 2.991089105606079, "z": 15.564613342285156, "id": "policy_boj_qqe_ycc_001", "title": "BoJ Quantitative and Qualitative Easing + Yield Curve Control (2013\u20132024)", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The BoJ's QQE + YCC regime was the most extensive unconventional monetary program by any G7 central bank: unlimited JGB purchases at fixed yields (YCC) converted the BoJ into buyer of last resort for Japanese sovereign debt, enabled a consolidated public sector sovereign carry trade at 91% of GDP, and enforced financial repression by stripping duration from private portfolios and suppressing household savings returns.\n"}, {"x": 17.832805633544922, "y": 8.270551681518555, "z": 18.254688262939453, "id": "policy_fed_hike_cycle_2022_001", "title": "Fed Rate Hike Cycle 2022\u20132023", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed's 2022\u20132023 tightening cycle \u2014 525bps in 11 meetings \u2014 was the fastest since Volcker, triggered by post-COVID supply shock inflation amplified by fiscal stimulus. The simultaneous QT added a balance sheet tightening channel. The cycle strained banking sector duration positions (SVB March 2023) and tested the ample reserves framework's resilience to rapid reserve drainage.\n"}, {"x": 19.597240447998047, "y": 11.363143920898438, "z": 15.898868560791016, "id": "warsh_balance_sheet_stimulus_swap_vs_structural_demand_neutrality_con_001", "title": "Warsh Balance Sheet Stimulus Swap Vs Structural Demand Neutrality", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Warsh argument treats balance-sheet reduction as a way to \"redeploy\" stimulus into lower policy rates, but the clipping argues that this is a category error when the Fed is merely meeting structural reserve demand. In that critique, shrinking the balance sheet because structural reserve demand has fallen does not create spare stimulus to spend on rate cuts.\n"}, {"x": 3.4324951171875, "y": 9.074594497680664, "z": 2.0468595027923584, "id": "irrbb_eve_nii_dual_metric_framework_001", "title": "IRRBB EVE NII Dual Metric Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Basel IRRBB regulation (BCBS 368, 2016) mandates two complementary metrics \u2014 Economic Value of Equity (EVE) and Net Interest Income (NII) sensitivity \u2014 to measure structural interest rate risk in the banking book, capturing both long-run economic impact and short-run earnings impact from rate shocks."}, {"x": 16.925783157348633, "y": 3.812830686569214, "z": 16.291255950927734, "id": "sovereign_debt_intervention_ladder_001", "title": "Sovereign Debt Intervention Escalation Ladder", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Central bank and fiscal authorities follow a graduated intervention ladder when sovereign bond markets destabilize \u2014 from Treasury buybacks (no monetary expansion) through SLR relief, Fed \"soft ceiling\" (temporary YCC), and full YCC \u2014 with each step representing a greater commitment and higher political cost, and full YCC reserved only when inflation is persistently subdued."}, {"x": 26.239971160888672, "y": 3.765465259552002, "z": 4.690025329589844, "id": "volcker_fed_reaction_function_break_frm_001", "title": "Volcker Fed Reaction Function Break", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Volcker shift was a break in the Fed reaction function: after 1979, the Fed responded more than one-for-one to inflation shocks, temporarily used monetary targeting, and subordinated output stabilization to restoring inflation credibility.\n"}, {"x": 13.050044059753418, "y": 15.35562515258789, "z": 6.91338586807251, "id": "pboc_monetary_policy_framework_and_interest_rate_transmission_001", "title": "PBOC Monetary Policy Framework And Interest Rate Transmission", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The PBOC operates a hybrid quantity-price framework where M2+TSF serve as intermediate targets, DR007 is the operational target, and the 7-day OMO reverse repo is the primary policy rate since July 2024 \u2014 supported by an asymmetric SLF/excess-reserve corridor, multiple structural facilities, and discretionary window guidance."}, {"x": 16.110654830932617, "y": 10.489174842834473, "z": 6.488309860229492, "id": "ecb_new_operational_framework_frm_001", "title": "ECB New Operational Framework 2024", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The ECB's 2024 framework is a hybrid \"range floor\" system that steers the overnight market rate (\u20acSTR) near the Deposit Facility Rate (DFR) using structural reserves and a narrowed 15bps spread to the Main Refinancing Operations (MRO) rate.\n"}, {"x": 20.956703186035156, "y": 12.242009162902832, "z": 17.168071746826172, "id": "warsh_fed_balance_sheet_operating_doctrine_frm_001", "title": "Warsh Fed Balance Sheet Operating Doctrine", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Warsh's balance-sheet doctrine is not just \"QT for its own sake.\" It is a broader operating model in which the Fed shrinks its market footprint, stops allocating credit, keeps maturity-risk management with the Treasury, and uses the balance sheet mainly for short-term reserve provision or collateralized lending rather than for long-duration asset accumulation.\n"}, {"x": 26.778621673583984, "y": 2.1054563522338867, "z": 4.084192752838135, "id": "us_1970s_stagflation_policy_regime_shift_frm_001", "title": "US 1970s Stagflation And Policy Regime Shift", "source": "wiki", "domain": "macro_outlook", "type": "concept", "thesis": "US stagflation in the 1970s reflected a regime break in which demand pressure, oil shocks, distributional conflict, productivity slowdown, and weak monetary credibility made the Phillips-curve tradeoff unstable and forced a shift toward inflation-first central banking.\n"}, {"x": 14.907121658325195, "y": -1.1620043516159058, "z": -2.6045854091644287, "id": "cb_three_techniques_rate_control_001", "title": "CB Three Techniques Short Rate Control Floor Corridor Full Allotment", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Bindseil (2014) identifies three fundamental techniques for a central bank to control the short-term interbank overnight rate: (1) one-directional standing facility (floor or ceiling system \u2014 banks systematically use one facility, which anchors market rates); (2) symmetric corridor with OMO volume set by CB (two-sided standing facilities equidistant from target, with market rate floating to target if net reserves balanced); (3) full allotment OMO within corridor (banks choose quantity demanded at a fixed rate, which anchors the market rate). These are the only three logically distinct approaches; all real-world implementations are combinations or variants. The 'separation principle' \u2014 that macroeconomic rate-setting and day-to-day implementation are fully separable \u2014 breaks down in crisis."}, {"x": 17.351627349853516, "y": 12.455300331115723, "z": 19.117900848388672, "id": "cb_balance_sheet_trilemma_frm_001", "title": "Central Bank Balance Sheet Trilemma", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "A central bank cannot simultaneously achieve three objectives: (1) a small balance sheet, (2) low short-term rate volatility, and (3) limited intervention in money markets. Only two can be achieved at once in a given regulatory and operational environment.\n"}, {"x": 20.65242576599121, "y": 12.3936185836792, "z": 16.025699615478516, "id": "warsh_credit_allocation_exit_frm_001", "title": "Warsh Credit Allocation Exit Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Warsh's credit-allocation doctrine argues that the Fed should stop steering credit toward particular sectors through asset purchases such as MBS. If the state wants sectoral subsidy or emergency support, that choice should be made by the Treasury or Congress, where political accountability belongs.\n"}, {"x": 24.242511749267578, "y": -6.7593512535095215, "z": -11.903815269470215, "id": "imf_sna_real_sector_accounting_gdp_identities_and_sectoral_accounts_001", "title": "IMF SNA Real Sector Accounting GDP Identities And Sectoral Accounts", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The 1993 SNA framework measures GDP via three equivalent approaches (production/income/expenditure), organizes each sector's transactions through a sequence of accounts from production to capital formation, and generates the fundamental identity that the current account equals the private saving-investment gap plus the fiscal balance \u2014 the backbone of IMF Article IV analysis."}, {"x": 21.30375862121582, "y": 2.9223451614379883, "z": 16.113523483276367, "id": "japan_sovereign_carry_trade_frm_001", "title": "Japan Sovereign Carry Trade Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Japanese public sector (government + BoJ + pension funds) operates as a giant, leveraged sovereign wealth fund that borrows at floating short-term rates (bank reserves) to fund long-duration risky assets (equities and foreign securities), creating a massive sensitivity to rising interest rates.\n"}, {"x": 20.79646873474121, "y": 10.851716041564941, "z": 19.93048858642578, "id": "fed_treasury_operational_choice_space_frm_001", "title": "Fed Treasury Operational Choice Space", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "The relationship between the Federal Reserve and the Treasury is an operational design space, not a fixed natural law. The location of government cash, the size of the Treasury's balance at the Fed, and the rules that govern interaction with reserves can all be redesigned, which means part of the Fed's balance-sheet footprint is a policy choice rather than a necessity.\n"}, {"x": 17.267919540405273, "y": 9.091445922851562, "z": 8.683196067810059, "id": "fed_ample_reserves_range_floor_frm_001", "title": "Fed Ample Reserves Range Floor Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed maintains a \"range floor\" for the Federal Funds Rate (FFR) using two administered rates \u2014 IORB for banks and ON RRP for non-banks \u2014 to manage market segmentation and ensure rate control within an ample reserves regime.\n"}, {"x": 14.770508766174316, "y": -6.6462321281433105, "z": 3.248599052429199, "id": "cb_reserve_requirements_taxonomy_surplus_shortage_liquidity_001", "title": "CB Reserve Requirements Taxonomy And Surplus Shortage Liquidity Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Reserve requirements serve five distinct policy purposes (monetary policy, liquidity management, structural liquidity, revenue, and sectoral behaviour); separately, whether a CB operates with a liquidity surplus (asset-driven balance sheet, e.g. FX intervention, debt monetisation) or shortage (liability-driven, e.g. inflation targeting with floating rate) fundamentally shapes the effectiveness of monetary policy transmission, CB income, and CB's ability to control terms of market operations."}, {"x": 13.073258399963379, "y": 11.70305061340332, "z": -3.1719970703125, "id": "capital_flow_push_pull_determinants_eme_001", "title": "Capital Flow Push-Pull Determinants in EMEs", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Capital flows to EMEs are jointly determined by global push factors (advanced-economy interest rates, VIX, global growth) and domestic pull factors (EME growth, yields, exchange rate stability, institutional quality). FDI is driven primarily by domestic fundamentals and governance; portfolio and banking flows are dominated by global push factors and respond faster and more reversibly. The composition of inflows determines the FX target + sterilization burden: PI and short-term bank flows require the most sterilization and generate the largest quasi-fiscal costs. [LLM]\n"}, {"x": 5.767853260040283, "y": -0.2624233067035675, "z": 8.264655113220215, "id": "private_credit_stress_monitoring_001", "title": "Private Credit Stress Monitoring Framework", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "[LLM] Since private credit fund NAVs are model-based and not continuously observable, stress monitoring must rely on four observable proxy layers: (1) BDC discount to NAV as the public-market window into opaque portfolios, (2) credit secondary market clearing prices vs. reported NAV, (3) repurchase cap breaches in semi-liquid funds, and (4) bank credit line utilization to PC vehicles. These four signals form a real-time transmission chain that can detect the inversion of the [[Private_Credit_Reflexive_Loop]] without depending on manager marks.\n"}, {"x": 21.4097843170166, "y": 11.162436485290527, "z": 17.283456802368164, "id": "fed_balance_sheet_recomposition_and_net_expansion_frm_001", "title": "Fed Balance Sheet Recomposition and Net Expansion", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed can shorten the duration and sector mix of its balance sheet by increasing short-term Treasury holdings while letting MBS and long bonds run off, but that is a composition shift, not an automatic increase in total assets. Total assets rise only when net purchases exceed runoff or sales.\n"}, {"x": 5.575765132904053, "y": 6.240146160125732, "z": 5.544302463531494, "id": "basel_iii_endgame_001", "title": "Basel III Endgame \u2014 Capital, Liquidity, and Credit Migration", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Basel III and its Endgame extensions create a structured causal chain: RWA requirements + output floor + leverage ratio + LCR/NSFR raise the cost of holding specialized and long-duration corporate credit \u2192 banks are driven from originate-to-hold to originate-to-distribute \u2192 private credit funds fill the financing gap, reaching $2.1T globally. Critically, risk is not eliminated but redistributed: bank solvency risk converts to network liquidity risk in the bank-NBFI interconnected system.\n"}, {"x": 22.82793426513672, "y": 5.818869113922119, "z": 0.09164168685674667, "id": "em_cb_policy_mix_fit_framework_001", "title": "EM Central Bank Policy Mix And FIT Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Perry & Juhro's post-GFC paradigm for emerging market central banking: the 'policy mix' combines (1) flexible inflation targeting (FIT) with an explicit exchange rate stabilization role; (2) macroprudential policy to manage financial procyclicality and systemic risk; (3) capital flow management (CFM) to navigate the impossible trinity; and (4) payment system policy \u2014 these four pillars form a coordinated dual mandate (price stability + financial system stability) replacing the pre-GFC single-instrument ITF focused solely on price stability."}, {"x": -15.754369735717773, "y": 8.355778694152832, "z": 5.308505058288574, "id": "duration_targeting_convergence_yield_001", "title": "Duration Targeting Convergence To Yield And Statistical Immunization", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Duration-targeted (DT) bond portfolios \u2014 which maintain a stable duration through periodic rebalancing \u2014 exhibit a gravitational pull toward the initial yield over multi-year horizons, regardless of whether yields rise or fall; the key insight (Homer-Leibowitz 2013 edition): over a horizon equal to approximately 2\u00d7duration\u22121 years ('effective maturity'), cumulative accruals precisely offset cumulative price gains/losses, making annualized return converge to the initial yield for virtually any yield path; this creates 'statistical immunization' and simultaneously a 'yield trap' \u2014 you cannot escape the initial yield without changing the duration target."}, {"x": 25.95871925354004, "y": 3.9335668087005615, "z": 0.9101123213768005, "id": "stagflation_policy_response_tradeoff_frm_001", "title": "Stagflation Policy Response Tradeoff Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "In a stagflation shock, the policy choice is state-contingent: central banks can look through direct price effects only if inflation expectations remain anchored and the shock does not become persistent through wages, contracts, or production networks.\n"}, {"x": 23.319673538208008, "y": -6.621833324432373, "z": -12.572216033935547, "id": "imf_gfs_fiscal_accounting_framework_deficit_measurement_and_sustainability_001", "title": "IMF GFS Fiscal Accounting Framework Deficit Measurement And Sustainability", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "The IMF Government Finance Statistics framework measures the fiscal deficit through revenue-expenditure-net lending accounts, decomposes it into conventional/primary/operational measures, traces financing into bank/non-bank/external categories, and assesses sustainability via the debt dynamics equation \u2014 the standard IMF financial programming fiscal module."}, {"x": 10.411842346191406, "y": 7.883054256439209, "z": 10.705653190612793, "id": "fed_volatility_suppressor_secured_standard_001", "title": "Fed Volatility Suppressor and Secured Standard Evolution", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Post-GFC, regulators engineered a transition from an unsecured to a secured lending standard (LIBOR \u2192 SOFR, Fed Funds \u2192 repo/IORB), forcing banks to become utilities constrained by Basel III while shadow banks absorbed risk. However, this created a paradox: Treasuries \u2014 the collateral powering the secured standard \u2014 are only truly \"risk-free\" when the Fed commits to buying them without limit. The Fed's \"volatility suppressor\" (unlimited QE commitment) emerged as the necessary backstop of the secured standard, meaning every Basel III tightening increases reliance on Fed intervention. The RRP \u2192 SRF escalation ladder operates as a \"Not-QE\" buffer that allows the Fed to stimulate without a formal pivot.\n"}, {"x": 24.82598304748535, "y": -7.339194297790527, "z": -12.923836708068848, "id": "imf_public_expenditure_taxonomy_001", "title": "IMF Public Expenditure Analysis \u2014 Taxonomy and Policy Issues", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "Public expenditure analysis addresses three fundamental problems: spending level (aggregate fiscal stance), efficiency (value delivered per unit of spending), and mix (allocation across types and programs). The IMF taxonomy disaggregates expenditure into wages/salaries, goods and services, subsidies (7 forms), transfers, interest, and capital. Subsidies are the most analytically complex category \u2014 spanning cash grants to regulatory subsidies and exchange rate subsidies \u2014 and include large quasi-fiscal operations that do not appear in the budget. The primary macroeconomic concern is controlling the wage bill and subsidy burden, which are the most politically rigid and most inflationary components of government spending. [LLM]\n"}, {"x": 11.849815368652344, "y": 21.714984893798828, "z": -0.3041074872016907, "id": "pbc_dual_track_monetary_policy_framework_001", "title": "PBC Dual-Track Monetary Policy Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The PBC operates a dual-track monetary policy framework combining price-based instruments (interest rates) and quantity-based instruments (RRR, credit quotas, structural facilities), constrained by a managed-float exchange rate and partial capital account controls that limit the degree of monetary autonomy \u2014 unlike advanced-economy central banks that rely almost exclusively on interest rate policy. [LLM]"}, {"x": 20.660337448120117, "y": -7.2388482093811035, "z": -10.165140151977539, "id": "imf_macro_crisis_vector_framework_001", "title": "IMF Macro Crisis Vector Framework \u2014 Fiscal, External, And Banking Transmission", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The IMF Macro Accounting framework identifies three distinct crisis vectors, each with a specific balance-sheet transmission mechanism: (1) Fiscal vector \u2014 4 modes of deficit financing each generate a distinct macroeconomic imbalance (inflation, exchange rate crisis, debt explosion, crowding out); (2) External vector \u2014 under a fixed peg, unsustainable current account deficits trigger rational speculative attacks before reserves are exhausted; reserve adequacy must be assessed against financial vulnerability indicators (M2/FX ratio, short-term FX liabilities) rather than just the 3-month import rule; (3) Banking vector \u2014 the fractional reserve system's maturity mismatch makes banks inherently illiquid; a single bank's payment difficulty can freeze credit across the entire system through a confidence contagion chain, requiring LOLR intervention. The 4-sector flow of funds matrix (government, private, banking, external) is the accounting tool for tracing which sector's imbalance is generating each crisis vector.\n"}, {"x": -15.75240707397461, "y": 8.689607620239258, "z": 5.4190449714660645, "id": "duration_targeting_bond_portfolio_framework_001", "title": "Duration Targeting Bond Portfolio Framework", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Institutional bond portfolios implicitly or explicitly maintain a stable duration target via periodic rebalancing, creating a predictable convergence toward initial yield at the 'effective maturity' horizon (\u2248 2\u00d7 duration target), regardless of the yield path taken."}, {"x": 25.719449996948242, "y": -4.137562274932861, "z": 4.195517539978027, "id": "imf_monetary_analysis_quantity_theory_velocity_and_exchange_rate_regimes_001", "title": "IMF Monetary Analysis Quantity Theory Velocity And Exchange Rate Regimes", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "IMF monetary analysis builds from the quantity equation (MV=PY) through demand for money (income elastic, opportunity-cost elastic) to the money multiplier mm=(c+1)/(c+r), showing that under fixed exchange rates money supply is endogenous and monetary autonomy requires a floating regime, with sterilization as a costly short-term offset."}, {"x": 23.322154998779297, "y": 6.5289082527160645, "z": -1.0572330951690674, "id": "inflation_targeting_001", "title": "Inflation Targeting Framework (ITF) and Post-GFC Policy Mix", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Inflation Targeting Framework (ITF), pioneered by New Zealand (1988), achieved price stability through four pillars: a published inflation target, interest-rate consistency (Taylor rule), CB independence, and transparency. While successful pre-GFC, the framework proved insufficient alone \u2014 the post-GFC paradigm adds macroprudential policy, FX market intervention, and capital flow management to achieve the dual mandate of price stability AND financial system stability.\n"}, {"x": 13.934690475463867, "y": 3.0366199016571045, "z": 10.576966285705566, "id": "global_dollar_system_eurodollar_architecture_001", "title": "Global Dollar System Eurodollar Architecture", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "The global dollar system is a network of 26+ interconnected offshore dollar funding markets \u2014 including FX swaps, Eurodollars, cross-currency basis swaps, and international repos \u2014 in which countries are not merely users but essential structural components. The system cannot function if key participants (e.g. French banks in European repo, Australian banks in FX swaps) withdraw, making it self-reinforcing despite its structural fragilities."}, {"x": 23.278533935546875, "y": 10.332135200500488, "z": 20.55868911743164, "id": "fed_fiscal_agent_treasury_relationship_frm_001", "title": "Fed Fiscal Agent Treasury Relationship", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Federal Reserve Banks serve as the primary fiscal agent for the U.S. Treasury, providing the operational infrastructure for the federal government's banking, debt issuance, and payment processing; this relationship makes the Fed's balance sheet the nexus where fiscal and monetary flows converge, most visibly through the Treasury General Account (TGA).\n"}, {"x": 22.19837188720703, "y": -9.28193187713623, "z": -11.067647933959961, "id": "imf_balance_of_payments_framework_and_external_account_analysis_001", "title": "IMF Balance of Payments Framework and External Account Analysis", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The BoP records all resident/non-resident transactions using double-entry accounting; key analytical tools are the current/capital/financial account identity, debt sustainability indicators (PV/exports threshold 220%), and reserve adequacy rules (3-month import cover; Greenspan-Guidotti monetary base rule)."}, {"x": 14.79212474822998, "y": -1.8896093368530273, "z": -2.091106414794922, "id": "monetary_policy_instruments_operational_framework_001", "title": "Monetary Policy Instruments Operational Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Central bank monetary policy implementation rests on three instruments: open market operations (CB-initiated), standing facilities (bank-initiated, creating the interest rate corridor), and reserve requirements. The separation principle holds that implementation (achieving the target rate) is institutionally distinct from monetary macroeconomics (identifying the target rate), with the dichotomy breaking down only in financial crises."}, {"x": 17.852746963500977, "y": -6.756004810333252, "z": -10.03105354309082, "id": "imf_financial_programming_nda_ceiling_bop_monetary_approach_001", "title": "IMF Financial Programming \u2014 NDA Ceiling And Monetary Approach To BOP", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The IMF financial programming framework rests on the monetary survey identity: any excess of domestic credit (NDA) expansion over the increase in money demand is mechanically reflected in a one-for-one decline in net foreign assets (NFA) \u2014 a BOP deficit. This is the theoretical justification for setting NDA ceilings as the primary conditionality tool in Fund-supported adjustment programs. The framework also distinguishes the controllability hierarchy among reserve money components: claims on DMBs (Cb) are most directly under CB control; NFA is largely exogenous (BOP outcome); NCG is often passively determined by the government's fiscal position (especially without CB independence). This hierarchy determines where conditionality is most binding.\n"}, {"x": 26.715003967285156, "y": 3.46748685836792, "z": 1.1601766347885132, "id": "stagflation_regime_diagnostic_frm_001", "title": "Stagflation Regime Diagnostic Framework", "source": "wiki", "domain": "macro_outlook", "type": "concept", "thesis": "Stagflation is best diagnosed as a regime in which inflation pressure is supply-side or cost-side while real activity weakens, forcing policy makers to choose between inflation stabilization and employment/output protection.\n"}, {"x": 8.443794250488281, "y": 6.598631858825684, "z": 4.941250324249268, "id": "basel_regional_implementation_dynamics_001", "title": "Basel Regional Implementation Dynamics", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "[LLM] The same Basel III framework produces dramatically different private credit market outcomes across regions because initial banking structures differ: the US (market-centric, gold-plating) created the world's deepest PC market post-2008; the EU (bank-centric) faces a larger Output Floor shock (MRC +21.3%) now generating the largest structural white space; APAC/Vietnam applies Basel more flexibly but faces a delayed catalyst as capital requirements tighten toward 2027\u20132030.\n"}, {"x": 26.837032318115234, "y": 5.609159469604492, "z": 0.9438660740852356, "id": "supply_shock_scenario_taxonomy_frm_001", "title": "Supply Shock Policy Response Scenario Taxonomy", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "A decision-making framework that partitions potential outcomes of a supply shock into discrete scenarios based on shock persistence and the emergence of second-round effects, allowing central banks to communicate state-contingent policy paths rather than a single forecast. [LLM]\n"}, {"x": 18.61760711669922, "y": 6.6004109382629395, "z": 14.961841583251953, "id": "fed_reserve_demand_reduction_tools_001", "title": "Fed Reserve Demand Reduction Four Policy Tools", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "If the Fed aims to reduce the size of its balance sheet, four enabling policy tools can reduce the minimum required quantity of reserve balances without disrupting monetary policy implementation: (1) Temporary Open Market Operations (TOMOs) to sterilize unintended reserve shocks (TGA changes, FBO quarter-end window dressing); (2) revising liquidity regulations to reduce GSIB aversion to using Fed facilities; (3) adding a Liquidity Savings Mechanism (LSM) to Fedwire; and (4) tiering the IORB rate so banks with excess reserves prefer to lend them rather than hoard. The UK (BoE demand-driven approach) and Norway/New Zealand (IORB tiering) provide empirical precedents."}, {"x": 20.58570671081543, "y": 13.056432723999023, "z": 17.447921752929688, "id": "fed_treasury_accord_2026_frm_001", "title": "New Fed-Treasury Accord (2026 Proposal)", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The 2026 Accord proposal redefines the boundary between fiscal and monetary policy by returning control of debt maturity structure to the Treasury and narrowing the Fed's mandate to price stability, thereby reducing the Fed's market footprint and its role in deficit monetization.\n"}, {"x": 12.100625991821289, "y": -3.733421564102173, "z": 2.757723569869995, "id": "central_bank_balance_sheet_structure_liabilities_assets_001", "title": "Central Bank Balance Sheet Structure Liabilities Assets", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The central bank balance sheet has banknotes and bank reserves as primary liabilities (together forming the monetary base) and domestic securities, credit operations, and foreign assets on the asset side. Reserves are created mechanically when the CB buys assets or lends to banks \u2014 they cannot be lent to the real economy directly, only transmitted through the banking system via credit creation."}, {"x": 21.510913848876953, "y": -6.746731758117676, "z": -11.247647285461426, "id": "imf_flow_of_funds_4_sector_consistency_framework_001", "title": "IMF Flow Of Funds 4-Sector Consistency Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The IMF Flow of Funds framework integrates SNA, GFS, BoPM, and monetary survey into a quadruple-entry matrix where sectoral saving-investment gaps (Sp-Ip) + (Sg-Ig) = CAB, and every sector's real deficit is fully financed by financial transactions \u2014 forming the accounting backbone of IMF financial programming."}, {"x": 14.25385856628418, "y": 22.847299575805664, "z": 1.429630994796753, "id": "fed_balance_sheet_trilemma_small_stable_minimal_001", "title": "Fed Balance Sheet Trilemma Small-Stable-Minimal", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed faces a balance sheet trilemma: it can simultaneously achieve only two of (1) small balance sheet, (2) low short-term rate volatility, and (3) limited money market intervention \u2014 in its current configuration, the balance sheet cannot shrink further without accepting either greater rate volatility or more interventionist market operations; the trilemma is \"local\" (given current rules/institutions) and can be broken by changing global parameters such as TGA management reform or Standing Repo Facility improvements. [LLM]"}, {"x": 21.40606689453125, "y": 12.74187183380127, "z": 17.681175231933594, "id": "warsh_maturity_sovereignty_frm_001", "title": "Warsh Maturity Sovereignty Framework", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "Warsh's maturity-sovereignty view assigns the Treasury, not the Fed, primary responsibility for the government's debt-duration profile. The Fed may supply reserves or provide temporary market-function support, but it should not systematically transform long-duration Treasury debt into overnight liabilities through QE because that reverses the Treasury's own maturity choice.\n"}, {"x": 32.354103088378906, "y": -5.221729278564453, "z": -6.25046443939209, "id": "labor_market_unemployment_taxonomy_nairu_001", "title": "Labor Market Unemployment Taxonomy And NAIRU", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The IMF framework identifies five unemployment categories (seasonal, frictional, cyclical, structural, disguised) each requiring distinct policy responses. The NAIRU (Non-Accelerating Inflation Rate of Unemployment) defines the inflation- compatible full employment floor \u2014 below it, demand management generates inflation without sustainable output gains. In transition economies, \"disguised unemployment\" (workers with zero or negative marginal product, common in SOEs) is the dominant form \u2014 standard unemployment statistics systematically understate true labor market distress.\n"}, {"x": 29.969087600708008, "y": -9.296113967895508, "z": -2.7208938598632812, "id": "imf_tax_revenue_analysis_elasticity_buoyancy_effort_tanzi_001", "title": "IMF Tax Revenue Analysis \u2014 Elasticity, Buoyancy, Tax Effort, and Tanzi Diagnostic", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "The IMF fiscal revenue framework distinguishes two core measurement concepts \u2014 elasticity (revenue response under an unchanged tax system, measuring built-in flexibility) vs. buoyancy (total revenue response including discretionary changes, measuring overall performance) \u2014 and combines them with taxable capacity analysis to compute tax effort: how intensively a country uses its tax base relative to structural capacity. The Tanzi 8-criterion diagnostic test provides an operational checklist for assessing revenue productivity. The inflation\u2013collection lag relationship (Tanzi effect) degrades real revenue under high inflation, creating a vicious cycle of deficit \u2192 monetization \u2192 inflation \u2192 eroded real revenue \u2192 larger deficit.\n"}, {"x": 28.088869094848633, "y": -1.6068018674850464, "z": -11.711142539978027, "id": "imf_inflation_analysis_cpi_gdp_deflator_four_types_core_001", "title": "IMF Inflation Analysis \u2014 CPI vs GDP Deflator, Four Inflation Types, Core vs Underlying", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The IMF inflation analysis framework distinguishes four causal types (policy-induced, cost-push, demand-pull, inertial) and two measurement dimensions (one-time price-level shift vs. sustained inflation rate; measured vs. core/underlying inflation). The CPI and GDP deflator measure different things: coverage (consumer vs. all production), treatment of imports (included in CPI, excluded from deflator), and aggregation method (Laspeyres fixed-basket vs. Paasche current-basket). Core/underlying inflation \u2014 abstracting from discrete one-off shocks \u2014 is the policy-relevant variable, especially in transition and EM economies with frequent administered-price adjustments.\n"}, {"x": 17.971717834472656, "y": -1.2033230066299438, "z": -3.7338132858276367, "id": "mptm_framework_001", "title": "Monetary Policy Transmission Mechanism \u2014 All Channels", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The monetary policy transmission mechanism (MPTM) maps the process by which central bank interest rate decisions propagate through 7 channels \u2014 interest rate, asset price, exchange rate, expectations, bank lending, bank capital, and balance sheet \u2014 to ultimately affect inflation and output. The \"money view\" channels (interest rate, asset price, exchange rate) assume efficient financial markets; the \"credit view\" channels (lending, capital, balance sheet) emphasize financial frictions, asymmetric information, and the financial accelerator. The risk-taking channel adds a post-GFC dimension: low rates reduce risk perception, inducing excessive risk-taking. Total lag from policy to full effect: typically 6-8 quarters.\n"}, {"x": 18.251689910888672, "y": -7.755334377288818, "z": -10.154472351074219, "id": "imf_monetary_survey_and_reserve_money_identity_framework_001", "title": "IMF Monetary Survey And Reserve Money Identity Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The IMF Monetary Survey consolidates Monetary Authorities and Deposit Money Banks into a single balance sheet where M2 = NFA + NDA (net foreign assets plus net domestic credit), and reserve money growth is driven by changes in NFA, net claims on government, claims on banks, and other net items \u2014 the core identity underlying IMF financial programming."}, {"x": 11.270380020141602, "y": 7.678680419921875, "z": -1.6452052593231201, "id": "em_balance_sheet_crisis_anatomy_001", "title": "EM Balance Sheet Crisis Anatomy And Fear Of Floating", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "EM balance sheet crises follow a structurally recurring pattern: (1) rapid growth + financial opening \u2192 FX borrowing buildup by private sector; (2) implicit exchange rate guarantee (from limited FX flexibility) removes borrowers' incentive to hedge \u2192 moral hazard \u2192 large unhedged FX exposures in banking and nonbank sectors; (3) trigger event (sudden stop, risk premium spike, terms-of-trade shock) \u2192 authorities face 'fear of floating' \u2014 depreciation would bankrupt unhedged FX borrowers and collapse banks \u2192 authorities defend exchange rate at cost of reserves; (4) crisis becomes inevitable regardless of delay; the 3-sector FX balance sheet matrix (CB + banks + nonbanks, split by maturity and residency) is the analytical tool for diagnosing latent vulnerability before trigger."}, {"x": 9.896382331848145, "y": 4.2133917808532715, "z": 5.434518337249756, "id": "china_shadow_banking_wmp_trust_001", "title": "China Shadow Banking WMP Trust Structure and CBIRC Shutdown", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "China's shadow banking system emerged ~2000 as banks invented off-balance-sheet instruments (WMPs, entrusted loans, trust loans) to bypass a 75% loan-to-deposit ratio cap and fund credit-starved private firms ignored by the state-owned Big Four. Shadow assets peaked at ~90% of GDP in 2016, then declined to ~39% by Q2 2023 after regulators systematically penalized shadow instruments. Unlike the complex multi-layer US shadow system (CDOs, SIVs), China's was simpler \u2014 mainly trust companies and securities firms repackaging bank deposits as \"investment receivables\" \u2014 but equally capable of obscuring systemic risk.\n"}, {"x": 19.3564395904541, "y": 10.764504432678223, "z": 14.840394020080566, "id": "fed_balance_sheet_size_and_policy_rate_independence_con_001", "title": "Fed Balance Sheet Size and Policy Rate Independence", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "In an ample reserves regime, the Federal Reserve's balance sheet size and its policy rate (Federal Funds Rate) are independent instruments. The use of administered rates (IORB and ON RRP) allows the Fed to control the price of money regardless of the quantity of reserves, provided they remain above the system's structural demand floor.\n"}, {"x": -10.273564338684082, "y": 4.135706424713135, "z": 10.336316108703613, "id": "concept_fi_rv_001", "title": "Fixed Income Relative Value Framework", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Fixed income relative value (RV) is the systematic identification and monetisation of price discrepancies between economically similar instruments along four dimensions: carry (income earned per unit of risk), roll-down (P&L from yield curve passage of time), richness/cheapness (deviation from fitted curve), and duration-neutral spread trades. RV positions are constructed to isolate a single mispricing while hedging all other exposures.\n"}, {"x": 5.74999475479126, "y": 5.256500720977783, "z": 6.03533411026001, "id": "basel_driven_credit_migration_to_private_markets_001", "title": "Basel Driven Credit Migration To Private Markets", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Basel III's capital, leverage, and liquidity rules make holding long-duration unrated corporate credit economically irrational for regulated banks, creating a structural 'financing gap' that private credit funds fill; however, banks re-enter the risk via subscription lines and NAV loans to those same funds, converting bank solvency risk into network liquidity risk."}, {"x": 15.856230735778809, "y": 12.462225914001465, "z": 11.689577102661133, "id": "fedwire_payment_system_reserve_demand_and_lsm_policy_001", "title": "Fedwire Payment System Reserve Demand And LSM Policy", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Federal Reserve's Fedwire RTGS system generates a structural floor on reserve demand because banks must \"pre-load\" balances to cover gross outgoing payments; post-GFC regulatory stigma and intraday liquidity rules have collapsed daylight overdraft usage, forcing the Fed to maintain trillions in reserves to prevent payment delays and repo rate spikes.\n"}, {"x": -8.38347053527832, "y": -2.0163676738739014, "z": -10.990560531616211, "id": "sovereign_basis_trade_repo_leverage_001", "title": "Sovereign Basis Trade Repo Leverage", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "The cash-futures basis trade \u2014 hedge funds buying cash sovereign bonds via repo and selling futures \u2014 is a critical source of marginal demand in both US Treasury and European sovereign markets. Operating at extreme leverage (up to 200x in some European segments), these trades bind cash, futures, and repo markets together, but create systemic sensitivity to simultaneous repo funding shocks and cash-futures price detachments."}, {"x": 12.4750337600708, "y": 2.7718722820281982, "z": -1.213114619255066, "id": "financial_procyclicality_accelerator_macroprudential_001", "title": "Financial Procyclicality Financial Accelerator And Macroprudential Instruments", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Financial procyclicality is the dynamic interaction where the financial cycle amplifies the economic cycle: during booms, rising asset prices boost collateral values \u2192 more credit \u2192 higher asset prices \u2192 more leverage \u2192 bigger crash; three mechanisms drive this \u2014 the financial accelerator (net worth/external finance premium), collateral constraints (Kiyotaki-Moore), and risk-taking cycles; macroprudential instruments (LTV, CCyB, sectoral capital requirements) exist to dampen these self-reinforcing loops by imposing countercyclical buffers."}, {"x": 20.45796775817871, "y": 7.8268914222717285, "z": 17.183656692504883, "id": "qt_reserve_drain_effectiveness_and_deposit_funding_condition_001", "title": "QT Reserve Drain Effectiveness And Deposit Funding Condition", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Quantitative Tightening (QT) only reduces bank reserves and tightens credit conditions when it is funded by bank deposit outflows; when funded by MMF withdrawals from ON RRP, only the Fed's ON RRP liability shrinks while reserves are unchanged \u2014 making that QT phase financially neutral for banks."}, {"x": 15.274296760559082, "y": 21.332080841064453, "z": -1.3684101104736328, "id": "sovereign_debt_market_discipline_price_discovery_role_001", "title": "Sovereign Debt Market Discipline Price Discovery Role", "source": "wiki", "domain": "fiscal_policy", "type": "concept", "thesis": "High sovereign yields (as in the UK) serve as a market discipline mechanism that forces governments toward fiscal consolidation; artificially capping yields (as Japan via BoJ bond purchases, or eurozone via ECB TPI) does not eliminate the fiscal risk premium but displaces it into the currency \u2014 the Yen depreciation vs GBP stability pattern illustrates that sovereign risk shows up one way or another, and price discovery through yields is preferable to deferred currency adjustment. [LLM]"}, {"x": 13.680879592895508, "y": 23.881113052368164, "z": -1.169588327407837, "id": "private_equity_private_credit_integration_nexus_001", "title": "Private Equity Private Credit Integration Nexus", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Private credit is structurally intertwined with private equity: ~70% of private credit deals are PE-sponsored, and managers whose umbrella firms also run PE hold >75% of private credit assets \u2014 creating a reflexive loop where PE deal flow drives private credit origination, and private credit availability enables PE leverage, making credit conditions for the asset class closely correlated with PE fundraising cycles and exit activity. [LLM]"}, {"x": 20.54229736328125, "y": -12.827980041503906, "z": 3.631577730178833, "id": "currency_fed_liability_con_001", "title": "Currency as a Central Bank Liability", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Currency is classified as a central bank liability because it represents a claim on the sovereign that can be used to extinguish tax liabilities; it is the physical manifestation of the central bank's \"banking\" function where issued notes are IOUs providing public settlement services. [LLM]\n"}, {"x": 14.43810749053955, "y": -1.2918225526809692, "z": -2.922661781311035, "id": "central_bank_monetary_policy_operational_framework_typology_001", "title": "Central Bank Monetary Policy Operational Framework Typology", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Central bank monetary policy operations can be classified into three archetypes by how they control the short-term interest rate: (1) one-directional standing facility with daily OMOs, (2) symmetric corridor with CB-determined OMO volume, and (3) full-allotment lending within a standing-facility corridor; the choice determines whether reserves are scarce, ample, or excess, and how the interbank market functions."}, {"x": 14.81566333770752, "y": -7.7616376876831055, "z": 4.144386291503906, "id": "cb_reserve_system_constraint_multiplier_myth_001", "title": "CB Reserve System Level Constraint And Money Multiplier Myth", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Two foundational misconceptions about commercial bank reserves: (1) individual banks appear to choose between reserves and other assets, but at the system level total reserves are entirely determined by the central bank's balance sheet identities \u2014 no individual bank action can reduce system-wide reserves; (2) banks do not require reserves to lend \u2014 the money multiplier (reserves \u2192 lending) has causality reversed; broad money expands with economic activity and narrow money is subsequently supplied by the CB to meet requirements."}, {"x": 14.2360200881958, "y": 25.010343551635742, "z": 0.38369691371917725, "id": "usd_swap_lines_geopolitical_dollar_integration_tool_001", "title": "USD Swap Lines Geopolitical Dollar Integration Tool", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Beyond their liquidity function, Fed swap line extensions to new counterparty central banks serve as signals of deep institutional integration into the dollar system \u2014 providing privileged access to core dollar liquidity infrastructure while making it more costly for competing reserve currency arrangements (e.g., petroyuan) to displace USD in bilateral trade and financial flows. [LLM]"}, {"x": 18.19137954711914, "y": 2.1029856204986572, "z": 3.0622904300689697, "id": "transition_economy_monetary_issues_001", "title": "Transition Economy Monetary Special Issues", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Monetary analysis in transition economies (post-communist reform) faces five structural distortions absent from standard frameworks: (1) rapid, discrete velocity jumps (up to 3-fold in one quarter, Armenia/Georgia 1993); (2) banking systems that do not behave as profit maximizers (monobank legacy); (3) interenterprise arrears that substitute for bank credit when credit is tightened; (4) interest rates that may perversely amplify inflation via enterprise borrowing to service debt; (5) very wide lending-deposit spreads due to NPL burden, preferential credit legacy, and non-interest reserve requirements. Hyperinflation episodes (Cagan: \u226550% monthly) show real money demand can collapse to 1/30th of pre- inflation levels, with recovery taking years even after stabilization. [LLM]\n"}, {"x": 13.921009063720703, "y": 3.013423442840576, "z": 10.137045860290527, "id": "eurodollar_system_mechanics_and_post_reform_decline_001", "title": "Eurodollar System Mechanics And Post-Reform Decline", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Eurodollar system \u2014 offshore dollar banking settled onshore via Fed reserves \u2014 peaked as the dominant global dollar funding mechanism but was structurally gutted by Basel III LCR (2013) and 2014 SEC MMF reform, with unsecured interbank lending collapsing and SOFR/secured funding replacing LIBOR/unsecured as the global dollar standard."}, {"x": 8.750540733337402, "y": 0.20681233704090118, "z": 12.705519676208496, "id": "nbfi_sovereign_market_supervisory_gap_001", "title": "NBFI Sovereign Market Supervisory Gap", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The institutional infrastructure for managing stress in the NBFI sovereign buyer base \u2014 including data quality, supervisory frameworks, and crisis liquidity facilities \u2014 remains incomplete relative to their growing role as marginal buyers. This 'supervisory gap' is highlighted by the absence of an ECB liquidity facility for NBFIs (unlike the BoE's CNRF) and the migration of credit risk to leveraged, short-term funded entities while liquidity risk remains concentrated in the banking system."}, {"x": 5.222358703613281, "y": -14.492745399475098, "z": -10.901819229125977, "id": "ust_market_structure_onrun_offrun_001", "title": "UST Market Primary Secondary OnRun OffRun Structure", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "The U.S. Treasury market has two structurally distinct layers \u2014 the primary market (initial auction, globally liquid, dealer-intermediated) and the secondary market (secondary trading, concentrated in on-the-run bonds, with off-the-run bonds mostly held to maturity and prone to illiquidity) \u2014 with structural blindspots and monopoly power in the secondary layer that primary-market tools cannot address."}, {"x": 8.033161163330078, "y": -19.549877166748047, "z": -3.2015905380249023, "id": "triparty_repo_market_structure_and_daily_cycle_001", "title": "Triparty Repo Market Structure And Daily Cycle", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The US triparty repo market is a $4-5 trillion overnight funding market where BNYM acts as sole custodian/settlement agent; its daily operational cycle creates structural rate floors (ON RRP at 1pm) and ceilings (SRF at 1:30-1:45pm), while the opaque non-centrally-cleared bilateral repo (NCCBR) segment provides ~$2 trillion in hedge fund leverage outside regulatory visibility."}, {"x": 12.663573265075684, "y": -5.155910968780518, "z": 3.6480929851531982, "id": "cb_seigniorage_capital_loss_independence_001", "title": "CB Seigniorage Income Capital Loss And Policy Independence", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Central bank income derives primarily from seigniorage \u2014 the spread between the zero or near-zero cost of issuing liabilities (banknotes, reserves) and the income earned on backing assets; while CB losses are theoretically compatible with continued monetary policy effectiveness (CB always meets domestic currency liabilities), the empirical evidence shows that poorly-capitalised CBs are associated with poor policy outcomes \u2014 the binding constraint is reputational: accumulated losses must not exceed the net present value of future seigniorage income, beyond which credibility collapses."}, {"x": 9.393589973449707, "y": 4.641022682189941, "z": 5.152137279510498, "id": "shadow_banking_market_based_finance_001", "title": "Shadow Banking Market Based Finance", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Shadow banking (market-based finance) refers to credit intermediation outside the traditional deposit-taking banking system, primarily through repos, money market funds, ABS, and CLOs. It emerged from regulatory arbitrage under Basel I and grew to supersede traditional banking in credit supply; post-2008 it contracted to structurally essential components while remaining a systemic amplifier during stress."}, {"x": 13.680879592895508, "y": 23.881113052368164, "z": -1.169588327407837, "id": "insurance_pension_private_credit_structural_investor_role_001", "title": "Insurance Pension Private Credit Structural Investor Role", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Insurance companies and pension funds are the anchor investors in private credit because long-duration illiquid private credit naturally matches long-duration illiquid liabilities; life insurers grew private placement lending from $386bn (2014) to $849bn (2024), reaching 14% of general account assets \u2014 driven by post-2008 low rates and private equity firms acquiring life insurers to access \"permanent capital\"; however, as retail/semi-liquid channels grow, the investor base becomes more liquidity-sensitive, introducing reflexive redemption risk. [LLM]"}, {"x": 5.183306694030762, "y": -14.458123207092285, "z": 0.6796219944953918, "id": "collateral_velocity_and_pledged_collateral_market_mechanics_001", "title": "Collateral Velocity And Pledged Collateral Market Mechanics", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "Pledged collateral functions as a parallel money supply in financial markets \u2014 it can be reused (rehypothecated) multiple times, creating a 'velocity of collateral' analogous to money velocity; QE reduces this velocity by hoovering up high-quality collateral from the market, with the bilateral pledged-collateral market (not triparty) being the core of global financial plumbing."}, {"x": 21.437610626220703, "y": 9.3491849899292, "z": 20.999807357788086, "id": "tga_reserve_swap_mechanics_and_debt_ceiling_dynamics_con_001", "title": "Tga Reserve Swap Mechanics And Debt Ceiling Dynamics", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Treasury General Account (TGA) and bank reserves are offsetting liabilities on the Federal Reserve's balance sheet; every dollar the Treasury collects or issues as debt drains a dollar of reserves, while every dollar spent injects reserves, making TGA management a primary driver of systemic liquidity volatility, especially during debt ceiling episodes.\n"}, {"x": 14.1032075881958, "y": 22.847084045410156, "z": -1.9128180742263794, "id": "us_vs_europe_private_credit_market_structure_divergence_001", "title": "US vs Europe Private Credit Market Structure Divergence", "source": "wiki", "domain": "basel_risk", "type": "concept", "thesis": "The US private credit market is mature (corporate debt ~75-80% non-bank, structured via BDCs) while Europe remains bank-centric (~85% bank-financed) \u2014 Basel III/IV is a more acute catalyst in Europe, creating larger white space for private lenders; European harmonisation vehicles (ELTIF 2.0, AIFMD) are attempting to replicate the BDC access model, but fragmented regulation slows convergence. [LLM]"}, {"x": 5.745534896850586, "y": 7.193301677703857, "z": 5.432020664215088, "id": "basel_iii_capital_and_liquidity_constraint_mechanics_001", "title": "Basel III Capital And Liquidity Constraint Mechanics", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Basel III imposes four interlocking constraints on bank balance sheets \u2014 RWA-based capital ratio, Output Floor (72.5% of standardized RWA), Leverage Ratio (3-5% unweighted), LCR (30-day HQLA buffer), and NSFR (structural funding ratio) \u2014 that jointly make holding long-duration, unrated, or specialized corporate credit economically punitive, driving credit migration to private markets."}, {"x": 10.529058456420898, "y": 2.9706077575683594, "z": 6.7241411209106445, "id": "us_shadow_banking_post_gfc_market_based_finance_structure_001", "title": "US Shadow Banking Post-GFC Market Based Finance Structure", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Post-2008 US shadow banking transformed from a complex CDO/synthetic ABS machine into a repo-centric, collateral-based market-based finance system, where securitization (ABS, CLOs) survived but the toxic CDO-cubed structures collapsed; simultaneously, Principal Trading Firms (PTFs) replaced G-SIBs as the primary Treasury market makers due to Basel/SLR regulatory constraints on bank balance sheets."}, {"x": 19.027313232421875, "y": 11.627031326293945, "z": 16.381248474121094, "id": "warsh_balance_sheet_stimulus_swap_con_001", "title": "Warsh Balance Sheet Stimulus Swap", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The \"Warsh Hypothesis\" posits that the Fed's balance sheet and policy rate are substitutable forms of stimulus; significantly shrinking the balance sheet \"redeploys\" capacity, theoretically allowing for lower nominal interest rates without increasing aggregate monetary ease.\n"}, {"x": 14.646678924560547, "y": 23.31315040588379, "z": 0.19576597213745117, "id": "policy_trilemma_efficiency_frontier_equivalence_001", "title": "Policy Trilemma Efficiency Frontier Equivalence", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "A policy trilemma (any two of three objectives are achievable, never all three simultaneously) is mathematically equivalent to the claim that the status quo is already on the Pareto efficiency frontier of those three objectives \u2014 implying that any policy action must sacrifice at least one dimension; this framing reframes trilemmas from constraints into diagnostics of optimality. [LLM]"}, {"x": 16.590890884399414, "y": -3.5562961101531982, "z": -7.405611515045166, "id": "pboc_rmb_fix_counter_cyclical_factor_and_fx_management_001", "title": "PBOC RMB Fix Counter Cyclical Factor And FX Management", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The PBOC manages CNY via a daily central parity fix with \u00b12% band, augmented by a discretionary Counter-Cyclical Factor (CCF) embedded in the fix formula; since late 2023, conservative CCF settings have made the fix behave like a crawling peg, creating a positive CFETS-USDCNY correlation that signals PBOC is suppressing automatic stabilizer effects."}, {"x": 14.003321647644043, "y": 15.713191986083984, "z": 15.485811233520508, "id": "central_bank_credibility_supply_shock_policy_space_001", "title": "Central Bank Credibility Supply Shock Policy Space", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "A central bank's accumulated credibility determines its 'look-through' policy space during supply shocks. Well-anchored inflation expectations allow the CB to tolerate temporary inflation above target without responding (preserving growth), whereas low credibility or jumping expectations force the CB to react (hike) to send a signal of determination, even if the shock is transitory."}, {"x": 17.86356544494629, "y": 8.890256881713867, "z": 9.165715217590332, "id": "fed_ample_reserves_rate_control_framework_con_001", "title": "Fed Ample Reserves Rate Control Framework", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Post-GFC, the Fed shifted from a scarce-reserve corridor to an ample-reserve floor system where the Federal Funds Rate (FFR) is controlled via administered rates (IORB and ON RRP) rather than daily open market operations (OMOs). This framework relies on a \"leaky floor\" arbitrage mechanism and a standing backstop (SRF) to maintain the policy rate within the FOMC's target range.\n"}, {"x": 16.229534149169922, "y": -13.933277130126953, "z": -3.848288059234619, "id": "currency_substitution_dollarization_001", "title": "Currency Substitution and Dollarization \u2014 Monetary Control Implications", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Currency substitution occurs when residents hold FX assets (deposits, cash) as a substitute for domestic money, driven by high inflation, exchange rate instability, or institutional distrust of the CB. FX deposits/M2 ratios reached 30-60% in peak transition economies. Dollarization undermines CB monetary control: base money (RM) no longer fully determines M2 because FX deposits lie partly outside the domestic money multiplier chain. Attempts to reverse dollarization by force (banning FX deposits) typically backfire by driving FX holdings offshore, further shrinking the domestic monetary base. [LLM]\n"}, {"x": 22.357017517089844, "y": 13.929506301879883, "z": -6.465785026550293, "id": "us_macro_constraint_stack_fed_treasury_curve_inflation_external_sector_syn_001", "title": "US Macro Constraint Stack Fed Treasury Curve Inflation External Sector", "source": "wiki", "domain": "macro_outlook", "type": "concept", "thesis": "US macro outcomes are best read as a stack of linked constraints rather than as isolated indicators. Fed and Treasury plumbing sets the reserve and funding backdrop, the Treasury curve prices the policy path and term premium, inflation reflects both demand and supply/cost pressures, and import and exchange-rate channels determine how domestic shocks leak into prices and growth.\n"}, {"x": 14.78612232208252, "y": 8.626724243164062, "z": 9.058388710021973, "id": "indicator_effr_001", "title": "EFFR \u2014 Effective Federal Funds Rate", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The EFFR is the volume-weighted median rate of overnight federal funds transactions \u2014 uncollateralised lending of reserve balances between depository institutions. It is the Fed's operational target: the FOMC sets a target range (currently 25bps wide) and uses IORB and ON RRP to keep EFFR within that range. EFFR diverging from IORB toward the upper bound of the range is an early signal of emerging reserve scarcity.\n"}, {"x": 17.168903350830078, "y": 10.049530029296875, "z": 9.238645553588867, "id": "indicator_iorb_001", "title": "IORB \u2014 Interest on Reserve Balances", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "IORB is the interest rate the Federal Reserve pays on all reserve balances held by depository institutions, serving as the effective floor of the federal funds rate under the ample reserves operating framework. It replaced the distinction between required reserve interest (IOR) and excess reserve interest (IOER) in July 2021, when reserve requirements were set to zero. IORB is the primary lever the Fed uses to transmit the FOMC's target range into overnight money markets.\n"}, {"x": 20.598615646362305, "y": 7.679178714752197, "z": 13.923982620239258, "id": "lclor_qt_calibration_001", "title": "LCLoR Lowest Comfortable Level of Reserves and QT Calibration", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "The Fed calibrates QT (quantitative tightening) to drain reserves until they hit the LCLoR (Lowest Comfortable Level of Reserves) \u2014 estimated ~$3T for the US banking system \u2014 below which repo rates spike above the EFFR target range. The key early-warning signals are: rising EFFR above IORB, increasing daylight overdraft volumes, SRF usage picking up, and SOFR/TGCR printing above IORB. The RRP balance falling to zero is NOT the LCLoR signal \u2014 it merely means excess liquidity has been redeployed from the Fed's shock absorber to private markets.\n"}, {"x": 13.633824348449707, "y": 9.197717666625977, "z": 8.596970558166504, "id": "sofr_ff_basis_rde_liquidity_gauges_001", "title": "SOFR-FF Basis RDE and Money Market Liquidity Gauges", "source": "wiki", "domain": "monetary_policy", "type": "concept", "thesis": "Two complementary gauges measure reserve conditions in real time: (1) the SOFR-FF futures basis \u2014 positive = SOFR below EFFR = reserves abundant; negative = repo tighter than fed funds = reserves scarce; and (2) the Fed's internal Reserve Demand Elasticity (RDE) \u2014 near zero = ample, sharply negative = approaching scarcity \u2192 triggers QT pause/end. Both gauges are distorted by a \"liquidity mirage\" during debt ceiling episodes: TGA drawdowns inject reserves into the system, but much of the apparent liquidity flows into RRP rather than the banking system \u2014 creating an illusion of ample reserves that reverses sharply when the ceiling is resolved and TGA is refilled.\n"}, {"x": 13.004322052001953, "y": 9.36369800567627, "z": 9.05578899383545, "id": "indicator_sofr_effr_basis_001", "title": "SOFR\u2013EFFR Basis Spread", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "The SOFR\u2013EFFR basis measures the spread between the overnight secured repo rate and the overnight unsecured interbank rate. In the ample reserves floor system, this basis should be small and slightly negative. Persistent or spiking positive basis indicates dealer balance sheet stress, collateral shortage, or funding market dislocations \u2014 the key plumbing friction indicator in Conks' money market framework.\n"}, {"x": 12.509466171264648, "y": 9.189462661743164, "z": 9.476344108581543, "id": "indicator_sofr_001", "title": "SOFR \u2014 Secured Overnight Financing Rate", "source": "wiki", "domain": "financial_markets", "type": "concept", "thesis": "SOFR is the ARRC-endorsed replacement for USD LIBOR, capturing the broad US Treasury repo market across tri-party, bilateral, and GCF segments (~$1 trillion daily volume). Unlike EFFR (unsecured), SOFR is secured by Treasuries, making it sensitive to collateral availability and repo market stress. SOFR is the underlying rate for the vast majority of new USD floating-rate contracts and OIS derivatives post-2023.\n"}, {"x": 1.1842008829116821, "y": 12.558222770690918, "z": 13.067259788513184, "id": "raw__Bindseil_Monetary_Policy_Operations__0000", "title": "Bindseil_Monetary_Policy_Operations", "source": "raw", "domain": "monetary_policy", "type": "concept", "thesis": ""}, {"x": 6.489614486694336, "y": 12.663392066955566, "z": 9.265746116638184, "id": "raw__Bindseil_Monetary_Policy_Operations__0001", "title": "Bindseil_Monetary_Policy_Operations", "source": "raw", "domain": "monetary_policy", "type": "concept", "thesis": ""}, {"x": 2.1522767543792725, "y": 19.852666854858         const s=points[e.s], t=points[e.t];
        epos[i*6]=s.x; epos[i*6+1]=s.y; epos[i*6+2]=s.z||0;
        epos[i*6+3]=t.x; epos[i*6+4]=t.y; epos[i*6+5]=t.z||0;
    });
    const egeo = new THREE.BufferGeometry();
    egeo.setAttribute('position', new THREE.BufferAttribute(epos, 3));
    scene.add(new THREE.LineSegments(egeo, new THREE.LineBasicMaterial({
        color:0x00e5cc, opacity:0.07, transparent:true,
        blending:THREE.AdditiveBlending, depthWrite:false,
    })));
}

// Hover tooltip
const tooltip   = document.getElementById('tooltip');
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 5;
const mouse = new THREE.Vector2(-9999,-9999);

window.addEventListener('mousemove', e => {
    mouse.x =  (e.clientX/innerWidth)*2  - 1;
    mouse.y = -(e.clientY/innerHeight)*2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const wHits = raycaster.intersectObject(wikiCloud);
    const rHits = raycaster.intersectObject(rawCloud);
    let found = null, tc = null;
    if (wHits.length)      { found = wikiPts[wHits[0].index]; tc = TYPE_COLORS[found.type] || DEFAULT_COLOR; }
    else if (rHits.length) { found = rawPts[rHits[0].index];  tc = '#1565c0'; }

    if (found) {
        tooltip.style.display = 'block';
        const tx = e.clientX + 20, ty = e.clientY + 20;
        tooltip.style.left = (tx + 300 > innerWidth  ? e.clientX - 310 : tx) + 'px';
        tooltip.style.top  = (ty + 150 > innerHeight ? e.clientY - 160 : ty) + 'px';
        tooltip.innerHTML =
            '<div class="tip-title">' + found.title + '</div>' +
            '<span class="tip-badge" style="background:' + tc + '1a;color:' + tc + ';border:1px solid ' + tc + '55">' +
                (found.source === 'wiki' ? (found.type || 'concept') : 'raw') +
            '</span>' +
            (found.domain ? '<div class="tip-domain">' + found.domain + '</div>' : '') +
            (found.thesis ? '<div class="tip-thesis">' + found.thesis + '</div>' : '');
    } else {
        tooltip.style.display = 'none';
    }
});

window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

(function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
})();
</script>
</body>
</html>
