topic_slug: vietnam_imf_macro_2026
title: "Vietnam Macro Accounts — IMF Accounting Framework"
primary_question: "Dưới góc độ IMF macro accounting (SNA + GFS + BOP + Monetary Survey), cân đối vĩ mô của Việt Nam đang ở đâu và rủi ro chính là gì?"
sub_questions:
  - id: sq1
    text: "Real sector (SNA): GDP, tiết kiệm, đầu tư — saving-investment gap của khu vực tư và chính phủ?"
    probe_state: PARTIAL
    notes: "Savings ~37% GDP, investment ~30-33% GDP. FDI $35bn 2024. Private surplus ≈ +7.6% GDP."
  - id: sq2
    text: "Fiscal sector (GFS): cấu trúc thu-chi, thâm hụt, tài trợ — có quasi-fiscal không?"
    probe_state: PARTIAL
    notes: "Revenue 17.6% GDP 2024. Deficit 1.5% 2024 → 3.3% 2025. Debt 31.3% GDP. VBSP/VDB là quasi-fiscal."
  - id: sq3
    text: "External sector (BOP): cơ cấu CA surplus, dự trữ FX, financial account — adequate coverage?"
    probe_state: PARTIAL
    notes: "CA +6.1% GDP 2024. FX $80-83bn = 2.4 months imports (moderately below IMF adequacy)."
  - id: sq4
    text: "Monetary sector: Monetary Survey của SBV — M2 = NFA + NDA đang dịch chuyển như thế nào?"
    probe_state: PARTIAL
    notes: "Credit/GDP 134%. Credit growth 15% 2024, 19% Jun 2025. NFA giảm do FX intervention."
  - id: sq5
    text: "Flow of Funds 4-sector: sectoral balance identity có nhất quán? Rủi ro tích lũy ở đâu?"
    probe_state: PARTIAL
    notes: "(Sp-Ip) + (Sg-Ig) = CAB → private surplus 7.6% + govt deficit -1.5% = CA +6.1%. Nhất quán."
  - id: sq6
    text: "EM balance sheet vulnerability: FX mismatch, fear of floating, sudden stop risk cho Vietnam?"
    probe_state: TRUE_GAP
    notes: "Cần phân tích cụ thể FX exposure của ngân hàng và khu vực phi ngân hàng VN."

