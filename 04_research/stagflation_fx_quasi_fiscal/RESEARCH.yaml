primary_question: >
  How does stagflation emerge and persist in an economy operating under an FX rate
  target regime combined with significant quasi-fiscal operations (sterilization costs,
  CB quasi-fiscal losses, NCG accommodation)?

sub_questions:
  - "What are the transmission channels from FX target + sterilization to persistent inflation?"
  - "How do quasi-fiscal costs (sterilization losses, NCG expansion) drain fiscal space and suppress growth?"
  - "What is the sequencing: does inflation or stagnation come first in this regime?"
  - "How does fiscal dominance interact with the FX target to produce a stagflationary trap?"
  - "What are the diagnostic signals (CB balance sheet, NCG, NFA) that precede stagflation onset?"
  - "What exit paths exist from FX-target-induced stagflation without triggering a currency crisis?"

