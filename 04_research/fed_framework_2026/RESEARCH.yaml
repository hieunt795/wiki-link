# ── RESEARCH QUESTIONS ────────────────────────────────────────────────────────
primary_question: >
  What is the Fed's complete operating framework in 2026 — covering the interest rate path,
  QT trajectory, balance sheet composition, ON RRP drain, and reserve adequacy — and how do
  these elements interact to define the current monetary policy stance?

sub_questions:
  - "sq1: What is the current FOMC rate path and dot plot projections for 2026?"
  - "sq2: Where is QT in 2026 — pace, composition (Treasuries vs MBS), and estimated end date?"
  - "sq3: What is the status of the ON RRP facility — current balances, drain trajectory, policy implications?"
  - "sq4: Are reserves still ample in 2026 — signals: SOFR-IORB, EFFR-IORB, repo spikes?"
  - "sq5: What is the Fed's balance sheet composition and size target for end of normalization?"
  - "sq6: How does Treasury issuance (TGA, bill/coupon mix) interact with reserve supply in 2026?"
  - "sq7: What tools does the Fed have if reserve scarcity materializes (SRF, TOMOs, IORB tiering)?"

