primary_question: >
  What is driving the shape and level of the US Treasury yield curve in May 2026 —
  specifically: why is the long end elevated, what is the term premium decomposition,
  and what does the curve signal about inflation expectations, fiscal sustainability,
  and Fed policy path?

sub_questions:
  - "sq1: What does the full Treasury yield curve look like as of May 2026, and how does it compare to prior regimes?"
  - "sq2: How do we decompose the 10y nominal yield into: expected policy rate path, real rate (r*), inflation expectations (breakeven), and term premium (ACM)?"
  - "sq3: What structural forces are driving the long-end term premium — fiscal supply, Fed duration withdrawal, foreign demand, or inflation uncertainty?"
  - "sq4: What does the 5y5y forward inflation rate and TIPS breakeven structure imply about tariff inflation expectations?"
  - "sq5: How does Japan's Treasury selling and JGB yield normalization affect the US long end?"
  - "sq6: What are the RV implications — which points on the curve are rich/cheap, and what trades does the structure suggest?"

