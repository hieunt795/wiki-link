# ── RESEARCH QUESTIONS ────────────────────────────────────────────────────────
primary_question: >
  Làm thế nào để thiết kế và thực hiện một bài Liquidity Stress Test (LST)
  toàn diện trên balance sheet ngân hàng — bao gồm asset side (haircuts),
  liability side (outflow rates), và management response — theo best practice
  quốc tế (BCBS, EBA, FSI)?

sub_questions:
  - "Q1 — Balance sheet foundation: Cách xây dựng static balance sheet projection làm nền cho stress test là gì? Tại sao static (không rollover, không new business)?"
  - "Q2 — Scenario design: Ba loại scenario (idiosyncratic / market-wide / combined) được calibrate như thế nào? Severity được xác định theo nguyên tắc gì?"
  - "Q3 — Asset haircuts: HQLA haircut schedule (Level 1/2A/2B) và non-HQLA treatment dưới stress được quy định và áp dụng như thế nào?"
  - "Q4 — Liability outflows: Outflow rates theo counterparty type (retail stable/unstable, corporate, FI, wholesale) và contingent commitments được model ra sao?"
  - "Q5 — Management response (counterbalancing capacity): Các công cụ có sẵn (CB repo, asset sale, collateral posting) được quantify như thế nào? No-double-counting rule áp dụng thế nào?"
  - "Q6 — Output metrics: Survival horizon và Net Cumulative Cash Flow được tính và interpret như thế nào? Liên hệ với LCR/NSFR?"
  - "Q7 — Depositor behaviour assumptions: Behavioural assumptions cho NMD và retail deposits dưới stress được calibrate từ dữ liệu gì? Sensitivity analysis?"
  - "Q8 — Integration với ICAAP/ILAAP: LST kết nối với capital stress test (solvency-liquidity nexus) như thế nào trong báo cáo tổng hợp?"

