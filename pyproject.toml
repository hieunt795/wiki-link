[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "wiki-agentic"
version = "0.1.0"
description = "Bilingual macroeconomic research operating system with BGE-M3 retrieval"
requires-python = ">=3.11"
dependencies = [
    "FlagEmbedding>=1.2.11",
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.7.4",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "torch>=2.1",
]

[project.optional-dependencies]
gpu = ["faiss-gpu"]
fast = ["onnxruntime"]

[tool.setuptools.packages.find]
where = ["07_scripts"]

[project.scripts]
librarian = "librarian:main"
